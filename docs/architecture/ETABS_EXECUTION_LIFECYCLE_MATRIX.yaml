  - HISTORICAL
  - CSI_CONTRACT_CANDIDATE
  - LIVE_VERIFICATION_REQUIRED

authority_boundary:
  packages_etabs_gateway:
    role:
      - SOLE_PRODUCTION_COM_STA_SESSION_ATTACH_TRANSPORT_OWNER
      - BOUNDED_COM_CALLBACK_WORKER_THREAD_TRANSPORT_OWNER
    not_authority_for:
      - ANALYSIS_EXECUTION
      - DESIGN_EXECUTION
      - SCRATCH_LIFECYCLE
      - ENGINEERING_ORCHESTRATION
  tbdy_engine_etabs_safety:
    current_role: READ_SAFETY_BRIDGE
    may_reuse_gateway_worker_transport: true
  tbdy_engine_etabs_oapi:
    role: FACTUAL_ABI
    not_authority_for:
      - ANALYSIS_EXECUTION
      - DESIGN_EXECUTION
      - SCRATCH_LIFECYCLE
      - ENGINEERING_ORCHESTRATION
  future_lifecycle_execution:
    semantic_authority_sprints: [B4A, B4B, B5, B6]
    final_module_placement: FUTURE_ARCHITECTURE_PLACEMENT_REQUIRED
    supervisor_disposition_required: true
    unplaced_operations:
      - SapModel.File.OpenFile
      - SapModel.File.Save
      - TYPED_MODEL_SETTERS
      - SapModel.Analyze.SetRunCaseFlag
      - SapModel.Analyze.RunAnalysis
      - SapModel.Analyze.DeleteResults
      - SapModel.DesignConcrete.StartDesign
