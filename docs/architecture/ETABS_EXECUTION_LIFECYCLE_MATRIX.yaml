state_machine:
  SOURCE_ATTACHED_READONLY:
    controller: CURRENT_GATEWAY_SAFETY_READ_BRIDGE
    authority_note: "gateway supplies COM/STA/session/attach + bounded callback transport only"
    allowed: [factual_identity_state_reads, physical_source_pre_snapshot]
    forbidden: [Save, mutation, RunAnalysis, StartDesign]
    next: [SCRATCH_CREATED]
  SCRATCH_CREATED:
    controller: B4A_SEMANTIC_CONTROLLER
    architecture_placement: FUTURE_ARCHITECTURE_PLACEMENT_REQUIRED
    required_evidence: [scratch_creation_attempt_id, parent_source_identity, source_physical_pre, scratch_physical_initial]
    next: [SCRATCH_OPENED, FAILED_EXECUTION]
  SCRATCH_OPENED:
    controller: B4A_SEMANTIC_CONTROLLER
    architecture_placement: FUTURE_ARCHITECTURE_PLACEMENT_REQUIRED
    required_postconditions: [active_model_path_equals_scratch, source_physical_unchanged, scratch_ownership_qualified]
    next: [SCRATCH_MUTATED_UNANALYZED, FAILED_EXECUTION]
  SCRATCH_MUTATED_UNANALYZED:
    controller: B4B_SEMANTIC_CONTROLLER
    architecture_placement: FUTURE_ARCHITECTURE_PLACEMENT_REQUIRED
    required_postconditions: [every_set_read_back, mutation_manifest_complete, prior_analysis_identity_invalid, prior_design_identity_invalid]
    next: [SCRATCH_ANALYZED, FAILED_EXECUTION]
  SCRATCH_ANALYZED:
    controller: B5_SEMANTIC_ANALYSIS_EXECUTION_CONTROLLER
    architecture_placement: FUTURE_ARCHITECTURE_PLACEMENT_REQUIRED
    required_postconditions: [run_analysis_ret_zero, intended_cases_finished, source_integrity_unchanged, causal_analysis_result_identity_issued]
    next: [SCRATCH_DESIGN_READY, FAILED_EXECUTION]
  SCRATCH_DESIGN_READY:
    controller: B6_SEMANTIC_DESIGN_EXECUTION_CONTROLLER
    architecture_placement: FUTURE_ARCHITECTURE_PLACEMENT_REQUIRED
    required_preconditions: [qualified_analysis_result_identity, bound_design_code, bound_design_combo_state]
    next: [SCRATCH_DESIGNED, FAILED_EXECUTION]
  SCRATCH_DESIGNED:
    controller: B6_SEMANTIC_DESIGN_EXECUTION_CONTROLLER
    architecture_placement: FUTURE_ARCHITECTURE_PLACEMENT_REQUIRED
    required_postconditions: [start_design_ret_zero, design_results_available, required_result_population_complete, causal_design_result_identity_issued]
    next: [CLEANED_UP, FAILED_EXECUTION]
  FAILED_EXECUTION:
    controller: FUTURE_LIFECYCLE_SEMANTIC_CONTROLLER
    architecture_placement: FUTURE_ARCHITECTURE_PLACEMENT_REQUIRED
    hard_rules: [failed_analysis_no_AnalysisResultIdentity, failed_design_no_DesignResultIdentity, retry_new_execution_attempt, source_integrity_check_mandatory]
    next: [CLEANED_UP]
  CLEANED_UP:
    controller: B4A_SEMANTIC_CONTROLLER
    architecture_placement: FUTURE_ARCHITECTURE_PLACEMENT_REQUIRED
    required_postconditions: [source_integrity_verified, scratch_deleted_or_audit_retention_recorded, cleanup_result_recorded]

reuse_assets:
  LIFE-REUSE-001: "DedicatedSTAWorker serialized bounded callback transport and deterministic worker lifecycle; transport reuse does not confer analysis/design/scratch authority."
  LIFE-REUSE-002: "Typed gateway contract/read-only transport boundary."
  LIFE-REUSE-003: "Verified PID/model/session identity, units and lock facts."
  LIFE-REUSE-004: "DatabaseTablesReadTransaction and ResultsSetupReadTransaction restoration."
  LIFE-REUSE-005: "Analyze.GetCaseStatus factual readiness."
  LIFE-REUSE-006: "Analysis lineage no-public-positive-issuer causal contract."
  LIFE-REUSE-007: "Immutable analysis-basis snapshot/provenance from F0-5."
  LIFE-REUSE-008: "STAB-1 fail-closed reanalysis-required evidence."
  LIFE-REUSE-009: "SourceModelIdentity + EvidenceEpoch, explicitly not physical file proof."
  LIFE-REUSE-010: "Current OAPI factual reads and concrete-design result providers; factual ABI only."

rejected_patterns:
  LIFE-REJECT-001: "Public/provider raw SapModel escape."
  LIFE-REJECT-002: "Mutate/analyze/design immutable source in place."
  LIFE-REJECT-003: "Treat SourceModelIdentity as physical byte-integrity proof."
  LIFE-REJECT-004: "Treat pre-existing FINISHED status/results as causal execution proof."
  LIFE-REJECT-005: "Scratch ownership from UUID/path/filename/hash alone."
  LIFE-REJECT-006: "B6 explicitly owns/calls RunAnalysis."
  LIFE-REJECT-007: "SetPresentUnits as lifecycle normalization."
  LIFE-REJECT-008: "Invent SaveAs when exact documented API is File.Save(FileName)."
  LIFE-REJECT-009: "Issue trusted result identity from ret==0 alone."
  LIFE-REJECT-010: "Assume StartDesign cannot rerun analysis without live evidence."
  LIFE-REJECT-011: "Generic mutation rollback instead of scratch isolation."
  LIFE-REJECT-012: "Read-state restoration as proof of model-mutation rollback."
  LIFE-REJECT-013: "Infer lifecycle/execution semantic authority from gateway worker transport ownership."
  LIFE-REJECT-014: "Silently place new write/execution operations in gateway or OAPI without explicit supervisor disposition."

live_verification_required:
  - attach/source silent-write behavior
  - opening scratch and active-model switch semantics
  - File.Save(new_path) active-path and result-preservation semantics
  - OS-copy/open preservation of analysis results
  - OS-copy/open preservation of design results
  - unlock automatic result invalidation
  - property mutation automatic result invalidation
  - RunAnalysis partial-failure and stale-result behavior
  - StartDesign hidden/repeated analysis behavior
  - StartDesign/source-file write behavior
  - concrete design result freshness/clearing behavior
  - cleanup/reopen behavior and source physical before-after invariants

