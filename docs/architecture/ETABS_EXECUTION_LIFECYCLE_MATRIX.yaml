  B4B:
    status: NEW_REQUIRED
    architecture_placement: FUTURE_ARCHITECTURE_PLACEMENT_REQUIRED
    semantic_authority: B4B
    additions: [typed_domain_specific_mutation_commands, set_ret_readback_contract, mutation_manifest, analysis_design_identity_invalidation]
  B5:
    status: NEW_REQUIRED
    architecture_placement: FUTURE_ARCHITECTURE_PLACEMENT_REQUIRED
    semantic_authority: B5
    additions: [Analyze.GetRunCaseFlag_capability, Analyze.SetRunCaseFlag_capability, controlled_Analyze.RunAnalysis, case_status_qualification, optional_DeleteResults_policy, sole_AnalysisResultIdentity_issuer]
  B6:
    status: NEW_REQUIRED
    architecture_placement: FUTURE_ARCHITECTURE_PLACEMENT_REQUIRED
    semantic_authority: B6
    additions: [concrete_design_state_preflight, controlled_DesignConcrete.StartDesign, design_result_availability_completeness, trusted_DesignResultIdentity_issuer, guard_forbidding_RunAnalysis]

source_integrity:
  physical:
    minimum: [canonical_path, cryptographic_hash, size, mtime, existence]
