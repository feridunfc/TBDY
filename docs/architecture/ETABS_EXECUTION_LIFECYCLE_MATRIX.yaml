schema_version: "R-LIFE-1.2"
frozen_base: "6273c19030ab6ecb7ad2637e3bfc74f88b1da086"
mode: "STRICT_RESEARCH_ONLY"
status: "READY_FOR_SUPERVISOR_REVIEW"

evidence_levels:
