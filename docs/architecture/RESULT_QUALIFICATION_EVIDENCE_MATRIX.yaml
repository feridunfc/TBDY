source_model_identity:
  concept: verified source-model reference identity
  applies_to:
    - analysis
    - design
  source: tbdy_engine/integration/live_etabs_acquisition_context.py
  current_owner: SourceModelIdentity
  proves: exact normalized verified source-model reference used by the acquisition context
  does_not_prove: physical file bytes, current in-memory model state, analysis state, analysis generation, design generation, or result freshness
  necessary: true
  sufficient: false
  authority_class: CORRELATION_ONLY
  offline_verified: true
  live_verified: true
  consumers:
    - B2
    - B5
    - B6
  known_failure_modes:
    - same path may refer to a later changed model state
    - SaveAs/open-copy changes the source reference without proving execution lineage

model_fingerprint:
  concept: backward-compatible fingerprint of SourceModelIdentity reference semantics
  applies_to:
    - analysis
    - design
  source: tbdy_engine/integration/live_etabs_acquisition_context.py
  current_owner: SourceModelIdentity.model_fingerprint
  proves: equality of the bounded verified source-model reference fingerprint
  does_not_prove: model bytes, analysis state, AnalysisResultIdentity, design state, or DesignResultIdentity
  necessary: false
  sufficient: false
  authority_class: CORRELATION_ONLY
  offline_verified: true
  live_verified: true
  consumers:
    - B2
    - B5
    - B6
  known_failure_modes:
    - laundering source-reference equality into state equality
    - treating same fingerprint as result freshness

evidence_epoch:
  concept: immutable factual acquisition generation
  applies_to:
    - analysis
    - design
  source: tbdy_engine/features/evidence_epoch.py
  current_owner: EvidenceEpoch
  proves: facts were captured in the same factory-owned factual acquisition generation
  does_not_prove: AnalysisStateIdentity, AnalysisResultIdentity, analysis execution, design execution, or result freshness
  necessary: false
  sufficient: false
  authority_class: CORRELATION_ONLY
  offline_verified: true
  live_verified: true
  consumers:
    - B2
    - B5
    - B6
  known_failure_modes:
    - confusing acquisition generation with analysis/design generation
    - assuming a later epoch means a later ETABS execution

trusted_live_acquisition_context:
  concept: verified session plus source reference plus factual acquisition generation
  applies_to:
    - analysis
    - design
  source: tbdy_engine/integration/live_etabs_acquisition_context.py
  current_owner: TrustedLiveAcquisitionContext
  proves: source/session/acquisition provenance for factual reads
  does_not_prove: result causal generation
  necessary: true
  sufficient: false
  authority_class: CORRELATION_ONLY
  offline_verified: true
  live_verified: true
  consumers:
    - B2
    - B5
    - B6
  known_failure_modes:
    - acquisition_context_ref treated as AnalysisResultIdentity
    - acquisition_generation_ref treated as execution proof

feature_snapshot:
  concept: component-scoped factual feature and evidence projection
  applies_to:
