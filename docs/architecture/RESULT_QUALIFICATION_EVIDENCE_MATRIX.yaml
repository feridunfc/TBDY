  live_verified: false
  consumers:
    - B5
    - B2
    - B6
  known_failure_modes:
    - arbitrary generation string supplied without execution proof
    - finished subset from a partial attempt placed into result_scope_refs

analysis_lineage_qualification:
  concept: fail-closed positive/negative analysis lineage qualification
  applies_to:
    - analysis
    - design
  source: tbdy_engine/integration/etabs_analysis_lineage.py
  current_owner: AnalysisLineageQualification
  proves: when QUALIFIED, B1 state/result/proof coherence was satisfied by the trusted issuer after a fully successful declared attempt
  does_not_prove: anything when attempt evidence is partial, failed, fabricated, or incomplete
  necessary: true
  sufficient: true
  authority_class: REAL_CAUSAL_EVIDENCE
  offline_verified: true
  live_verified: false
  consumers:
    - B5
    - B2
    - B6
  known_failure_modes:
