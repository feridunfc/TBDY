reject_registry:
  REJECT-LEGACY-FALLBACK-ATTACH:
    pattern: Any production direct/fallback attach outside packages/etabs_gateway.
    reason: T1 gateway is the sole production COM/STA/session/attach owner.
  REJECT-T1-CUSTOM-COMTYPES-DEFAULT-WIN32:
    pattern: Explicit custom comtypes dependency followed by an implicit/default win32 attach attempt.
    reason: Closed dependency universe; default provider is unreachable unless explicitly selected.
  REJECT-T1-CUSTOM-RUNTIME-DEFAULT-COMTYPES:
    pattern: Explicit custom/fake runtime reaching default real comtypes helper/runtime when not explicitly selected.
    reason: Fake/custom runtime isolation is a negative architecture invariant.
  REJECT-T1-RAW-COM-ESCAPE:
    pattern: Returning SapModel/raw COM capability through legacy/product layers.
    reason: Raw capability ownership is retired outside bounded gateway/safety/OAPI execution.
  REJECT-NAME-HEURISTIC-AUTHORITY:
    pattern: Runtime case/property-name substring, regex, lexical or first-match heuristic used as formal engineering binding authority.
    reason: Discovery assistance is not reviewed binding authority.
  REJECT-FEATURE-REGULATORY-SEMANTIC-LEAK:
    pattern: Storing regulatory applicability, reviewed system selection or policy-derived governing demand as a factual FeatureSnapshot solely for convenience.
    reason: FeatureSnapshot remains factual; result-derived/policy authority uses its own lane.
  REJECT-ETABS-DESIGN-RESULT-AS-VERDICT:
    pattern: Treating an ETABS required/design result as the engine-selected/final detailing reinforcement or final TBDY verdict.
    reason: Design-result role and final engineering verdict/selection remain distinct.
  REJECT-MATCH-BROADCAST-TO-COMBOS:
    pattern: Broadcasting one matched analysis/design result across unproven combo/case identities.
    reason: Exact binding, lineage and result-selection identity must be preserved.
