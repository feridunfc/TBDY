reject_registry:
  REJECT-LEGACY-FALLBACK-ATTACH: {pattern: Any production direct/fallback attach outside packages/etabs_gateway., reason: T1 gateway is the sole production COM/STA/session/attach owner.}
  REJECT-T1-CUSTOM-COMTYPES-DEFAULT-WIN32: {pattern: Explicit custom comtypes dependency followed by implicit/default win32 attach., reason: Closed dependency universe.}
  REJECT-T1-CUSTOM-RUNTIME-DEFAULT-COMTYPES: {pattern: Explicit custom/fake runtime reaching default real comtypes helper/runtime when not explicitly selected., reason: Fake/custom runtime isolation.}
  REJECT-T1-RAW-COM-ESCAPE: {pattern: Returning SapModel/raw COM capability through legacy/product layers., reason: Raw capability ownership is retired outside bounded gateway/safety/OAPI execution.}
  REJECT-NAME-HEURISTIC-AUTHORITY: {pattern: 'Runtime case/property-name substring, regex, lexical or first-match heuristic as formal engineering binding authority.', reason: Discovery/diagnostics are not reviewed binding authority.}
  REJECT-FEATURE-REGULATORY-SEMANTIC-LEAK: {pattern: 'Store regulatory applicability, reviewed system selection or policy-derived governing demand as factual FeatureSnapshot.', reason: FeatureSnapshot remains factual.}
  REJECT-ETABS-DESIGN-RESULT-AS-VERDICT: {pattern: Treat ETABS required/design result as engine-selected/final detailing reinforcement or final TBDY verdict., reason: Design-result role and engineering verdict/selection are distinct.}
  REJECT-MATCH-BROADCAST-TO-COMBOS: {pattern: Broadcast component-level MATCH/readiness across unproven design combo identities., reason: 'Exact combo identity, definition and basis joins are required.'}
  REJECT-COMPONENT-MATCH-AS-DESIGN-LINEAGE: {pattern: component match -> design lineage, reason: Component identity/readiness is not causal design execution lineage.}
  REJECT-EVIDENCE-EPOCH-AS-DESIGN-LINEAGE: {pattern: EvidenceEpoch -> design lineage, reason: EvidenceEpoch identifies factual acquisition generation only.}
  REJECT-MODEL-FINGERPRINT-AS-DESIGN-LINEAGE: {pattern: model fingerprint -> design lineage, reason: Source-model reference fingerprint is not in-memory analysis/design state or causal execution proof.}
  REJECT-ROW-EXISTS-AS-DESIGN-RESULT-IDENTITY: {pattern: ETABS row exists -> DesignResultIdentity, reason: Row presence alone does not establish causal design generation identity.}
  REJECT-PARTIAL-ANALYSIS-AS-QUALIFIED-LINEAGE: {pattern: partial/failed analysis execution -> qualified AnalysisResultIdentity, reason: Partial/failed execution cannot issue qualified lineage and no partial-success salvage is allowed.}
  REJECT-GIANT-MODEL-CONTEXT: {pattern: One giant ModelContext becomes shared regulatory authority., reason: Typed bounded dependencies and reviewed contexts are required.}
  REJECT-FEATURE-SNAPSHOT-AS-REGULATORY-CONTEXT: {pattern: FeatureSnapshot used as regulatory context/policy carrier., reason: Factual and regulatory/result lanes remain separate.}
  REJECT-CALLER-REGULATORY-COMPILE-AUTHORITY: {pattern: Caller-supplied RegulatoryCompileInputs become engineering authority., reason: C0 must canonically materialize reviewed inputs from bounded sources.}
  REJECT-W6-AS-DESIGN-EXEC-QUALIFICATION: {pattern: W6 factual result proof -> positive design execution qualification, reason: Historical ABI/population proof cannot establish causal StartDesign execution.}
  REJECT-W7-AS-DESIGN-EXEC-QUALIFICATION: {pattern: W7 exact join -> positive design execution qualification, reason: Exact binding knowledge is necessary but not causal execution proof.}
  REJECT-B6-RUNANALYSIS-OWNERSHIP: {pattern: B6 owns or duplicates RunAnalysis., reason: B6 owns controlled StartDesign; controlled analysis execution is B5.}
  REJECT-SOURCE-MODEL-MUTATION: {pattern: Scratch/derived-state work mutates the trusted source model or exports raw SapModel authority., reason: Derived state must preserve source identity and bounded transport.}

