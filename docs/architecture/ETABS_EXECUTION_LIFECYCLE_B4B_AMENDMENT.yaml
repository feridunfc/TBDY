    - AnalysisStateIdentity issuance through existing B4A helper
    - protected-source byte-integrity check after mutation

fail_closed_rules:
  - unsupported derived-state family issues no positive established state
  - nonzero setter result issues no AnalysisStateIdentity
  - nonzero getter/readback result issues no AnalysisStateIdentity
  - ABI decode ambiguity issues no AnalysisStateIdentity
  - requested/readback mismatch issues no AnalysisStateIdentity
  - active-model mismatch issues no AnalysisStateIdentity
  - protected-source byte mismatch issues no AnalysisStateIdentity
  - restoration may execute only while the active model is still the exact owned scratch
  - unsafe restoration is blocked rather than mutating an unverified active model

explicit_non_scope:
  - SapModel.SetModelIsLocked
  - SapModel.Analyze.SetRunCaseFlag
  - SapModel.Analyze.RunAnalysis
  - SapModel.Analyze.DeleteResults
  - SapModel.DesignConcrete.StartDesign
