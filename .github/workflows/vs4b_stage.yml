name: VS-4B Stage Production Payload

on:
  push:
    branches:
      - sprint/vs-4b-a-a15-mdev-mo

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sprint/vs-4b-a-a15-mdev-mo
          fetch-depth: 0

      - name: Materialize bounded production payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/vs4b_payload/part0 .github/vs4b_payload/part1 | base64 -d > /tmp/vs4b_payload.tar.gz
          echo "39474cb8372d71d9f4342b9b782964e758d0f45585c9386dc811ad2ea0915af2  /tmp/vs4b_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/vs4b_payload.tar.gz -C .
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              "tbdy_engine/features/etabs_mdev_mo_evidence.py": "3c1eee7d691a753c78ccbef95f182830a3f14c7a1a1c969195130c47c48db6b8",
              "tbdy_engine/regulatory/rc_a15_wall_share.py": "d7aecc2a87a07c1c0646dc2fda7499a8dc7d790a2650ecb8eef34e584a5c2957",
              "tbdy_engine/regulatory/sources/tbdy2018_vs4b.py": "e800aa0fd8f7410116feb9ac0f5b1409ae0ec7fa3cc1115d0d57de2ee2ffb6e5",
              "tbdy_engine/regulatory/vs4b_program.py": "cb1dff34bbb3316207aae2bf6e1a4ba9da77f4bf03e7429eabbbb69888584b13",
              "tests/features/test_etabs_mdev_mo_evidence.py": "29b0523a4adff51c76607fae9511f4b09eeea7881e4a240618d7197b449c7004",
              "tests/integration/test_vs4b_a15_program.py": "b59ace041534baf22f26e423de9e2f64655e7889664c5f1e6777daf8ddfe1a6c",
              "tests/regulatory/test_rc_a15_wall_share.py": "dbc92c4c3559c5214e0010a41034e45dac66d5788606a09efc7ab8ea9bdf42a3",
              "tests/regulatory/test_vs4b_source_authority.py": "b4f0cefe1c99573ad5eddee431db12e621d541b7f07814465e254f6c68c6a4f5",
              "tools/run_live_vs4b_a15.py": "f2217f0fa734cbe311fa1c09de184045ae837e8a8ae14d8d36f3b5b34514b8af",
          }
          for path, digest in expected.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"payload hash mismatch {path}: {actual} != {digest}")
          print("VS4B_PAYLOAD_HASHES_OK")
          PY

      - name: Commit exact production and test paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tbdy_engine/features/etabs_mdev_mo_evidence.py \
            tbdy_engine/regulatory/rc_a15_wall_share.py \
            tbdy_engine/regulatory/vs4b_program.py \
            tbdy_engine/regulatory/sources/tbdy2018_vs4b.py \
            tools/run_live_vs4b_a15.py \
            tests/features/test_etabs_mdev_mo_evidence.py \
            tests/regulatory/test_rc_a15_wall_share.py \
            tests/regulatory/test_vs4b_source_authority.py \
            tests/integration/test_vs4b_a15_program.py
          if git diff --cached --quiet; then
            echo "No production payload changes to commit."
            exit 0
          fi
          git commit -m "VS-4B-A implement A15 MDEV/Mo production slice"
          git push origin HEAD:sprint/vs-4b-a-a15-mdev-mo
