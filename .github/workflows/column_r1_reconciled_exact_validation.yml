name: COLUMN-R1 Reconciled Exact Validation

on:
  push:
    branches:
      - sprint/column-r1-reconciled-closure
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/packages/etabs_gateway/src
  B6_PRE1_BASE_SHA: e8b1c88a0a28f696e4a1b0b0f0e9a61acaaab677

jobs:
  validate-reconciled-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reconciled branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          test "$(git merge-base HEAD "$B6_PRE1_BASE_SHA")" = "$B6_PRE1_BASE_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema openpyxl et_xmlfile

      - name: Compile and import
        run: |
          python -m compileall -q tbdy_engine tests packages/etabs_gateway/src
          python -c "import etabs_gateway; import tbdy_engine; import tbdy_engine.application.project_execution; import tbdy_engine.application.column_execution; import tbdy_engine.application.column_public_a5; import tbdy_engine.analysis_basis.eq713_uncracked_analysis_state; import tbdy_engine.analysis_basis.eq713_frame_mechanics; import tbdy_engine.analysis_basis.eq713_response_mechanics; import tbdy_engine.etabs.oapi.frame_section_mechanics; import tbdy_engine.etabs.oapi.eq713_response_results; import tbdy_engine.etabs.oapi.concrete_design; import tbdy_engine.design.columns.column_combo_eligibility_projection; import tbdy_engine.integration.etabs_design_lineage; import tbdy_engine.integration.etabs_controlled_design_execution; import tbdy_engine.providers.etabs_eq713_response_provider"

      - name: P4A1 Frame response core
        run: python -m pytest -q tests/analysis_basis/test_eq713_response_mechanics.py

      - name: P4A2 Frame production join
        run: |
          python -m pytest -q \
            tests/etabs/test_oapi_eq713_response_cases_p4a2.py \
            tests/providers/test_etabs_frame_eq713_population_p4a2.py \
            tests/providers/test_vs6_etabs_auto_seismic_direction_provider.py \
            tests/application/test_column_public_a5_frame_production_join.py

      - name: P4B ShellThick response core
        run: |
          python -m pytest -q \
            tests/etabs/test_oapi_area_strain_shell_p4b.py \
            tests/analysis_basis/test_eq713_shell_thick_response_p4b.py \
            tests/providers/test_etabs_eq713_response_provider_p4b.py

      - name: P4C whole-system A3 composition
        run: |
          python -m pytest -q \
            tests/application/test_column_public_a5_p4c_whole_system.py \
            tests/application/test_column_public_a5_p4c_patch1_product.py

      - name: A3 authority and Area provider
        run: |
          python -m pytest -q \
            tests/analysis_basis/test_eq713_uncracked_analysis_state.py \
            tests/analysis_basis/test_eq713_frame_mechanics.py \
            tests/etabs/test_oapi_area_contributors.py \
            tests/providers/test_etabs_area_contributor_provider.py

      - name: Frame OAPI and factual providers
        run: |
          python -m pytest -q \
            tests/etabs/test_oapi_frame_releases.py \
            tests/etabs/test_oapi_material_properties.py \
            tests/providers

      - name: B4B and B5 focused
        run: |
          python -m pytest -q \
            tests/integration/test_b4b_analysis_state_mutation.py \
            tests/integration/test_b4b_analysis_state_revalidation.py \
            tests/integration/test_b5_analysis_execution.py \
            tests/integration/test_b5_analysis_lineage_issuer.py \
            tests/providers/test_b5_column_force_result_population_provider.py

      - name: PUBLIC A5 execute_project product path
        run: python -m pytest -q tests/application/test_column_public_a5_product_path.py

      - name: B6-PRE1 GetCode offline proof
        run: |
          python -m pytest -q \
            tests/etabs/test_oapi_concrete_design_code_b6_pre1.py \
            tests/etabs/test_oapi_concrete_design.py

      - name: B6-PRE1 exact binding and W7 P8A proof
        run: |
          python -m pytest -q \
            tests/design/columns/test_b6_pre1_exact_combo_binding_ref.py \
            tests/design/columns/test_p8a_column_combo_eligibility_projection.py \
            tests/features/test_vs6_p8a_f0_column_design_evidence_authority.py \
            tests/features/test_p8a_column_design_rebar_evidence.py

      - name: B2 lineage candidate/base regression evidence
        shell: bash
        run: |
          set -u
          CANDIDATE_LOG="$RUNNER_TEMP/b2_candidate.log"
          BASE_LOG="$RUNNER_TEMP/b2_base.log"
          BASE_DIR="$RUNNER_TEMP/b6-pre1-b2-base"
          rm -rf "$BASE_DIR"

          set +e
          python -m pytest -q tests/integration/test_etabs_design_lineage.py >"$CANDIDATE_LOG" 2>&1
          candidate_exit=$?
          set -e

          git worktree add --detach "$BASE_DIR" "$B6_PRE1_BASE_SHA"
          set +e
          (
            cd "$BASE_DIR"
            PYTHONPATH="$BASE_DIR:$BASE_DIR/packages/etabs_gateway/src" \
              python -m pytest -q tests/integration/test_etabs_design_lineage.py
          ) >"$BASE_LOG" 2>&1
          base_exit=$?
          set -e
          git worktree remove --force "$BASE_DIR"

          echo "B2_LINEAGE_CANDIDATE_EXIT=$candidate_exit"
          echo "B2_LINEAGE_BASE_EXIT=$base_exit"
          echo "--- candidate B2 summary ---"
          tail -n 80 "$CANDIDATE_LOG"
          echo "--- frozen-base B2 summary ---"
          tail -n 80 "$BASE_LOG"

          {
            echo "B2_LINEAGE_CANDIDATE_EXIT=$candidate_exit"
            echo "B2_LINEAGE_BASE_EXIT=$base_exit"
          } >> "$GITHUB_ENV"

      - name: F0.5 analysis-basis regression
        run: python -m pytest -q tests/integration/test_f0_5_analysis_basis_contracts.py

      - name: B6 focused regression
        run: |
          python -m pytest -q \
            tests/etabs/test_oapi_concrete_design.py \
            tests/etabs/test_oapi_concrete_design_start.py \
            tests/integration/test_b6_controlled_design_execution.py \
            tests/integration/test_b6_p0_design_preflight.py \
            tests/architecture/test_b6_p0_design_preflight_architecture.py

      - name: C focused regression
        run: |
          python -m pytest -q \
            tests/regulatory/test_column_transverse_confinement.py \
            tests/application/test_column_r1_lane_c_bound_join.py

      - name: Candidate and frozen-base broad evidence
        shell: bash
        run: |
          set -u
          CANDIDATE_LOG="$RUNNER_TEMP/candidate_broad.log"
          BASE_LOG="$RUNNER_TEMP/base_broad.log"
          CANDIDATE_SIG="$RUNNER_TEMP/candidate_failures.txt"
          BASE_SIG="$RUNNER_TEMP/base_failures.txt"
          NEW_SIG="$RUNNER_TEMP/new_failures.txt"
          BASE_DIR="$RUNNER_TEMP/b6-pre1-broad-base"
          rm -rf "$BASE_DIR"

          set +e
          python -m pytest -q >"$CANDIDATE_LOG" 2>&1
          candidate_exit=$?
          set -e

          git worktree add --detach "$BASE_DIR" "$B6_PRE1_BASE_SHA"
          set +e
          (
            cd "$BASE_DIR"
            PYTHONPATH="$BASE_DIR:$BASE_DIR/packages/etabs_gateway/src" \
              python -m pytest -q
          ) >"$BASE_LOG" 2>&1
          base_exit=$?
          set -e
          git worktree remove --force "$BASE_DIR"

          grep -E '^(FAILED|ERROR) ' "$CANDIDATE_LOG" | sed 's/[[:space:]]*$//' | sort -u >"$CANDIDATE_SIG" || true
          grep -E '^(FAILED|ERROR) ' "$BASE_LOG" | sed 's/[[:space:]]*$//' | sort -u >"$BASE_SIG" || true
          comm -23 "$CANDIDATE_SIG" "$BASE_SIG" >"$NEW_SIG" || true

          candidate_pass=$(grep -Eo '[0-9]+ passed' "$CANDIDATE_LOG" | tail -n 1 | awk '{print $1}' || true)
          base_pass=$(grep -Eo '[0-9]+ passed' "$BASE_LOG" | tail -n 1 | awk '{print $1}' || true)
          candidate_pass=${candidate_pass:-0}
          base_pass=${base_pass:-0}
          candidate_failures=$(wc -l <"$CANDIDATE_SIG" | tr -d ' ')
          base_failures=$(wc -l <"$BASE_SIG" | tr -d ' ')
          new_delta=$(wc -l <"$NEW_SIG" | tr -d ' ')

          echo "CANDIDATE_BROAD_EXIT=$candidate_exit"
          echo "CANDIDATE_BROAD_PASS_COUNT=$candidate_pass"
          echo "CANDIDATE_BROAD_FAILURE_COUNT=$candidate_failures"
          echo "CANDIDATE_BROAD_FAILURE_SIGNATURES"
          cat "$CANDIDATE_SIG"
          echo "BASE_BROAD_EXIT=$base_exit"
          echo "BASE_BROAD_PASS_COUNT=$base_pass"
          echo "BASE_BROAD_FAILURE_COUNT=$base_failures"
          echo "BASE_BROAD_FAILURE_SIGNATURES"
          cat "$BASE_SIG"
          echo "NEW_FAILURE_DELTA=$new_delta"
          echo "NEW_FAILURE_SIGNATURES"
          cat "$NEW_SIG"
          echo "--- candidate broad tail ---"
          tail -n 100 "$CANDIDATE_LOG"
          echo "--- frozen-base broad tail ---"
          tail -n 100 "$BASE_LOG"

          {
            echo "CANDIDATE_BROAD_EXIT=$candidate_exit"
            echo "CANDIDATE_BROAD_PASS_COUNT=$candidate_pass"
            echo "CANDIDATE_BROAD_FAILURE_COUNT=$candidate_failures"
            echo "BASE_BROAD_EXIT=$base_exit"
            echo "BASE_BROAD_PASS_COUNT=$base_pass"
            echo "BASE_BROAD_FAILURE_COUNT=$base_failures"
            echo "NEW_FAILURE_DELTA=$new_delta"
          } >> "$GITHUB_ENV"

      - name: Architecture negative reachability
        run: python -m pytest -q tests/architecture

      - name: Final repository hygiene
        shell: bash
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi

      - name: B6-PRE1 exact closure gate
        shell: bash
        run: |
          echo "CANDIDATE_BROAD_EXIT=${CANDIDATE_BROAD_EXIT:-MISSING}"
          echo "BASE_BROAD_EXIT=${BASE_BROAD_EXIT:-MISSING}"
          echo "NEW_FAILURE_DELTA=${NEW_FAILURE_DELTA:-MISSING}"
          test "${CANDIDATE_BROAD_EXIT:-MISSING}" = "0"
          test "${NEW_FAILURE_DELTA:-MISSING}" = "0"
