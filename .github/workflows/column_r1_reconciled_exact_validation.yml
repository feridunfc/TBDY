name: COLUMN-R1 PUBLIC-A5 P1 Test Harness Fix

on:
  push:
    branches:
      - sprint/column-r1-reconciled-closure

permissions:
  contents: write

jobs:
  apply-test-harness-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply bounded test harness fix
        shell: bash
        run: |
          python .github/column_r1_public_a5_p1_test_fix.py
          git config user.name "COLUMN-R1 automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "COLUMN-R1: bind public A5 test context type"
          git push origin HEAD:sprint/column-r1-reconciled-closure
