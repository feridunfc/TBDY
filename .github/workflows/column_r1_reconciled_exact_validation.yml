name: COLUMN-R1 P4C Bounded Repair Bootstrap

on:
  push:
    branches:
      - sprint/column-r1-reconciled-closure

permissions:
  contents: write

jobs:
  apply-p4c-bounded-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Apply exact PUBLIC-A5 numeric-boundary repair and remove diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("tbdy_engine/application/column_public_a5.py")
          text = app.read_text(encoding="utf-8")
          old = "        vector = AreaModifierVector.from_sequence(disposition.target_property_modifiers)"
          new = """        vector = AreaModifierVector.from_sequence(
              tuple(float(value) for value in disposition.target_property_modifiers)
          )"""
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f"PUBLIC-A5 Area vector anchor count={text.count(old)}; expected 1")
              text = text.replace(old, new, 1)
              app.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("PUBLIC-A5 Area numeric-boundary repair anchor not found")

          test = Path("tests/application/test_column_public_a5_p4c_patch1_product.py")
          text = test.read_text(encoding="utf-8")
          diagnostic = '''    assert result.column.fnd_col_2_execution is not None, (
              result.column.blockers,
              proof.harness.runtime["run_calls"],
              tuple(proof.generation_refs),
              tuple(proof.fnd2_result_refs),
              tuple(response_calls),
          )'''
          diagnostic = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in diagnostic.splitlines()
          )
          plain = "    assert result.column.fnd_col_2_execution is not None"
          if diagnostic in text:
              text = text.replace(diagnostic, plain, 1)
              test.write_text(text, encoding="utf-8")
          elif plain not in text:
              raise SystemExit("P4C diagnostic assertion anchor not found")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tbdy_engine/application/column_public_a5.py tests/application/test_column_public_a5_p4c_patch1_product.py
          if git diff --cached --quiet; then
            echo "Bounded repair already present"
            exit 0
          fi
          git commit -m "P4C-PATCH-1: normalize Area modifier transport boundary"
          git push origin HEAD:sprint/column-r1-reconciled-closure
