name: COLUMN-R1 Reconciled Exact Validation

on:
  push:
    branches:
      - sprint/column-r1-reconciled-closure
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/packages/etabs_gateway/src

jobs:
  validate-reconciled-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reconciled branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"

      - name: Bootstrap P4C-PATCH-1 production guard once
        shell: bash
        run: |
          if grep -q "def _new_positive_response_participation_facts" tbdy_engine/application/column_public_a5.py; then
            echo "P4C-PATCH-1 guard already present"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path("tbdy_engine/application/column_public_a5.py")
          text = path.read_text(encoding="utf-8")

          helper = r'''

def _new_positive_response_participation_facts(
    previous: Eq713PopulationDisposition,
    resolved: Eq713PopulationDisposition,
    *,
    frame_names: Sequence[str],
    area_names: Sequence[str],
) -> frozenset[tuple[str, str, str]] | None:
    """Return exact response-scope BLOCKED->TARGETED facts learned this generation.

    ``None`` is retained only for legacy synthetic bounded tests that do not
    construct the production ``Eq713PopulationDisposition`` type. Production
    PUBLIC-A5 always supplies the typed whole-system population.
    """
    if not isinstance(previous, Eq713PopulationDisposition) or not isinstance(
        resolved, Eq713PopulationDisposition
    ):
        return None

    wanted_frames = set(frame_names)
    wanted_areas = set(area_names)
    before: dict[tuple[str, str, str], ContributorDisposition] = {}
    after: dict[tuple[str, str, str], ContributorDisposition] = {}

    for whole, target in ((previous, before), (resolved, after)):
        for row in whole.frame_rows:
            if row.component_uid not in wanted_frames:
                continue
            for mode in row.mode_dispositions:
                target[("FRAME", row.component_uid, mode.mode.value)] = mode.disposition
        for row in whole.area_rows:
            if row.area_name not in wanted_areas:
                continue
            for mode in row.mode_dispositions:
                target[("AREA", row.area_name, mode.mode.value)] = mode.disposition

    return frozenset(
        identity
        for identity, disposition in after.items()
        if disposition is ContributorDisposition.TARGETED_UNCRACKED
        and before.get(identity) is ContributorDisposition.BLOCKED_UNSUPPORTED
    )
'''
          marker = "\ndef _legacy_area_response_closure("
          if marker not in text:
              raise SystemExit("P4C helper insertion anchor not found")
          text = text.replace(marker, helper + marker, 1)

          old = '''        if next_targets == current_targets:\n            if not resolved_a3.positive:\n                _raise_unqualified_a3(resolved_a3, BLOCKER_A3_MEMBER_RESPONSE)\n            return resolved_a3, established_state, execution_result\n        current_a3 = resolved_a3\n'''
          new = '''        if next_targets == current_targets:\n            if not resolved_a3.positive:\n                _raise_unqualified_a3(resolved_a3, BLOCKER_A3_MEMBER_RESPONSE)\n            return resolved_a3, established_state, execution_result\n        new_positive = _new_positive_response_participation_facts(\n            current_a3,\n            resolved_a3,\n            frame_names=frame_names,\n            area_names=area_names,\n        )\n        if new_positive is not None and not new_positive:\n            raise PublicA5CompositionError(\n                BLOCKER_A3_MEMBER_RESPONSE,\n                "A3 mixed target changed without learning a new positive Frame/Area response participation mode",\n            )\n        current_a3 = resolved_a3\n'''
          if text.count(old) != 1:
              raise SystemExit(f"P4C mixed-loop anchor count={text.count(old)}; expected 1")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tbdy_engine/application/column_public_a5.py
          git commit -m "P4C-PATCH-1: enforce mixed fixed-point monotonicity"
          git push origin HEAD:sprint/column-r1-reconciled-closure

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema openpyxl et_xmlfile

      - name: Compile and import
        run: |
          python -m compileall -q tbdy_engine tests packages/etabs_gateway/src
          python -c "import etabs_gateway; import tbdy_engine; import tbdy_engine.application.project_execution; import tbdy_engine.application.column_execution; import tbdy_engine.application.column_public_a5; import tbdy_engine.analysis_basis.eq713_uncracked_analysis_state; import tbdy_engine.analysis_basis.eq713_frame_mechanics; import tbdy_engine.analysis_basis.eq713_response_mechanics; import tbdy_engine.etabs.oapi.frame_section_mechanics; import tbdy_engine.etabs.oapi.eq713_response_results; import tbdy_engine.providers.etabs_eq713_response_provider"

      - name: P4A1 Frame response core
        run: python -m pytest -q tests/analysis_basis/test_eq713_response_mechanics.py

      - name: P4A2 Frame production join
        run: |
          python -m pytest -q \
            tests/etabs/test_oapi_eq713_response_cases_p4a2.py \
            tests/providers/test_etabs_frame_eq713_population_p4a2.py \
            tests/providers/test_vs6_etabs_auto_seismic_direction_provider.py \
            tests/application/test_column_public_a5_frame_production_join.py

      - name: P4B ShellThick response core
        run: |
          python -m pytest -q \
            tests/etabs/test_oapi_area_strain_shell_p4b.py \
            tests/analysis_basis/test_eq713_shell_thick_response_p4b.py \
            tests/providers/test_etabs_eq713_response_provider_p4b.py

      - name: P4C whole-system A3 composition
        run: |
          python -m pytest -q \
            tests/application/test_column_public_a5_p4c_whole_system.py \
            tests/application/test_column_public_a5_p4c_patch1_product.py

      - name: A3 authority and Area provider
        run: |
          python -m pytest -q \
            tests/analysis_basis/test_eq713_uncracked_analysis_state.py \
            tests/analysis_basis/test_eq713_frame_mechanics.py \
            tests/etabs/test_oapi_area_contributors.py \
            tests/providers/test_etabs_area_contributor_provider.py

      - name: Frame OAPI and factual providers
        run: |
          python -m pytest -q \
            tests/etabs/test_oapi_frame_releases.py \
            tests/etabs/test_oapi_material_properties.py \
            tests/providers

      - name: B4B and B5 focused
        run: |
          python -m pytest -q \
            tests/integration/test_b4b_analysis_state_mutation.py \
            tests/integration/test_b4b_analysis_state_revalidation.py \
            tests/integration/test_b5_analysis_execution.py \
            tests/integration/test_b5_analysis_lineage_issuer.py \
            tests/providers/test_b5_column_force_result_population_provider.py

      - name: PUBLIC A5 execute_project product path
        run: python -m pytest -q tests/application/test_column_public_a5_product_path.py

      - name: B6 focused regression
        run: |
          python -m pytest -q \
            tests/etabs/test_oapi_concrete_design.py \
            tests/etabs/test_oapi_concrete_design_start.py \
            tests/integration/test_b6_controlled_design_execution.py \
            tests/integration/test_b6_p0_design_preflight.py \
            tests/architecture/test_b6_p0_design_preflight_architecture.py

      - name: C focused regression
        run: |
          python -m pytest -q \
            tests/regulatory/test_column_transverse_confinement.py \
            tests/application/test_column_r1_lane_c_bound_join.py

      - name: Architecture negative reachability
        run: python -m pytest -q tests/architecture
