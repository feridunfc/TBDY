name: COLUMN-R1 PUBLIC-A5 P1 One-Shot Patch

on:
  push:
    branches:
      - sprint/column-r1-reconciled-closure
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-supervisor-p1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify patch parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PATCH_PARENT=$(git rev-parse HEAD)"
          echo "PATCH_PARENT_TREE=$(git rev-parse HEAD^{tree})"

      - name: Apply bounded PUBLIC-A5 supervisor patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/column_r1_public_a5_p1_patch.py')
          text = path.read_text(encoding='utf-8')
          exact = '(ROOT / ".github/workflows/column_r1_reconciled_exact_validation.yml").write_text(final_workflow, encoding="utf-8")\n'
          if exact not in text:
              raise SystemExit('workflow-write suppression anchor missing')
          path.write_text(text.replace(exact, ''), encoding='utf-8')
          PY
          python .github/column_r1_public_a5_p1_patch.py
          git config user.name "COLUMN-R1 automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "COLUMN-R1: correct PUBLIC-A5 Eq713 participation and targets"
          git push origin HEAD:sprint/column-r1-reconciled-closure
