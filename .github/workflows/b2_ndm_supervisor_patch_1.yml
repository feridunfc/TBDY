name: B2 Ndm Supervisor Patch 1 Guarded

on:
  push:
    branches: [sprint/b2-ndm-result-selection]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/b2-ndm-result-selection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply narrow supervisor patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(text, old, new, label, count=1):
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{label}: expected {count} anchor(s), found {actual}')
              return text.replace(old, new, count)

          def replace_section(text, start, end, new, label):
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f'{label}: start anchor missing')
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f'{label}: end anchor missing')
              return text[:i] + new + text[j:]

          # ------------------------------------------------------------------
          # Production: Ndm selector only.
          # ------------------------------------------------------------------
          p = Path('tbdy_engine/checks/ndm_selection.py')
          text = p.read_text(encoding='utf-8')

          text = replace_exact(
              text,
              'from dataclasses import dataclass\nfrom enum import StrEnum\n',
              'from dataclasses import dataclass\nfrom decimal import Decimal, InvalidOperation\nfrom enum import StrEnum\nfrom math import isfinite\n',
              'ndm imports',
          )

          text = replace_exact(
              text,
              '''class NdmAvailability(StrEnum):\n    RESOLVED = "RESOLVED"\n    BLOCKED = "BLOCKED"\n    NO_DATA = "NO_DATA"\n\n\ndef _nonblank''',
              '''class NdmAvailability(StrEnum):\n    RESOLVED = "RESOLVED"\n    BLOCKED = "BLOCKED"\n    NO_DATA = "NO_DATA"\n\n\nclass Ts498StoreyQState(StrEnum):\n    NOT_APPLICABLE = "NOT_APPLICABLE"\n    EQUAL_STOREY_Q_REVIEWED = "EQUAL_STOREY_Q_REVIEWED"\n    UNEQUAL_STOREY_Q_REVIEWED = "UNEQUAL_STOREY_Q_REVIEWED"\n    UNEQUAL_STOREY_Q_UNRESOLVED = "UNEQUAL_STOREY_Q_UNRESOLVED"\n\n\ndef _nonblank''',
              'ts498 state enum',
          )

          old_policy = '''@dataclass(frozen=True, slots=True)\nclass ReviewedNdmPolicy:\n    """Reviewed Ndm-only policy truth, including the manual TS498 decision boundary."""\n\n    policy_id: str\n    version: str\n    ts498_decision: str\n    q_target_coefficients: Mapping[str, float]\n    s_target_coefficients: Mapping[str, float]\n    unequal_q_interpretation_reviewed: bool\n    linear_superposition_reviewed: bool\n    regulatory_authority_ids: tuple[str, ...]\n    review_refs: tuple[str, ...] = ()\n\n    def __post_init__(self) -> None:\n        object.__setattr__(self, "policy_id", _nonblank("policy_id", self.policy_id))\n        object.__setattr__(self, "version", _nonblank("policy version", self.version))\n        if self.ts498_decision not in {"NOT_APPLICABLE", "RESOLVED", "UNRESOLVED"}:\n            raise ValueError("ts498_decision must be NOT_APPLICABLE, RESOLVED, or UNRESOLVED")\n        if not isinstance(self.unequal_q_interpretation_reviewed, bool):\n            raise TypeError("unequal_q_interpretation_reviewed must be bool")\n        if not isinstance(self.linear_superposition_reviewed, bool):\n            raise TypeError("linear_superposition_reviewed must be bool")\n        object.__setattr__(self, "q_target_coefficients", _frozen_float_map(self.q_target_coefficients))\n        object.__setattr__(self, "s_target_coefficients", _frozen_float_map(self.s_target_coefficients))\n        authority = tuple(_nonblank("regulatory_authority_id", item) for item in self.regulatory_authority_ids)\n        if not authority:\n            raise ValueError("ReviewedNdmPolicy requires regulatory authority IDs")\n        object.__setattr__(self, "regulatory_authority_ids", authority)\n        object.__setattr__(self, "review_refs", tuple(str(item) for item in self.review_refs))\n'''
          new_policy = '''@dataclass(frozen=True, slots=True)\nclass ReviewedNdmPolicy:\n    """Target-scoped reviewed Ndm policy, including explicit TS498 storey-Q state."""\n\n    policy_id: str\n    version: str\n    target_component_id: str\n    target_story: str\n    target_pier: str\n    ts498_storey_q_state: Ts498StoreyQState | str\n    q_target_coefficients: Mapping[str, float]\n    s_target_coefficients: Mapping[str, float]\n    linear_superposition_reviewed: bool\n    regulatory_authority_ids: tuple[str, ...]\n    unequal_storey_q_interpretation: str | None = None\n    review_refs: tuple[str, ...] = ()\n\n    def __post_init__(self) -> None:\n        object.__setattr__(self, "policy_id", _nonblank("policy_id", self.policy_id))\n        object.__setattr__(self, "version", _nonblank("policy version", self.version))\n        object.__setattr__(self, "target_component_id", _nonblank("target_component_id", self.target_component_id))\n        object.__setattr__(self, "target_story", _nonblank("target_story", self.target_story))\n        object.__setattr__(self, "target_pier", _nonblank("target_pier", self.target_pier))\n        try:\n            state = Ts498StoreyQState(self.ts498_storey_q_state)\n        except (TypeError, ValueError) as exc:\n            raise ValueError("Invalid TS498 storey-Q distribution state") from exc\n        object.__setattr__(self, "ts498_storey_q_state", state)\n        if not isinstance(self.linear_superposition_reviewed, bool):\n            raise TypeError("linear_superposition_reviewed must be bool")\n        if self.unequal_storey_q_interpretation is not None:\n            object.__setattr__(\n                self, "unequal_storey_q_interpretation",\n                _nonblank("unequal_storey_q_interpretation", self.unequal_storey_q_interpretation),\n            )\n        object.__setattr__(self, "q_target_coefficients", _frozen_float_map(self.q_target_coefficients))\n        object.__setattr__(self, "s_target_coefficients", _frozen_float_map(self.s_target_coefficients))\n        authority = tuple(_nonblank("regulatory_authority_id", item) for item in self.regulatory_authority_ids)\n        if not authority:\n            raise ValueError("ReviewedNdmPolicy requires regulatory authority IDs")\n        object.__setattr__(self, "regulatory_authority_ids", authority)\n        object.__setattr__(self, "review_refs", tuple(str(item) for item in self.review_refs))\n'''
          text = replace_exact(text, old_policy, new_policy, 'target-scoped ReviewedNdmPolicy')

          if text.count('    raw_p: float\n') != 2:
              raise SystemExit('raw_p type anchors changed')
          text = text.replace('    raw_p: float\n', '    raw_p: Any\n')

          old_to_n = '''def _to_n(value: Any, unit: str) -> float:\n    if isinstance(value, bool) or not isinstance(value, (int, float)):\n        raise TypeError("Pier Forces P must be numeric")\n    number = float(value)\n    return number if unit == _N else number * 1000.0\n'''
          new_to_n = '''def _decode_p_scalar(value: Any) -> float:\n    """Strictly decode one raw ETABS P scalar without mutating factual evidence."""\n    if isinstance(value, bool) or value is None:\n        raise TypeError("Pier Forces P must be a finite decimal scalar")\n    if isinstance(value, int):\n        number = float(value)\n    elif isinstance(value, float):\n        number = value\n    elif isinstance(value, str):\n        if not value or value != value.strip():\n            raise ValueError("Pier Forces P decimal text must be nonblank and unpadded")\n        body = value[1:] if value[:1] in {"+", "-"} else value\n        if not body:\n            raise ValueError("Pier Forces P decimal text is missing digits")\n        parts = body.split(".")\n        if len(parts) > 2 or any(not part for part in parts):\n            raise ValueError("Pier Forces P must use strict decimal-point syntax")\n        if any(any(ch < "0" or ch > "9" for ch in part) for part in parts):\n            raise ValueError("Pier Forces P must use strict decimal-point syntax")\n        try:\n            decimal_value = Decimal(value)\n        except InvalidOperation as exc:\n            raise ValueError("Pier Forces P decimal text is invalid") from exc\n        if not decimal_value.is_finite():\n            raise ValueError("Pier Forces P must be finite")\n        number = float(decimal_value)\n    else:\n        raise TypeError("Pier Forces P must be int, finite float, or strict decimal text")\n    if not isfinite(number):\n        raise ValueError("Pier Forces P must be finite")\n    return number\n\n\ndef _to_n(number: float, unit: str) -> float:\n    return number if unit == _N else number * 1000.0\n'''
          text = replace_exact(text, old_to_n, new_to_n, 'live P decoder')

          old_policy_reason = '''def _binding_policy_reason(binding: ReviewedNdmLoadBinding, policy: ReviewedNdmPolicy) -> str | None:\n    if policy.ts498_decision == "UNRESOLVED":\n        return "TS498 live-load reduction authority is unresolved"\n    if set(policy.q_target_coefficients) != set(binding.q_case_ids):\n        return "Reviewed Q target coefficients do not cover the exact bound Q identities"\n    if set(policy.s_target_coefficients) != set(binding.s_case_ids):\n        return "Reviewed S target coefficients do not cover the exact bound S identities"\n    if len(set(policy.q_target_coefficients.values())) > 1 and not policy.unequal_q_interpretation_reviewed:\n        return "Unequal Q target coefficients lack an explicit reviewed interpretation"\n    if any(value != _TBDY_EQ_4_11_S_TARGET for value in policy.s_target_coefficients.values()):\n'''
          new_policy_reason = '''def _policy_target_reason(request: EngineeringQuantityRequest, policy: ReviewedNdmPolicy) -> str | None:\n    if request.component_id != policy.target_component_id:\n        return "Reviewed Ndm policy target_component_id does not match requested component"\n    if request.story != policy.target_story:\n        return "Reviewed Ndm policy target_story does not match requested Story"\n    if request.pier != policy.target_pier:\n        return "Reviewed Ndm policy target_pier does not match requested Pier"\n    return None\n\n\ndef _binding_policy_reason(binding: ReviewedNdmLoadBinding, policy: ReviewedNdmPolicy) -> str | None:\n    state = policy.ts498_storey_q_state\n    if state == Ts498StoreyQState.UNEQUAL_STOREY_Q_UNRESOLVED:\n        return "TS498 supported-storey Q distribution has an unresolved unequal-Q interpretation"\n    if state == Ts498StoreyQState.UNEQUAL_STOREY_Q_REVIEWED:\n        if policy.unequal_storey_q_interpretation is None or not policy.review_refs:\n            return "Reviewed unequal storey-Q state requires an explicit reviewed interpretation and review refs"\n    if set(policy.q_target_coefficients) != set(binding.q_case_ids):\n        return "Reviewed Q target coefficients do not cover the exact bound Q identities"\n    if set(policy.s_target_coefficients) != set(binding.s_case_ids):\n        return "Reviewed S target coefficients do not cover the exact bound S identities"\n    if any(value != _TBDY_EQ_4_11_S_TARGET for value in policy.s_target_coefficients.values()):\n'''
          text = replace_exact(text, old_policy_reason, new_policy_reason, 'explicit TS498 state')

          old_policy_type = '''    if not isinstance(policy, ReviewedNdmPolicy):\n        return _result(request, binding=binding, policy=None, bundle=pier_forces,\n                       availability=NdmAvailability.BLOCKED, reason="Reviewed Ndm policy has invalid type")\n    if pier_forces is None or not isinstance(pier_forces, ResultRowEvidenceBundle):\n'''
          new_policy_type = '''    if not isinstance(policy, ReviewedNdmPolicy):\n        return _result(request, binding=binding, policy=None, bundle=pier_forces,\n                       availability=NdmAvailability.BLOCKED, reason="Reviewed Ndm policy has invalid type")\n    target_reason = _policy_target_reason(request, policy)\n    if target_reason is not None:\n        return _result(request, binding=binding, policy=policy, bundle=pier_forces,\n                       availability=NdmAvailability.BLOCKED, reason=target_reason)\n    if pier_forces is None or not isinstance(pier_forces, ResultRowEvidenceBundle):\n'''
          text = replace_exact(text, old_policy_type, new_policy_type, 'policy target gate')

          text = replace_exact(
              text,
              '''            try:\n                raw_p = float(row.get("P"))\n                canonical = _to_n(row.get("P"), source_unit)\n            except (TypeError, ValueError):\n                raw_p = 0.0\n                canonical = 0.0\n''',
              '''            raw_p = row.get("P")\n            try:\n                canonical = _to_n(_decode_p_scalar(raw_p), source_unit)\n            except (TypeError, ValueError):\n                canonical = 0.0\n''',
              'rejected row raw P preservation',
          )
          text = replace_exact(
              text,
              '''        try:\n            raw_p = float(row.get("P"))\n            canonical_p_n = _to_n(row.get("P"), source_unit)\n        except (TypeError, ValueError):\n''',
              '''        raw_p = row.get("P")\n        try:\n            canonical_p_n = _to_n(_decode_p_scalar(raw_p), source_unit)\n        except (TypeError, ValueError):\n''',
              'final row P decode',
          )
          text = replace_exact(
              text,
              '''                try:\n                    correction_raw = float(correction_row.get("P"))\n                    correction_n = _to_n(correction_row.get("P"), source_unit)\n                except (TypeError, ValueError):\n''',
              '''                correction_raw = correction_row.get("P")\n                try:\n                    correction_n = _to_n(_decode_p_scalar(correction_raw), source_unit)\n                except (TypeError, ValueError):\n''',
              'correction row P decode',
          )

          old_population = '''    accepted_combinations = {item.final_combination_id for item in accepted}\n    accepted_steps = {item.step_type for item in accepted}\n    accepted_locations = {item.location for item in accepted}\n    missing_combinations = tuple(sorted(set(binding.final_combination_ids) - accepted_combinations))\n    missing_steps = tuple(sorted(set(binding.allowed_final_step_types) - accepted_steps))\n    missing_locations = tuple(sorted(set(binding.allowed_locations) - accepted_locations))\n    if missing_combinations or missing_steps or missing_locations:\n        missing_parts = []\n        if missing_combinations:\n            missing_parts.append("final combinations=" + ",".join(missing_combinations))\n        if missing_steps:\n            missing_parts.append("StepTypes=" + ",".join(missing_steps))\n        if missing_locations:\n            missing_parts.append("Locations=" + ",".join(missing_locations))\n        return _result(\n            request, binding=binding, policy=policy, bundle=pier_forces,\n            availability=NdmAvailability.NO_DATA,\n            reason="FULL Pier Forces lookup is missing reviewed Ndm candidate population dimensions: " + "; ".join(missing_parts),\n            source_unit=source_unit, candidate_rows=candidates,\n        )\n'''
          new_population = '''    expected_cells = {\n        (combo, step_type, location)\n        for combo in binding.final_combination_ids\n        for step_type in binding.allowed_final_step_types\n        for location in binding.allowed_locations\n    }\n    actual_cells = {\n        (item.final_combination_id, item.step_type, item.location)\n        for item in accepted\n    }\n    if actual_cells != expected_cells:\n        missing_cells = tuple(sorted(expected_cells - actual_cells))\n        return _result(\n            request, binding=binding, policy=policy, bundle=pier_forces,\n            availability=NdmAvailability.NO_DATA,\n            reason=(\n                "FULL Pier Forces lookup is missing reviewed Ndm candidate cells: "\n                + ", ".join(f"{combo}/{step_type}/{location}" for combo, step_type, location in missing_cells)\n            ),\n            source_unit=source_unit, candidate_rows=candidates,\n        )\n'''
          text = replace_exact(text, old_population, new_population, 'Cartesian population gate')

          text = replace_exact(
              text,
              '    "ResolvedNdmDemand", "ReviewedNdmLoadBinding", "ReviewedNdmPolicy", "SelectionTrace",\n',
              '    "ResolvedNdmDemand", "ReviewedNdmLoadBinding", "ReviewedNdmPolicy", "SelectionTrace",\n    "Ts498StoreyQState",\n',
              'ndm __all__',
          )
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Production: per-component Ndm policy mapping in existing wall seam.
          # ------------------------------------------------------------------
          p = Path('tbdy_engine/checks/wall_pipeline.py')
          text = p.read_text(encoding='utf-8')
          text = replace_exact(
              text,
              '    ndm_load_binding: ReviewedNdmLoadBinding | None = None\n    ndm_policy: ReviewedNdmPolicy | None = None\n',
              '    ndm_load_binding: ReviewedNdmLoadBinding | None = None\n    ndm_policies_by_component_id: Mapping[str, ReviewedNdmPolicy] = field(default_factory=dict)\n',
              'wall policy mapping field',
          )
          text = replace_exact(
              text,
              '''        if self.ndm_load_binding is not None and not isinstance(self.ndm_load_binding, ReviewedNdmLoadBinding):\n            raise TypeError("ndm_load_binding must be ReviewedNdmLoadBinding or None")\n        if self.ndm_policy is not None and not isinstance(self.ndm_policy, ReviewedNdmPolicy):\n            raise TypeError("ndm_policy must be ReviewedNdmPolicy or None")\n        bundles = dict(self.result_bundles or {})\n''',
              '''        if self.ndm_load_binding is not None and not isinstance(self.ndm_load_binding, ReviewedNdmLoadBinding):\n            raise TypeError("ndm_load_binding must be ReviewedNdmLoadBinding or None")\n        policies = dict(self.ndm_policies_by_component_id or {})\n        for component_id, policy in policies.items():\n            if not isinstance(component_id, str) or not component_id:\n                raise TypeError("ndm_policies_by_component_id keys must be nonblank strings")\n            if not isinstance(policy, ReviewedNdmPolicy):\n                raise TypeError("ndm_policies_by_component_id values must be ReviewedNdmPolicy")\n            if component_id != policy.target_component_id:\n                raise ValueError("Ndm policy mapping key must equal policy.target_component_id")\n        bundles = dict(self.result_bundles or {})\n''',
              'wall policy mapping validation',
          )
          text = replace_exact(
              text,
              '        object.__setattr__(self, "result_bundles", MappingProxyType(bundles))\n        object.__setattr__(self, "wall_to_pier", freeze_data(dict(self.wall_to_pier or {})))\n',
              '        object.__setattr__(self, "result_bundles", MappingProxyType(bundles))\n        object.__setattr__(self, "ndm_policies_by_component_id", MappingProxyType(policies))\n        object.__setattr__(self, "wall_to_pier", freeze_data(dict(self.wall_to_pier or {})))\n',
              'wall policy mapping freeze',
          )
          text = replace_exact(
              text,
              '                policy=execution_evidence.ndm_policy,\n',
              '                policy=execution_evidence.ndm_policies_by_component_id.get(component_id),\n',
              'per-wall exact policy lookup',
          )
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Focused B2 tests only.
          # ------------------------------------------------------------------
          p = Path('tests/result_selection/test_b2_ndm_selection.py')
          text = p.read_text(encoding='utf-8')
          marker = 'def test_selector_uses_exact_binding_only_and_has_no_runtime_name_heuristics():'
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('test prefix marker missing')
          prefix = '''from __future__ import annotations\n\nimport inspect\nfrom collections.abc import Mapping\n\nimport pytest\n\nfrom tbdy_engine.checks import ndm_selection as ndm_module\nfrom tbdy_engine.checks.ndm_selection import (\n    EngineeringQuantityRequest,\n    NdmAvailability,\n    ReviewedNdmLoadBinding,\n    ReviewedNdmPolicy,\n    Ts498StoreyQState,\n    select_ndm_demand,\n)\nfrom tbdy_engine.checks.result import CheckStatus\nfrom tbdy_engine.checks.wall_applicability import derive_ndm_n\nfrom tbdy_engine.checks.wall_contract import WALL_NET_SECTION_AXIAL_CAPACITY\nfrom tbdy_engine.checks.wall_pipeline import WallExecutionEvidence, run_wall_checks\nfrom tbdy_engine.features.evidence import FeatureEvidence, FeatureEvidenceStatus\nfrom tbdy_engine.features.result_evidence import (\n    PIER_FORCE_IDENTITY_FIELDS,\n    PIER_FORCE_PAYLOAD_FIELDS,\n    ResultRowEvidenceBundle,\n    RuntimeCaptureStatus,\n)\nfrom tbdy_engine.features.snapshot import FeatureSnapshot\nfrom tbdy_engine.features.value import FeatureValue, FeatureValueStatus\n\n\nAUTHORITY_IDS = (\n    "TBDY2018_RG_20180318_M1-2-1",\n    "TBDY2018_7.6.1.1",\n    "TBDY2018_4.4.2.1_EQ4.9",\n    "TBDY2018_4.4.4.1_EQ4.11",\n    "TS498_1997_13_REVIEWED_DECISION",\n)\n\n\ndef _row(case, p, *, case_type="Combination", step="Max", location="Bottom", story="L1", pier="P1", step_number=None):\n    row = {field: 0.0 for field in PIER_FORCE_PAYLOAD_FIELDS}\n    row.update({field: None for field in PIER_FORCE_IDENTITY_FIELDS})\n    row.update({\n        "Story": story, "Pier": pier, "OutputCase": case, "CaseType": case_type,\n        "StepType": step, "StepNumber": step_number, "Location": location, "P": p,\n    })\n    return row\n\n\ndef _static(case, p, *, location="Bottom", story="L1", pier="P1"):\n    return _row(case, p, case_type="LinStatic", step=None, step_number=None,\n                location=location, story=story, pier=pier)\n\n\ndef _bundle(rows, *, unit="N", capture=RuntimeCaptureStatus.FULL, reported=None):\n    rows = tuple(rows)\n    return ResultRowEvidenceBundle(\n        table_key="pier_forces", actual_table_name="Pier Forces",\n        identity_fields=PIER_FORCE_IDENTITY_FIELDS, payload_fields=PIER_FORCE_PAYLOAD_FIELDS,\n        rows=rows, source_contract_status="VERIFIED_LIVE", units={"force_unit": unit},\n        runtime_capture_status=capture,\n        reported_row_count=len(rows) if reported is None else reported,\n    )\n\n\ndef _binding(*, q_ids=("Q_CASE",), baseline_override=None, fixed_override=None,\n             final_ids=("FINAL_X", "FINAL_Y"), allowed_steps=("Max", "Min"),\n             allowed_locations=("Top", "Bottom")):\n    final_ids = tuple(final_ids)\n    g = ("G_CASE",); q = tuple(q_ids); s = ("S_CASE",); h = ("E_X", "E_Y"); v = ("E_Z",)\n    all_baseline = {\n        "FINAL_X": {"G_CASE": 1.0, **{item: 1.0 for item in q}, "S_CASE": 1.0,\n                    "E_X": 1.0, "E_Y": 0.3, "E_Z": 0.3},\n        "FINAL_Y": {"G_CASE": 1.0, **{item: 1.0 for item in q}, "S_CASE": 1.0,\n                    "E_X": 0.3, "E_Y": 1.0, "E_Z": 0.3},\n    }\n    all_fixed = {\n        "FINAL_X": {"G_CASE": 1.0, "E_X": 1.0, "E_Y": 0.3, "E_Z": 0.3},\n        "FINAL_Y": {"G_CASE": 1.0, "E_X": 0.3, "E_Y": 1.0, "E_Z": 0.3},\n    }\n    baseline = {combo: dict(all_baseline[combo]) for combo in final_ids}\n    fixed = {combo: dict(all_fixed[combo]) for combo in final_ids}\n    if baseline_override:\n        for combo, values in baseline_override.items(): baseline[combo] = {**baseline[combo], **values}\n    if fixed_override:\n        for combo, values in fixed_override.items(): fixed[combo] = {**fixed[combo], **values}\n    return ReviewedNdmLoadBinding(\n        binding_id="BINDING-1", version="v1", final_combination_ids=final_ids,\n        g_case_ids=g, q_case_ids=q, s_case_ids=s, horizontal_e_case_ids=h, vertical_e_case_ids=v,\n        baseline_coefficients_by_combination=baseline,\n        required_fixed_coefficients_by_combination=fixed,\n        allowed_final_step_types=tuple(allowed_steps), allowed_locations=tuple(allowed_locations),\n        review_refs=("supervisor-reviewed-live-inventory",),\n    )\n\n\ndef _policy(*, q=None, s=0.2, q_state=Ts498StoreyQState.EQUAL_STOREY_Q_REVIEWED,\n            target_component_id="W1", target_story="L1", target_pier="P1",\n            unequal_interpretation="reviewed supported-storey Q_i interpretation", linear=True):\n    q = {"Q_CASE": 0.5} if q is None else q\n    return ReviewedNdmPolicy(\n        policy_id=f"NDM-POLICY-{target_component_id}", version="v1",\n        target_component_id=target_component_id, target_story=target_story, target_pier=target_pier,\n        ts498_storey_q_state=q_state,\n        q_target_coefficients=q, s_target_coefficients={"S_CASE": s},\n        unequal_storey_q_interpretation=unequal_interpretation,\n        linear_superposition_reviewed=linear,\n        regulatory_authority_ids=AUTHORITY_IDS,\n        review_refs=("reviewed-ts498-decision", "reviewed-linear-superposition"),\n    )\n\n\ndef _request(): return EngineeringQuantityRequest("REQ-1", "W1", "L1", "P1")\n\n\ndef _correction_rows(*, q_p=-20_000.0, s_p=-10_000.0, locations=("Top", "Bottom"), story="L1", pier="P1", q_ids=("Q_CASE",)):\n    rows = []\n    for location in locations:\n        for q_id in q_ids:\n            rows.append(_static(q_id, q_p, location=location, story=story, pier=pier))\n        rows.append(_static("S_CASE", s_p, location=location, story=story, pier=pier))\n    return rows\n\n\ndef _resolved_rows():\n    return [\n        _row("FINAL_X", -100_000.0, step="Max", location="Top"),\n        _row("FINAL_X", -105_000.0, step="Max", location="Bottom"),\n        _row("FINAL_X", -115_000.0, step="Min", location="Top"),\n        _row("FINAL_X", -120_000.0, step="Min", location="Bottom"),\n        _row("FINAL_Y", -90_000.0, step="Max", location="Top"),\n        _row("FINAL_Y", -95_000.0, step="Max", location="Bottom"),\n        _row("FINAL_Y", -105_000.0, step="Min", location="Top"),\n        _row("FINAL_Y", -110_000.0, step="Min", location="Bottom"),\n        *_correction_rows(),\n    ]\n\n\ndef _single_cell_rows(*, final_p=-100_000.0, q_p=-20_000.0, s_p=-10_000.0, story="L1", pier="P1", q_ids=("Q_CASE",)):\n    return [\n        _row("FINAL_X", final_p, step="Max", location="Top", story=story, pier=pier),\n        *_correction_rows(q_p=q_p, s_p=s_p, locations=("Top",), story=story, pier=pier, q_ids=q_ids),\n    ]\n\n\n'''
