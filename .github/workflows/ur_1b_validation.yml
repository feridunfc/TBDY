name: UR-1B Engineering Audit Projection Validation

on:
  push:
    branches:
      - sprint/ur-1b-engineering-audit-projection
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ur-1b-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Repository state and current-main baseline
        id: repo_state
        shell: bash
        run: |
          git status --short
          git diff --check origin/main...HEAD
          git diff --stat origin/main...HEAD
          base_sha="$(git rev-parse origin/main)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "Current main baseline: $base_sha"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema

      - name: Compile candidate
        run: python -m compileall -q tbdy_engine tests

      - name: UR-1B focused acceptance
        run: |
          python -m pytest -q \
            tests/product_reports/test_building_report_projection.py \
            tests/product_reports/test_building_report_projection_ui_ready.py \
            tests/product_reports/test_unified_building_report.py \
            tests/product_reports/test_slice_report_contribution.py \
            tests/coverage/test_fcr_1a_project_reconciliation.py

      - name: Candidate broad regression
        id: candidate_broad
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/design/columns \
            tests/features \
            tests/product_reports \
            > candidate_broad.log 2>&1
          status=$?
          cat candidate_broad.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkout exact current-main baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.repo_state.outputs.base_sha }}
          path: main_baseline

      - name: Main-baseline broad regression
        id: baseline_broad
        shell: bash
        run: |
          set +e
          cd main_baseline
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/design/columns \
            tests/features \
            tests/product_reports \
            > ../baseline_broad.log 2>&1
          status=$?
          cd ..
          cat baseline_broad.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Candidate regression delta gate
        shell: bash
        env:
          CANDIDATE_BROAD_EXIT: ${{ steps.candidate_broad.outputs.exit_code }}
          BASELINE_BROAD_EXIT: ${{ steps.baseline_broad.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          def failure_signatures(path: str) -> set[str]:
              text = Path(path).read_text(encoding="utf-8", errors="replace")
              signatures: set[str] = set()
              for line in text.splitlines():
                  match = re.match(r"^(?:FAILED|ERROR)\s+([^\s]+)", line)
                  if match:
                      signatures.add(match.group(1))
              return signatures

          candidate_exit = int(os.environ["CANDIDATE_BROAD_EXIT"])
          baseline_exit = int(os.environ["BASELINE_BROAD_EXIT"])
          candidate = failure_signatures("candidate_broad.log")
          baseline = failure_signatures("baseline_broad.log")
          new_failures = candidate - baseline

          print(f"candidate_exit={candidate_exit} baseline_exit={baseline_exit}")
          print(f"candidate_failures={sorted(candidate)}")
          print(f"baseline_failures={sorted(baseline)}")
          print(f"new_failures={sorted(new_failures)}")

          if candidate_exit == 0:
              raise SystemExit(0)
          if not candidate:
              raise SystemExit("nonzero candidate exit without parsed failure signatures")
          if baseline_exit == 0 or new_failures:
              raise SystemExit("UR-1B introduced regression failure(s) beyond current main")
          PY
