name: tmp-t1-p1-freeze2
on:
  push:
    branches: [tmp/t1-p1-freeze2]
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fbd40bbb2343bc2895303db2d0e69549f93c579b
          fetch-depth: 0
      - name: Apply exact validated P1 patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/t1_p1.patch
          git apply --check /tmp/t1_p1.patch
          git apply /tmp/t1_p1.patch
          git diff --check
          test "$(git hash-object packages/etabs_gateway/src/etabs_gateway/connection.py)" = "be171311583b0122d0a7952f98c81dc27ecf79c9"
          test "$(git hash-object tests/etabs/test_t1_etabs_test_isolation.py)" = "e0a54c74a41c1d1adb5ecaa7cec909a4e1018f54"
          git add packages/etabs_gateway/src/etabs_gateway/connection.py tests/etabs/test_t1_etabs_test_isolation.py
          test "$(git write-tree)" = "e1684c0ae94399b353da62ba9d29d7d92d2e7cd1"
      - name: Commit and push bounded P1
        shell: bash
        run: |
          git config user.name "feridunfc"
          git config user.email "yalduz@gmail.com"
          git commit -m "T1 P1: seal PID attach from default comtypes fallback"
          git push origin HEAD:refs/heads/sprint/t1-etabs-test-isolation-1
