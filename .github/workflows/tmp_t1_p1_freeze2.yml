name: tmp-t1-p1-freeze2
on:
  push:
    branches: [tmp/t1-p1-freeze2]
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze exact validated T1 tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=00e2d0ab2ae60971940f9454ff043e0c45de680f
          OLD=fbd40bbb2343bc2895303db2d0e69549f93c579b
          TARGET_TREE=e1684c0ae94399b353da62ba9d29d7d92d2e7cd1
          PATCH_SOURCE=ecd441df3a41ab4339a1af9d277777c3adb370eb
          BRANCH=sprint/t1-etabs-test-isolation-1
          EXPECTED_CONNECTION=be171311583b0122d0a7952f98c81dc27ecf79c9
          EXPECTED_T1=e0a54c74a41c1d1adb5ecaa7cec909a4e1018f54
          EXPECTED_SAFETY=7325198cd851c20a4debb165041720b6ce071861

          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$OLD"
          test "$(git rev-parse "$OLD:tests/etabs/test_safety_foundation.py")" = "$EXPECTED_SAFETY"

          git show "$PATCH_SOURCE":.github/workflows/tmp_t1_p1_freeze2.yml \
            | python -c 'import re,sys; s=sys.stdin.read(); m=re.search(r"^\s*PATCH_B64:\s*(\S+)\s*$",s,re.M); assert m, "PATCH_B64 not found"; print(m.group(1))' \
            > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/p1.patch

          git checkout --detach "$OLD"
          git apply --check /tmp/p1.patch
          git apply /tmp/p1.patch
          git add -A

          test "$(git rev-parse :packages/etabs_gateway/src/etabs_gateway/connection.py)" = "$EXPECTED_CONNECTION"
          test "$(git rev-parse :tests/etabs/test_t1_etabs_test_isolation.py)" = "$EXPECTED_T1"
          test "$(git rev-parse :tests/etabs/test_safety_foundation.py)" = "$EXPECTED_SAFETY"

          git diff --cached --name-status "$BASE" | sort > /tmp/actual-files
          printf '%s\n' \
            $'A\ttests/etabs/test_t1_etabs_test_isolation.py' \
            $'M\tpackages/etabs_gateway/src/etabs_gateway/connection.py' \
            $'M\ttests/etabs/test_safety_foundation.py' \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

          TREE=$(git write-tree)
          test "$TREE" = "$TARGET_TREE"

          export GIT_AUTHOR_NAME='T1 Supervisor Freeze'
          export GIT_AUTHOR_EMAIL='actions@github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          NEW_SHA=$(printf '%s\n' 'T1: isolate ETABS test dependencies' | git commit-tree "$TREE" -p "$BASE")
          test "$(git rev-parse "$NEW_SHA^{tree}")" = "$TARGET_TREE"
          test "$(git rev-parse "$NEW_SHA^")" = "$BASE"
          test "$(git rev-list --count "$BASE..$NEW_SHA")" = "1"

          git push --force-with-lease=refs/heads/$BRANCH:$OLD origin "$NEW_SHA:refs/heads/$BRANCH"
          git fetch origin "$BRANCH"
          REMOTE_SHA=$(git rev-parse "origin/$BRANCH")
          test "$REMOTE_SHA" = "$NEW_SHA"
          git checkout --detach "$REMOTE_SHA"

          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-parse HEAD:packages/etabs_gateway/src/etabs_gateway/connection.py)" = "$EXPECTED_CONNECTION"
          test "$(git rev-parse HEAD:tests/etabs/test_t1_etabs_test_isolation.py)" = "$EXPECTED_T1"
          test "$(git rev-parse HEAD:tests/etabs/test_safety_foundation.py)" = "$EXPECTED_SAFETY"
          test -z "$(git ls-tree -r --name-only HEAD | grep -E '^\.github/workflows/tmp_t1_' || true)"

          echo "CANDIDATE_SHA=$NEW_SHA" | tee /tmp/freeze-summary
          echo "CANDIDATE_TREE=$TARGET_TREE" | tee -a /tmp/freeze-summary
          echo "PARENT_SHA=$BASE" | tee -a /tmp/freeze-summary
          cat /tmp/freeze-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install local test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          if [ -f pyproject.toml ]; then python -m pip install -q -e .; fi
          if [ -f packages/etabs_gateway/pyproject.toml ]; then python -m pip install -q -e packages/etabs_gateway; fi

      - name: Minimal exact-tree post-freeze validation
        shell: bash
        run: |
          set -euo pipefail
          BASE=00e2d0ab2ae60971940f9454ff043e0c45de680f
          TARGET_TREE=e1684c0ae94399b353da62ba9d29d7d92d2e7cd1
          BRANCH=sprint/t1-etabs-test-isolation-1
          git fetch origin "$BRANCH"
          git checkout --detach "origin/$BRANCH"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse HEAD^)" = "$BASE"

          python -m compileall -q tbdy_engine packages tests
          PYTHONPATH="$PWD/packages/etabs_gateway/src:$PWD" python -m pytest -q tests/etabs/test_t1_etabs_test_isolation.py
          PYTHONPATH="$PWD/packages/etabs_gateway/src:$PWD" python -m pytest -q tests/architecture/test_g1_arch_drift_guards.py tests/product_reports/test_product_reports_package_init_boundary.py
          PYTHONPATH="$PWD/packages/etabs_gateway/src:$PWD" python -m pytest -q \
            packages/etabs_gateway/tests/test_boundary_guards.py \
            packages/etabs_gateway/tests/test_com_apartment.py \
            packages/etabs_gateway/tests/test_worker.py \
            packages/etabs_gateway/tests/test_session.py \
            packages/etabs_gateway/tests/test_connection.py \
            packages/etabs_gateway/tests/test_pid_and_bounded_read.py
          git diff --check "$BASE" HEAD
