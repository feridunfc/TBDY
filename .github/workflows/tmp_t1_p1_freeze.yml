name: tmp-t1-p1-freeze
on:
  push:
    branches: [tmp/t1-p1-freeze]
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fbd40bbb2343bc2895303db2d0e69549f93c579b
          fetch-depth: 0
      - name: Apply exact validated P1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          connection = Path('packages/etabs_gateway/src/etabs_gateway/connection.py')
          text = connection.read_text(encoding='utf-8')
          needle = '''    def _try_pid_attach(self, pid: int):
              strategy = STRATEGY_HELPER_GET_OBJECT_PROCESS
              attempts: list[_AttachAttempt] = []
              try:
          '''
          replacement = '''    def _try_pid_attach(self, pid: int):
              strategy = STRATEGY_HELPER_GET_OBJECT_PROCESS
              attempts: list[_AttachAttempt] = []

              # A custom active-object runtime selects a closed dependency universe.
              # If no custom comtypes dependency was selected alongside it, the
              # PID-helper capability is unavailable rather than permission to load
              # the default (possibly real) comtypes runtime.  Report the capability
              # as unsupported so the existing bounded generic policy can continue
              # inside the already-selected custom runtime only.
              if self._runtime_loader_is_custom and not self._comtypes_loader_is_custom:
                  attempts.append(
                      _AttachAttempt(
                          strategy=strategy,
                          status="FAILED",
                          message=(
                              "PID-specific helper attach is unavailable in the selected "
                              "custom active-object runtime dependency universe."
                          ),
                          pid=pid,
                          exception_type="UnsupportedDependency",
                      )
                  )
                  return None, attempts, True

              try:
          '''
          if needle not in text:
              raise SystemExit('connection P1 needle not found')
          text = text.replace(needle, replacement, 1)
          connection.write_text(text, encoding='utf-8')

          test = Path('tests/etabs/test_t1_etabs_test_isolation.py')
          text = test.read_text(encoding='utf-8')
          import_old = '''    STRATEGY_COMTYPES_GET_ACTIVE_OBJECT,
              STRATEGY_WIN32_GET_ACTIVE_OBJECT,
          '''
          import_new = '''    STRATEGY_COMTYPES_GET_ACTIVE_OBJECT,
              STRATEGY_HELPER_GET_OBJECT_PROCESS,
              STRATEGY_WIN32_GET_ACTIVE_OBJECT,
          '''
          if import_old not in text:
              raise SystemExit('T1 import needle not found')
          text = text.replace(import_old, import_new, 1)
          if 'class _PidHelper:' in text:
              raise SystemExit('P1 test block already present')
          suffix = '''class _PidHelper:
              def __init__(self, application: _Application | None) -> None:
                  self.application = application
                  self.calls: list[tuple[str, int]] = []

              def GetObjectProcess(self, prog_id: str, pid: int):
                  self.calls.append((prog_id, pid))
                  if self.application is None:
                      raise RuntimeError("pid application unavailable")
                  return self.application


          class _PidComtypesClient:
              def __init__(self, helper: _PidHelper) -> None:
                  self.helper = helper
                  self.create_calls: list[str] = []

              def CreateObject(self, prog_id: str):
                  self.create_calls.append(prog_id)
                  return self.helper


          def _attach_on_worker_direct(
              connection: ReadOnlyETABSConnection,
              worker: DedicatedSTAWorker,
              request: ConnectionRequest,
          ):
              return worker.call(
                  lambda: connection._attach_on_worker(request),  # noqa: SLF001 - structural owner proof
                  operation="t1_pid_structural_attach",
                  timeout_seconds=1.0,
              )


          def test_t1_custom_runtime_pid_does_not_load_poisoned_default_comtypes(
              monkeypatch: pytest.MonkeyPatch,
              worker: DedicatedSTAWorker,
          ) -> None:
              poison_hits: list[str] = []

              def poison_default_comtypes():
                  poison_hits.append("comtypes.client")
                  raise AssertionError("default comtypes must be unreachable")

              monkeypatch.setattr(connection_module, "_load_comtypes_client", poison_default_comtypes)
              fake_runtime = _ActiveRuntime({"ETABS.TEST": _Application("FAKE-RUNTIME")})
              connection = ReadOnlyETABSConnection(
                  worker,
                  runtime_loader=lambda: fake_runtime,
                  prog_ids=("ETABS.TEST",),
              )

              attachment = _attach_on_worker_direct(
                  connection,
                  worker,
                  ConnectionRequest(target_process_id=4444),
              )
              try:
                  assert connection.attach_diagnostics["strategy"] == STRATEGY_WIN32_GET_ACTIVE_OBJECT
                  assert fake_runtime.calls == ["ETABS.TEST"]
                  assert poison_hits == []
              finally:
                  connection.detach()


          def test_t1_custom_runtime_pid_ignores_default_comtypes_that_would_succeed(
              monkeypatch: pytest.MonkeyPatch,
              worker: DedicatedSTAWorker,
          ) -> None:
              default_loads: list[str] = []
              helper = _PidHelper(_Application("REAL-COMTYPES"))
              real_default_client = _PidComtypesClient(helper)

              def load_default_comtypes():
                  default_loads.append("comtypes.client")
                  return real_default_client

              monkeypatch.setattr(connection_module, "_load_comtypes_client", load_default_comtypes)
              fake_runtime = _ActiveRuntime({"ETABS.TEST": _Application("FAKE-RUNTIME")})
              connection = ReadOnlyETABSConnection(
                  worker,
                  runtime_loader=lambda: fake_runtime,
                  prog_ids=("ETABS.TEST",),
              )

              _attach_on_worker_direct(
                  connection,
                  worker,
                  ConnectionRequest(target_process_id=5555),
              )
              try:
                  assert fake_runtime.calls == ["ETABS.TEST"]
                  assert default_loads == []
                  assert real_default_client.create_calls == []
                  assert helper.calls == []
              finally:
                  connection.detach()


          def test_t1_custom_runtime_pid_failure_has_no_default_comtypes_fallback(
              monkeypatch: pytest.MonkeyPatch,
              worker: DedicatedSTAWorker,
          ) -> None:
              default_loads: list[str] = []
              helper = _PidHelper(_Application("REAL-COMTYPES"))
              real_default_client = _PidComtypesClient(helper)

              def load_default_comtypes():
                  default_loads.append("comtypes.client")
                  return real_default_client

              monkeypatch.setattr(connection_module, "_load_comtypes_client", load_default_comtypes)
              fake_runtime = _ActiveRuntime({"ETABS.TEST": RuntimeError("fake runtime failed")})
              connection = ReadOnlyETABSConnection(
                  worker,
                  runtime_loader=lambda: fake_runtime,
                  prog_ids=("ETABS.TEST",),
              )

              with pytest.raises(ETABSNotRunningError):
                  _attach_on_worker_direct(
                      connection,
                      worker,
                      ConnectionRequest(target_process_id=6666),
                  )

              assert fake_runtime.calls == ["ETABS.TEST"]
              assert default_loads == []
              assert real_default_client.create_calls == []
              assert helper.calls == []
              assert connection.attached is False


          def test_t1_custom_comtypes_pid_uses_custom_comtypes_only(
              monkeypatch: pytest.MonkeyPatch,
              worker: DedicatedSTAWorker,
          ) -> None:
              default_win32_hits: list[str] = []

              def poison_default_win32():
                  default_win32_hits.append("win32com.client")
                  raise AssertionError("generic default win32 must not be used after PID success")

              monkeypatch.setattr(connection_module, "_load_win32com_client", poison_default_win32)
              helper = _PidHelper(_Application("CUSTOM-COMTYPES"))
              custom_client = _PidComtypesClient(helper)
              connection = ReadOnlyETABSConnection(
                  worker,
                  comtypes_loader=lambda: custom_client,
                  prog_ids=("ETABS.TEST",),
              )

              connection.attach(ConnectionRequest(target_process_id=7777))
              try:
                  assert connection.attach_diagnostics["strategy"] == STRATEGY_HELPER_GET_OBJECT_PROCESS
                  assert custom_client.create_calls == [connection_module.HELPER_PROG_ID]
                  assert helper.calls == [("ETABS.TEST", 7777)]
                  assert default_win32_hits == []
              finally:
                  connection.detach()


          def test_t1_default_production_pid_behavior_still_uses_default_comtypes(
              monkeypatch: pytest.MonkeyPatch,
              worker: DedicatedSTAWorker,
          ) -> None:
              default_comtypes_loads: list[str] = []
              default_win32_loads: list[str] = []
              helper = _PidHelper(_Application("DEFAULT-PID"))
              default_client = _PidComtypesClient(helper)

              def load_default_comtypes():
                  default_comtypes_loads.append("comtypes.client")
                  return default_client

              def load_default_win32():
                  default_win32_loads.append("win32com.client")
                  raise AssertionError("generic win32 must not be reached after PID helper success")

              monkeypatch.setattr(connection_module, "_load_comtypes_client", load_default_comtypes)
              monkeypatch.setattr(connection_module, "_load_win32com_client", load_default_win32)
              connection = ReadOnlyETABSConnection(worker, prog_ids=("ETABS.TEST",))

              connection.attach(ConnectionRequest(target_process_id=8888))
              try:
                  assert connection.attach_diagnostics["strategy"] == STRATEGY_HELPER_GET_OBJECT_PROCESS
                  assert default_comtypes_loads == ["comtypes.client"]
                  assert default_client.create_calls == [connection_module.HELPER_PROG_ID]
                  assert helper.calls == [("ETABS.TEST", 8888)]
                  assert default_win32_loads == []
              finally:
                  connection.detach()
          '''
          text = text.rstrip('\n') + '\n\n' + suffix.rstrip('\n') + '\n'
          test.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git add packages/etabs_gateway/src/etabs_gateway/connection.py tests/etabs/test_t1_etabs_test_isolation.py
          echo "connection=$(git hash-object packages/etabs_gateway/src/etabs_gateway/connection.py)"
          echo "test=$(git hash-object tests/etabs/test_t1_etabs_test_isolation.py)"
          tree=$(git write-tree)
          echo "tree=$tree"
          test "$tree" = "e1684c0ae94399b353da62ba9d29d7d92d2e7cd1"
      - name: Commit and push bounded P1
        shell: bash
        run: |
          git config user.name "feridunfc"
          git config user.email "yalduz@gmail.com"
          git commit -m "T1 P1: seal PID attach from default comtypes fallback"
          git push origin HEAD:refs/heads/sprint/t1-etabs-test-isolation-1
