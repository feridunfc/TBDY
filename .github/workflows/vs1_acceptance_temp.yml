name: VS1 Temporary Acceptance Harness

on:
  push:
    branches:
      - sprint/vs-1-live-beam-geometry-f0-cutover
    paths-ignore:
      - .github/vs1_acceptance_result.txt
  pull_request:
    branches:
      - main
    paths-ignore:
      - .github/vs1_acceptance_result.txt

permissions:
  contents: write

jobs:
  vs1-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VS-1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema

      - name: Run and publish bounded acceptance matrix
        shell: bash
        run: |
          set +e
          RESULT=.github/vs1_acceptance_result.txt
          : > "$RESULT"
          echo "VS1_HEAD=$(git rev-parse HEAD)" >> "$RESULT"
          echo "FROZEN_BASE=64cfc1b1464f42c6d5a027609973cc84fd5eb68d" >> "$RESULT"
          echo >> "$RESULT"

          run_gate() {
            name="$1"
            shift
            log="/tmp/vs1_${name//[^A-Za-z0-9]/_}.log"
            "$@" >"$log" 2>&1
            code=$?
            echo "===== ${name} EXIT=${code} =====" >> "$RESULT"
            tail -n 120 "$log" >> "$RESULT"
            echo >> "$RESULT"
            return 0
          }

          run_gate compileall python -m compileall -q tbdy_engine tools tests
          run_gate focused_vs1 python -m pytest -q tests/integration/test_vs1_live_beam_geometry_f0_cutover.py
          run_gate vs0_integration python -m pytest -q tests/integration/test_vs0_architecture_vertical_slice.py
          run_gate f0_4_adapter python -m pytest -q tests/integration/test_f0_4_evidence_authority_adapter.py tests/integration/test_f0_4_supervisor_corrections.py
          run_gate f0_8_b1 python -m pytest -q tests/regulatory/test_f0_8_b1_geometry_parity.py
          run_gate f0_8_dag python -m pytest -q tests/integration/test_f0_8_existing_checks_dag_parity.py
          run_gate finding_tests python -m pytest -q tests/integration/test_f0_6_finding_contract.py
          run_gate regulatory_suite python -m pytest -q tests/regulatory
          run_gate features_suite python -m pytest -q tests/features
          run_gate canonical_checkresult python -m pytest -q tests/checks/test_check_result.py
          run_gate offline_product_acceptance python tools/run_offline_product_acceptance.py --out local_out/vs1_offline_regression
          run_gate full_pytest_vs1 python -m pytest -q

          git worktree add ../vs1_frozen_base 64cfc1b1464f42c6d5a027609973cc84fd5eb68d >/tmp/vs1_worktree.log 2>&1
          worktree_code=$?
          echo "===== baseline_worktree EXIT=${worktree_code} =====" >> "$RESULT"
          cat /tmp/vs1_worktree.log >> "$RESULT"
          echo >> "$RESULT"
          if [ "$worktree_code" -eq 0 ]; then
            (
              cd ../vs1_frozen_base
              python -m pytest -q
            ) >/tmp/vs1_full_base.log 2>&1
            base_code=$?
            echo "===== full_pytest_frozen_base EXIT=${base_code} =====" >> "$RESULT"
            tail -n 120 /tmp/vs1_full_base.log >> "$RESULT"
            echo >> "$RESULT"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT"
          git commit -m "VS-1 acceptance results [vs1-results]" || true
          git push origin "HEAD:sprint/vs-1-live-beam-geometry-f0-cutover" || true
