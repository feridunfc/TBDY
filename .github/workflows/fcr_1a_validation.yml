name: FCR-1A Project Coverage Reconciliation Validation

on:
  push:
    branches:
      - sprint/fcr-1a-project-coverage-reconciliation-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fcr-1a-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository state and current-main baseline
        id: repo_state
        shell: bash
        run: |
          git status --short
          git diff --check origin/main...HEAD
          git diff --stat origin/main...HEAD
          base_sha="$(git rev-parse origin/main)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "Current main baseline: $base_sha"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema

      - name: Compile candidate
        run: python -m compileall -q tbdy_engine tests

      - name: FCR-1A focused acceptance
        run: python -m pytest -q tests/coverage/test_fcr_1a_project_reconciliation.py

      - name: Candidate relevant regression
        id: candidate_relevant
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/product_reports/test_slice_report_contribution.py \
            > candidate_relevant.log 2>&1
          status=$?
          cat candidate_relevant.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Candidate broad product regression
        id: candidate_broad
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/design/columns \
            tests/features \
            tests/product_reports \
            > candidate_broad.log 2>&1
          status=$?
          cat candidate_broad.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkout exact current-main baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.repo_state.outputs.base_sha }}
          path: main_baseline

      - name: Main-baseline relevant regression
        id: baseline_relevant
        shell: bash
        run: |
          set +e
          cd main_baseline
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/product_reports/test_slice_report_contribution.py \
            > ../baseline_relevant.log 2>&1
          status=$?
          cd ..
          cat baseline_relevant.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Main-baseline broad product regression
        id: baseline_broad
        shell: bash
        run: |
          set +e
          cd main_baseline
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/design/columns \
            tests/features \
            tests/product_reports \
            > ../baseline_broad.log 2>&1
          status=$?
          cd ..
          cat baseline_broad.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Candidate regression delta gate
        shell: bash
        env:
          CANDIDATE_RELEVANT_EXIT: ${{ steps.candidate_relevant.outputs.exit_code }}
          BASELINE_RELEVANT_EXIT: ${{ steps.baseline_relevant.outputs.exit_code }}
          CANDIDATE_BROAD_EXIT: ${{ steps.candidate_broad.outputs.exit_code }}
          BASELINE_BROAD_EXIT: ${{ steps.baseline_broad.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          def failure_signatures(path: str) -> set[str]:
              text = Path(path).read_text(encoding="utf-8", errors="replace")
              signatures: set[str] = set()
              for line in text.splitlines():
                  match = re.match(r"^(?:FAILED|ERROR)\s+([^\s]+)", line)
                  if match:
                      signatures.add(match.group(1))
              return signatures

          cases = (
              (
                  "relevant",
                  int(os.environ["CANDIDATE_RELEVANT_EXIT"]),
                  int(os.environ["BASELINE_RELEVANT_EXIT"]),
                  "candidate_relevant.log",
                  "baseline_relevant.log",
              ),
              (
                  "broad",
                  int(os.environ["CANDIDATE_BROAD_EXIT"]),
                  int(os.environ["BASELINE_BROAD_EXIT"]),
                  "candidate_broad.log",
                  "baseline_broad.log",
              ),
          )

          failed = False
          for label, candidate_exit, baseline_exit, candidate_log, baseline_log in cases:
              candidate = failure_signatures(candidate_log)
              baseline = failure_signatures(baseline_log)
              new_failures = candidate - baseline
              print(f"{label}: candidate_exit={candidate_exit} baseline_exit={baseline_exit}")
              print(f"{label}: candidate_failures={sorted(candidate)}")
              print(f"{label}: baseline_failures={sorted(baseline)}")
              print(f"{label}: new_failures={sorted(new_failures)}")

              if candidate_exit == 0:
                  continue
              if not candidate:
                  print(f"{label}: nonzero candidate exit without parsed failure signatures")
                  failed = True
                  continue
              if baseline_exit == 0 or new_failures:
                  failed = True

          if failed:
              raise SystemExit("FCR-1A introduced regression failure(s) beyond current main")
          PY
