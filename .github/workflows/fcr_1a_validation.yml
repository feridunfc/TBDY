name: FCR-1A Project Coverage Reconciliation Validation

on:
  push:
    branches:
      - sprint/fcr-1a-project-coverage-reconciliation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fcr-1a-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Candidate repository state
        run: |
          echo "GIT_STATUS_SHORT_BEGIN"
          git status --short
          echo "GIT_STATUS_SHORT_END"
          echo "GIT_DIFF_STAT_MAIN_HEAD_BEGIN"
          git diff --stat origin/main...HEAD
          echo "GIT_DIFF_STAT_MAIN_HEAD_END"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema

      - name: Compile candidate
        run: python -m compileall -q tbdy_engine tests

      - name: FCR-1A focused acceptance
        run: python -m pytest -q tests/coverage/test_fcr_1a_project_reconciliation.py

      - name: Candidate relevant regression
        id: candidate_relevant
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/product_reports/test_slice_report_contribution.py \
            > candidate_relevant_pytest.log 2>&1
          status=$?
          cat candidate_relevant_pytest.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Candidate full pytest
        id: candidate_full
        shell: bash
        run: |
          set +e
          python -m pytest -q > candidate_full_pytest.log 2>&1
          status=$?
          cat candidate_full_pytest.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkout frozen base for regression comparison
        uses: actions/checkout@v4
        with:
          ref: eab8613182c331ef6886902527b419f4e0cb6639
          path: frozen_base

      - name: Frozen-base relevant regression
        id: base_relevant
        shell: bash
        run: |
          set +e
          cd frozen_base
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/product_reports/test_slice_report_contribution.py \
            > ../base_relevant_pytest.log 2>&1
          status=$?
          cd ..
          cat base_relevant_pytest.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Frozen-base full pytest
        id: base_full
        shell: bash
        run: |
          set +e
          cd frozen_base
          python -m pytest -q > ../base_full_pytest.log 2>&1
          status=$?
          cd ..
          cat base_full_pytest.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Candidate-vs-frozen-base regression gate
        shell: bash
        env:
          CANDIDATE_RELEVANT_EXIT: ${{ steps.candidate_relevant.outputs.exit_code }}
          BASE_RELEVANT_EXIT: ${{ steps.base_relevant.outputs.exit_code }}
          CANDIDATE_FULL_EXIT: ${{ steps.candidate_full.outputs.exit_code }}
          BASE_FULL_EXIT: ${{ steps.base_full.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          def failure_signatures(path: str):
              text = Path(path).read_text(encoding="utf-8", errors="replace")
              signatures = set()
              for line in text.splitlines():
                  m = re.match(r"^(?:FAILED|ERROR)\s+([^\s]+)", line)
                  if m:
                      signatures.add(m.group(1))
              return signatures

          cases = (
              (
                  "relevant",
                  int(os.environ["CANDIDATE_RELEVANT_EXIT"]),
                  int(os.environ["BASE_RELEVANT_EXIT"]),
                  "candidate_relevant_pytest.log",
                  "base_relevant_pytest.log",
              ),
              (
                  "full",
                  int(os.environ["CANDIDATE_FULL_EXIT"]),
                  int(os.environ["BASE_FULL_EXIT"]),
                  "candidate_full_pytest.log",
                  "base_full_pytest.log",
              ),
          )

          failed = False
          for label, candidate_exit, base_exit, candidate_log, base_log in cases:
              candidate_failures = failure_signatures(candidate_log)
              base_failures = failure_signatures(base_log)
              print(f"{label}: candidate_exit={candidate_exit} base_exit={base_exit}")
              print(f"{label}: candidate_failure_signatures={sorted(candidate_failures)}")
              print(f"{label}: base_failure_signatures={sorted(base_failures)}")
              if candidate_exit == 0:
                  continue
              if base_exit == 0 or candidate_failures != base_failures:
                  failed = True

          if failed:
              raise SystemExit("candidate introduced regression failure(s) beyond frozen base")
          PY
