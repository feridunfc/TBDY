name: FCR-1A Project Coverage Reconciliation Validation

on:
  push:
    branches:
      - sprint/fcr-1a-project-coverage-reconciliation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fcr-1a-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch HEAD
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema

      - name: Compile candidate
        run: python -m compileall -q tbdy_engine tests

      - name: FCR-1A focused acceptance
        run: python -m pytest -q tests/coverage/test_fcr_1a_project_reconciliation.py

      - name: Relevant regulatory coverage findings reporting regression
        run: |
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/product_reports/test_slice_report_contribution.py

      - name: Candidate full pytest
        id: candidate_full
        shell: bash
        run: |
          set +e
          python -m pytest -q > candidate_full_pytest.log 2>&1
          status=$?
          cat candidate_full_pytest.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkout frozen base for regression comparison
        uses: actions/checkout@v4
        with:
          ref: eab8613182c331ef6886902527b419f4e0cb6639
          path: frozen_base

      - name: Frozen-base full pytest
        id: base_full
        shell: bash
        run: |
          set +e
          cd frozen_base
          python -m pytest -q > ../base_full_pytest.log 2>&1
          status=$?
          cd ..
          cat base_full_pytest.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Full-regression gate
        shell: bash
        env:
          CANDIDATE_EXIT: ${{ steps.candidate_full.outputs.exit_code }}
          BASE_EXIT: ${{ steps.base_full.outputs.exit_code }}
        run: |
          echo "candidate_full_exit=$CANDIDATE_EXIT"
          echo "frozen_base_full_exit=$BASE_EXIT"
          if [ "$CANDIDATE_EXIT" = "0" ]; then
            exit 0
          fi
          echo "Candidate full pytest is not green; inspect candidate/base logs above."
          exit 1
