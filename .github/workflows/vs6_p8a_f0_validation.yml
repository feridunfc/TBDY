name: VS6-P8A-F0 Column Design Evidence Authority Validation

on:
  push:
    branches:
      - sprint/vs6-p8a-f0-column-design-evidence-authority
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_BASE: fce5509bca335ee92e93db28ca7791a6d530e7d9

jobs:
  vs6-p8a-f0-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify frozen base ancestry and initial hygiene
        shell: bash
        run: |
          test "$(git merge-base "$FROZEN_BASE" HEAD)" = "$FROZEN_BASE"
          test "$(git rev-parse "$FROZEN_BASE")" = "$FROZEN_BASE"
          git diff --check "$FROZEN_BASE"...HEAD
          echo "candidate_head=$(git rev-parse HEAD)"
          echo "frozen_base=$FROZEN_BASE"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install accepted repository test toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            pyyaml \
            jsonschema \
            weasyprint==69.0 \
            pydyf==0.12.1 \
            pypdf==6.16.1 \
            pypdfium2==5.12.1 \
            openpyxl==3.1.5 \
            et_xmlfile==2.0.0

      - name: Compile PASS-1 PASS-2 and PASS-3 candidate
        run: python -m compileall -q tbdy_engine tests

      - name: Fresh-interpreter import safety
        shell: bash
        run: |
          python -c "import tbdy_engine.etabs.source_units"
          python -c "import sys; import tbdy_engine.etabs.source_units; assert 'tbdy_engine.regulatory' not in sys.modules"
          python -c "import tbdy_engine.providers.etabs_concrete_design_combo_selection_probe"
          python -c "import sys; import tbdy_engine.providers.etabs_concrete_design_combo_selection_probe; assert 'tbdy_engine.regulatory' not in sys.modules; assert 'tbdy_engine.features.column_concrete_design_evidence' not in sys.modules"
          python -c "import tbdy_engine.features.column_concrete_design_evidence"
          python -c "import sys; import tbdy_engine.design.columns.column_concrete_design_evidence_authority; assert 'tbdy_engine.regulatory' not in sys.modules"
          python -c "import sys; import tbdy_engine.providers.etabs_concrete_design_section_provider; assert 'tbdy_engine.regulatory' not in sys.modules; assert 'comtypes' not in sys.modules"

      - name: PASS-1 factual selected-combo acquisition regression
        run: |
          python -m pytest -q \
            tests/providers/test_vs6_p8a_f0_concrete_design_combo_selection_probe.py

      - name: PASS-2 Correction-B design-combo authority regression
        run: |
          python -m pytest -q \
            tests/features/test_vs6_p8a_f0_column_design_evidence_authority.py

      - name: PASS-3 component and design-section factual authority
        run: |
          python -m pytest -q \
            tests/providers/test_vs6_p8a_f0_concrete_design_section_provider.py

      - name: Strict topology regression
        run: |
          python -m pytest -q \
            tests/features/test_vs6_column_shear_topology.py \
            tests/features/test_vs6_column_shear_topology_mixed_beams.py

      - name: EvidenceEpoch binding regression
        run: |
          python -m pytest -q \
            tests/providers/test_vs6_p8a_f0_concrete_design_section_provider.py \
            -k evidence_epoch

      - name: Reused ETABS safety and display-table fetcher regression
        run: |
          python -m pytest -q \
            tests/etabs/test_safety_foundation.py

      - name: Reused table registry regression
        run: |
          python -m pytest -q \
            tests/providers/test_table_registry.py \
            tests/contracts/test_table_registry_contract.py

      - name: Reused combo-definition provider regression
        run: |
          python -m pytest -q \
            tests/providers/test_vs6_etabs_combo_definition_provider.py

      - name: Reused name-blind combo-pattern regression
        run: |
          python -m pytest -q \
            tests/design/columns/test_vs6_combo_pattern_engine.py

      - name: Canonical analysis-basis regression
        run: |
          python -m pytest -q \
            tests/regulatory/test_f0_1_kernel.py -k analysis_basis

      - name: Final PASS-3 repository hygiene
        shell: bash
        run: |
          git diff --check "$FROZEN_BASE"...HEAD
          git status --porcelain=v1 -uall
          test -z "$(git status --porcelain=v1 -uall)"
