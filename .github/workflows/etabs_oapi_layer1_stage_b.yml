name: ETABS OAPI Layer 1 Stage B

on:
  push:
    branches: [validation/etabs-oapi-layer1-stage-a]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANDIDATE: df41bf34b12b26a0478407a60a241f7bd2d6cec0
      MAIN: a10f8f12f21c586e685dd792d2d1b016aee7b0ea
      OAPI_PARENT: a4b2c807926f2a1ca79a560e07f97eab6196da70
      BRANCH: sprint/etabs-oapi-layer-1-common-factual-boundary
      EVIDENCE: /tmp/oapi-stage-b
      MAIN_WT: /tmp/oapi-main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify candidate ref and current main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          echo "$GITHUB_SHA" > "$EVIDENCE/workflow_source_sha.txt"
          git fetch --no-tags origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" main
          test "$(git rev-parse "refs/remotes/origin/${BRANCH}")" = "$CANDIDATE"
          test "$(git rev-parse origin/main)" = "$MAIN"
      - uses: actions/checkout@v4
        with:
          ref: df41bf34b12b26a0478407a60a241f7bd2d6cec0
          fetch-depth: 0
          clean: true
      - name: Exact integration gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^1)" = "$OAPI_PARENT"
          test "$(git rev-parse HEAD^2)" = "$MAIN"
          git merge-base --is-ancestor "$MAIN" HEAD
          git diff --check "$MAIN"...HEAD
          test -z "$(git status --porcelain=v1 -uall)"
          printf 'candidate=%s\nparent1=%s\nparent2=%s\nmain=%s\n' "$CANDIDATE" "$(git rev-parse HEAD^1)" "$(git rev-parse HEAD^2)" "$MAIN" > "$EVIDENCE/exactness.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema weasyprint==69.0 pydyf==0.12.1 pypdf==6.16.1 pypdfium2==5.12.1 openpyxl==3.1.5 et_xmlfile==2.0.0
          python --version > "$EVIDENCE/python.txt"
          python -m pip freeze | sort > "$EVIDENCE/toolchain.txt"
      - name: Compile and import
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m compileall -q tbdy_engine tests packages/etabs_gateway
          python - <<'PY' | tee "$EVIDENCE/imports.txt"
          import etabs_gateway
          import tbdy_engine.etabs.safety
          import tbdy_engine.etabs.oapi
          import tbdy_engine.integration.live_etabs_acquisition_context
          import tbdy_engine.engine.project_execution
          print('PASS')
          PY
      - name: Gateway focused current-main delta
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 300s python -m pytest -q packages/etabs_gateway/tests > "$EVIDENCE/gateway_candidate.log" 2>&1
          crc=$?
          set -e
          test "$crc" -ne 124
          echo "$crc" > "$EVIDENCE/gateway_candidate.rc"
          grep -E '^(FAILED|ERROR) |^ERROR collecting ' "$EVIDENCE/gateway_candidate.log" | sort -u > "$EVIDENCE/gateway_candidate.sig" || true
          git worktree add --detach "$MAIN_WT" "$MAIN"
          set +e
          (cd "$MAIN_WT" && PYTHONPATH="$MAIN_WT/packages/etabs_gateway/src:$MAIN_WT" timeout --signal=TERM --kill-after=10s 300s python -m pytest -q packages/etabs_gateway/tests > "$EVIDENCE/gateway_main.log" 2>&1)
          mrc=$?
          set -e
          test "$mrc" -ne 124
          echo "$mrc" > "$EVIDENCE/gateway_main.rc"
          grep -E '^(FAILED|ERROR) |^ERROR collecting ' "$EVIDENCE/gateway_main.log" | sort -u > "$EVIDENCE/gateway_main.sig" || true
          comm -13 "$EVIDENCE/gateway_main.sig" "$EVIDENCE/gateway_candidate.sig" > "$EVIDENCE/gateway_new.sig"
          comm -23 "$EVIDENCE/gateway_main.sig" "$EVIDENCE/gateway_candidate.sig" > "$EVIDENCE/gateway_missing.sig"
          test ! -s "$EVIDENCE/gateway_new.sig"
          test ! -s "$EVIDENCE/gateway_missing.sig"
          git worktree remove --force "$MAIN_WT"
      - name: OAPI safety architecture focused
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s python -m pytest -q tests/etabs | tee "$EVIDENCE/etabs.log"
          timeout --signal=TERM --kill-after=10s 300s python -m pytest -q tests/integration/test_acq_ctx_1_trusted_live_etabs_acquisition_context.py tests/integration/test_etabs_oapi_live_acceptance_infrastructure.py | tee "$EVIDENCE/oapi_integration.log"
      - name: A1 product-spine integration
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s python -m pytest -q tests/application/test_product_spine_col_1.py | tee "$EVIDENCE/product_spine.log"
      - name: Migrated provider regressions
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$EVIDENCE/provider_paths.txt"
          from pathlib import Path
          tokens=('tbdy_engine.etabs.oapi','etabs_column_endpoint_restraint_provider','etabs_column_rebar_intent_provider','etabs_combo_definition_provider','etabs_static_linear_case_provider','etabs_load_pattern_catalog_provider','etabs_concrete_column_design_result_provider','etabs_concrete_design_section_provider','etabs_strict_column_topology_provider','etabs_concrete_design_combo_selection_probe')
          out=[]
          for p in Path('tests').rglob('test_*.py'):
              s=p.read_text(encoding='utf-8-sig', errors='replace')
              if any(t in s for t in tokens): out.append(p.as_posix())
          print('\n'.join(sorted(set(out))))
          PY
          mapfile -t paths < "$EVIDENCE/provider_paths.txt"
          test ${#paths[@]} -gt 0
          timeout --signal=TERM --kill-after=10s 600s python -m pytest -q "${paths[@]}" | tee "$EVIDENCE/providers.log"
      - name: Architecture invariants
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pytest -q tests/etabs/test_oapi_layer1_architecture_guards.py | tee "$EVIDENCE/architecture.log"
      - name: Candidate broad
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=30s 1800s python -m pytest -q > "$EVIDENCE/candidate.log" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 124
          echo "$rc" > "$EVIDENCE/candidate.rc"
          grep -E '^(FAILED|ERROR) |^ERROR collecting ' "$EVIDENCE/candidate.log" | sort -u > "$EVIDENCE/candidate.sig" || true
      - name: Current-main broad
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$MAIN_WT" "$MAIN"
          set +e
          (cd "$MAIN_WT" && PYTHONPATH="$MAIN_WT/packages/etabs_gateway/src:$MAIN_WT" timeout --signal=TERM --kill-after=30s 1800s python -m pytest -q > "$EVIDENCE/main.log" 2>&1)
          rc=$?
          set -e
          test "$rc" -ne 124
          echo "$rc" > "$EVIDENCE/main.rc"
          grep -E '^(FAILED|ERROR) |^ERROR collecting ' "$EVIDENCE/main.log" | sort -u > "$EVIDENCE/main.sig" || true
      - name: Exact Stage-B delta and hygiene
        shell: bash
        run: |
          set -euo pipefail
          comm -13 "$EVIDENCE/main.sig" "$EVIDENCE/candidate.sig" > "$EVIDENCE/new.sig"
          comm -23 "$EVIDENCE/main.sig" "$EVIDENCE/candidate.sig" > "$EVIDENCE/missing.sig"
          test ! -s "$EVIDENCE/new.sig"
          test ! -s "$EVIDENCE/missing.sig"
          git worktree remove --force "$MAIN_WT"
          git diff --check "$MAIN"..."$CANDIDATE"
          test -z "$(git status --porcelain=v1 -uall)"
          git fetch --no-tags origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" main
          test "$(git rev-parse "refs/remotes/origin/${BRANCH}")" = "$CANDIDATE"
          test "$(git rev-parse origin/main)" = "$MAIN"
          printf 'STATE=STAGE_B_OFFLINE_GREEN_READY_FOR_LIVE_ACCEPTANCE\nCANDIDATE=%s\nMAIN=%s\ncandidate_rc=%s\nmain_rc=%s\nnew=0\nmissing=0\nhygiene=PASS\n' "$CANDIDATE" "$MAIN" "$(cat "$EVIDENCE/candidate.rc")" "$(cat "$EVIDENCE/main.rc")" | tee "$EVIDENCE/summary.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etabs-oapi-layer1-stage-b-evidence
          path: /tmp/oapi-stage-b
          retention-days: 30
