name: VS6-P8A Design-Informed Column Rebar Validation

on:
  push:
    branches:
      - sprint/vs6-p8a-design-informed-column-rebar
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_BASE: fce5509bca335ee92e93db28ca7791a6d530e7d9

jobs:
  vs6-p8a-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify frozen base ancestry and hygiene
        shell: bash
        run: |
          test "$(git merge-base "$FROZEN_BASE" HEAD)" = "$FROZEN_BASE"
          test "$(git rev-parse "$FROZEN_BASE")" = "$FROZEN_BASE"
          git diff --check "$FROZEN_BASE"...HEAD
          git diff --stat "$FROZEN_BASE"...HEAD
          echo "candidate_head=$(git rev-parse HEAD)"
          echo "frozen_base=$FROZEN_BASE"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema weasyprint==69.0 pydyf==0.12.1 pypdf==6.16.1 pypdfium2==5.12.1 openpyxl==3.1.5 et_xmlfile==2.0.0

      - name: Compile candidate
        run: python -m compileall -q tbdy_engine tests

      - name: Focused P8A and reused authority regression
        run: |
          python -m pytest -q \
            tests/features/test_vs6_p8a_column_design_rebar_evidence.py \
            tests/design/columns/test_vs6_p8a_design_informed_rebar.py \
            tests/design/columns/test_vs6_column_rebar_design_engine.py \
            tests/design/columns/test_vs6_rebar_selection.py \
            tests/design/columns/test_vs6_rebar_layout.py \
            tests/design/columns/test_vs6_section_capacity.py \
            tests/design/columns/test_vs6_p7_column_shear.py \
            tests/features/test_vs6_column_design_demand_evidence.py

      - name: Candidate broad regression
        id: candidate_broad
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/regulatory tests/coverage tests/design/columns tests/features tests/product_reports > candidate_broad.log 2>&1
          status=$?
          cat candidate_broad.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkout exact frozen-base baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.FROZEN_BASE }}
          path: frozen_base

      - name: Frozen-base broad regression
        id: baseline_broad
        shell: bash
        run: |
          set +e
          cd frozen_base
          python -m pytest -q tests/regulatory tests/coverage tests/design/columns tests/features tests/product_reports > ../baseline_broad.log 2>&1
          status=$?
          cd ..
          cat baseline_broad.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Exact zero-failure broad delta gate
        shell: bash
        env:
          CANDIDATE_BROAD_EXIT: ${{ steps.candidate_broad.outputs.exit_code }}
          BASELINE_BROAD_EXIT: ${{ steps.baseline_broad.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          def signatures(path):
              result=set()
              for line in Path(path).read_text(encoding="utf-8", errors="replace").splitlines():
                  m=re.match(r"^(?:FAILED|ERROR)\s+([^\s]+)", line)
                  if m: result.add(m.group(1))
              return result
          candidate=signatures("candidate_broad.log")
          baseline=signatures("baseline_broad.log")
          print("candidate_failures=", sorted(candidate))
          print("baseline_failures=", sorted(baseline))
          print("new_failures=", sorted(candidate-baseline))
          if int(os.environ["BASELINE_BROAD_EXIT"]) != 0 or baseline:
              raise SystemExit("frozen base is not zero-failure broad baseline")
          if int(os.environ["CANDIDATE_BROAD_EXIT"]) != 0 or candidate:
              raise SystemExit("candidate broad suite is not zero-failure")
          PY

      - name: Cleanup and final repository hygiene
        shell: bash
        run: |
          rm -rf frozen_base candidate_broad.log baseline_broad.log
          git diff --check "$FROZEN_BASE"...HEAD
          test -z "$(git status --porcelain=v1 -uall)"
