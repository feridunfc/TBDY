name: FND-COL-2 Eccentricity Slenderness Stability Authority Validation

on:
  push:
    branches:
      - sprint/fnd-col-2-eccentricity-slenderness-stability-authority
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_BASE: 2ae920836649f1bab5c46b5ac38bf05a4353b35b

jobs:
  fnd-col-2-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify frozen-base ancestry and initial hygiene
        shell: bash
        run: |
          test "$(git merge-base "$FROZEN_BASE" HEAD)" = "$FROZEN_BASE"
          test "$(git rev-parse "$FROZEN_BASE")" = "$FROZEN_BASE"
          git diff --check "$FROZEN_BASE"...HEAD
          echo "candidate_head=$(git rev-parse HEAD)"
          echo "frozen_base=$FROZEN_BASE"
          git diff --name-only "$FROZEN_BASE"...HEAD

      - name: PASS-0 exact caller discovery
        shell: bash
        run: |
          for symbol in \
            apply_ts500_minimum_eccentricity \
            resolve_ts500_column_slenderness_basis \
            evaluate_ts500_column_slenderness \
            evaluate_ts500_story_stability_index \
            resolve_ts500_story_sway_from_stability_indices \
            resolve_ts500_stability_load_inventory \
            assess_ts500_eq713_stiffness_basis \
            resolve_ts500_column_free_length \
            evaluate_column_design_demands \
            evaluate_column_design \
            AnalysisBasisEligibilityEvidence \
            LIVE_BLOCKED_ANALYSIS_BASIS_EVIDENCE_REQUIRED; do
            echo "===== $symbol ====="
            grep -RIn --exclude-dir=.git --exclude='*.pyc' "$symbol" tbdy_engine tests tools docs || true
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install accepted repository test toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            pyyaml \
            jsonschema \
            weasyprint==69.0 \
            pydyf==0.12.1 \
            pypdf==6.16.1 \
            pypdfium2==5.12.1 \
            openpyxl==3.1.5 \
            et_xmlfile==2.0.0

      - name: Compile/import
        run: |
          python -m compileall -q tbdy_engine tests
          python -c "import tbdy_engine.design.columns.minimum_eccentricity"
          python -c "import tbdy_engine.design.columns.slenderness_basis"
          python -c "import tbdy_engine.design.columns.slenderness"
          python -c "import tbdy_engine.design.columns.sway_stability"
          python -c "import tbdy_engine.design.columns.stability_action_basis"
          python -c "import tbdy_engine.design.columns.stability_stiffness_basis"
          python -c "import tbdy_engine.design.columns.free_length_basis"
          python -c "import tbdy_engine.design.columns.column_design_demand_engine"
          python -c "import tbdy_engine.design.columns.column_design_readiness"
          python -c "import tbdy_engine.regulatory.fnd_col_2"
          python -c "import tbdy_engine.regulatory.fnd_col_2_authority"
          python -c "import tbdy_engine.regulatory.fnd_col_2_program"

      - name: F0.9 reviewed implementation fingerprint probe
        shell: bash
        run: |
          python - <<'PY'
          from tbdy_engine.regulatory.authority import implementation_fingerprint
          from tbdy_engine.regulatory.fnd_col_2 import RULE_ID, RULE_VERSION, SPEC
          from tbdy_engine.regulatory.fnd_col_2_authority import (
              APPROVED_IMPLEMENTATION_FINGERPRINT,
              APPROVED_IMPLEMENTATION_MODULES,
          )
          actual = implementation_fingerprint(
              rule_id=RULE_ID,
              rule_version=RULE_VERSION,
              evaluator_binding_id=SPEC.evaluator.binding_id,
              implementation_modules=APPROVED_IMPLEMENTATION_MODULES,
          )
          print("FND_COL_2_IMPLEMENTATION_FINGERPRINT=" + actual)
          assert actual == APPROVED_IMPLEMENTATION_FINGERPRINT
          PY

      - name: Focused FND-COL-2 proofs
        run: |
          python -m pytest -q \
            tests/design/columns/test_fnd_col_2_design_readiness.py \
            tests/regulatory/test_fnd_col_2_f0.py \
            tests/regulatory/test_fnd_col_2_authority_package.py \
            tests/regulatory/test_fnd_col_2_p8a_boundary.py \
            tests/integration/test_fnd_col_2_shared_import_delta.py

      - name: Existing column suite
        run: python -m pytest -q tests/design/columns

      - name: Regulatory suite
        run: python -m pytest -q tests/regulatory

      - name: Broad candidate versus frozen-base delta
        shell: bash
        run: |
          set +e
          python -m pytest -q > /tmp/candidate.log 2>&1
          candidate_rc=$?
          git worktree add --detach /tmp/frozen-base "$FROZEN_BASE"
          (
            cd /tmp/frozen-base
            python -m pytest -q > /tmp/base.log 2>&1
          )
          base_rc=$?
          set -e

          grep -E '^(FAILED|ERROR) |^ERROR collecting ' /tmp/candidate.log | sort -u > /tmp/candidate.sig || true
          grep -E '^(FAILED|ERROR) |^ERROR collecting ' /tmp/base.log | sort -u > /tmp/base.sig || true
          comm -23 /tmp/candidate.sig /tmp/base.sig > /tmp/new.sig || true

          echo "candidate_pytest_exit=$candidate_rc"
          echo "frozen_base_pytest_exit=$base_rc"
          echo "candidate_failure_signatures:"
          cat /tmp/candidate.sig || true
          echo "frozen_base_failure_signatures:"
          cat /tmp/base.sig || true
          echo "new_failure_signatures:"
          cat /tmp/new.sig || true
          echo "candidate_tail:"
          tail -n 40 /tmp/candidate.log || true
          echo "frozen_base_tail:"
          tail -n 40 /tmp/base.log || true

          test ! -s /tmp/new.sig
          if [ "$base_rc" -eq 0 ]; then
            test "$candidate_rc" -eq 0
          fi
          git worktree remove --force /tmp/frozen-base

      - name: Determinism replay
        run: |
          python -m pytest -q \
            tests/regulatory/test_fnd_col_2_authority_package.py::test_source_bound_compile_and_execution_are_deterministic \
            tests/regulatory/test_fnd_col_2_f0.py::test_f0_output_is_deterministic_and_never_emits_engine_selected_rebar
          python -m pytest -q \
            tests/regulatory/test_fnd_col_2_authority_package.py::test_source_bound_compile_and_execution_are_deterministic \
            tests/regulatory/test_fnd_col_2_f0.py::test_f0_output_is_deterministic_and_never_emits_engine_selected_rebar

      - name: Final repository hygiene
        shell: bash
        run: |
          git diff --check "$FROZEN_BASE"...HEAD
          git status --porcelain=v1 -uall
          test -z "$(git status --porcelain=v1 -uall)"
