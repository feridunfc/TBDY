name: B2 Ndm Supervisor Patch 1 V2

on:
  push:
    branches: [sprint/b2-ndm-result-selection]

permissions:
  contents: write

jobs:
  patch-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/b2-ndm-result-selection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse guarded patch with generator fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/b2_ndm_supervisor_patch_1.yml').read_text(encoding='utf-8').splitlines()
          start_marker = "          python - <<'PY'"
          end_marker = "          PY"
          start = workflow.index(start_marker) + 1
          end = workflow.index(end_marker, start)
          script_lines = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script_lines) + "\n"

          bad = '    assert demand.ndm_n is None\\n\\n\\n@pytest.mark.parametrize(\\"capture\\"' + "''',"
          good = '    assert demand.ndm_n is None\\n\\n\\n' + "''',"
          if script.count(bad) != 1:
              raise SystemExit(f'generator repair anchor count != 1: {script.count(bad)}')
          script = script.replace(bad, good, 1)
          exec(compile(script, '<b2-supervisor-patch-1>', 'exec'), {'__name__': '__main__'})
          PY
          python -m pip install pytest pyyaml jsonschema
          python -m compileall -q tbdy_engine tests
          python -m pytest -q tests/result_selection/test_b2_ndm_selection.py
          git diff --check
      - name: Commit narrow source and tests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tbdy_engine/checks/ndm_selection.py tbdy_engine/checks/wall_pipeline.py tests/result_selection/test_b2_ndm_selection.py
          git diff --cached --quiet && { echo 'No patch changes staged'; exit 1; }
          git commit -m 'B2 fix Ndm supervisor patch 1 blockers'
          git push origin HEAD:sprint/b2-ndm-result-selection
