name: VS4A Temporary Authority Boundary Runner
on:
  push:
    branches: [sprint/vs-4a-rc-system-baseline-policy]
permissions:
  contents: write
jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml jsonschema
      - name: Apply reviewed authority-boundary correction
        run: python .vs4a_authority_boundary_patch.py
      - name: Run complete fresh acceptance matrix
        id: accept
        continue-on-error: true
        run: bash .vs4a_acceptance.sh
      - name: Commit corrected slice and temporary result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tbdy_engine/regulatory/structural_system.py \
            tbdy_engine/regulatory/vs4a_program.py \
            tbdy_engine/regulatory/sources/tbdy2018.py \
            tests/regulatory/test_structural_system.py \
            tests/regulatory/test_vs4a_source_authority.py \
            docs/architecture/VS4A_RC_SYSTEM_BASELINE_POLICY.md \
            docs/architecture/VS4A_RC_SYSTEM_BASELINE_POLICY_STATUS.md \
            local_out/vs4a_acceptance_result.txt
          if ! git diff --cached --quiet; then
            git commit -m "VS-4A bind formal applicability to reviewed implementation"
            git push origin HEAD:sprint/vs-4a-rc-system-baseline-policy
          fi
      - name: Enforce acceptance
        if: always()
        run: test "${{ steps.accept.outcome }}" = "success"
