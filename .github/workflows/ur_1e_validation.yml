name: UR-1E Deterministic Report Package Validation

on:
  push:
    branches:
      - sprint/ur-1e-report-package-xlsx-json
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  UR1E_HISTORICAL_BASE: e98ed36c13e8821f1e1a16a08eaee5b556b1dbce

jobs:
  ur-1e-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact PR regression base and initial hygiene
        if: github.event_name == 'pull_request'
        id: pr_base
        shell: bash
        env:
          CURRENT_REGRESSION_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -n "$CURRENT_REGRESSION_BASE"
          git cat-file -e "$CURRENT_REGRESSION_BASE^{commit}"
          test "$(git merge-base "$CURRENT_REGRESSION_BASE" HEAD)" = "$CURRENT_REGRESSION_BASE"
          git status --short
          git diff --check "$CURRENT_REGRESSION_BASE"...HEAD
          git diff --stat "$CURRENT_REGRESSION_BASE"...HEAD
          echo "sha=$CURRENT_REGRESSION_BASE" >> "$GITHUB_OUTPUT"
          echo "candidate_head=$(git rev-parse HEAD)"
          echo "pr_base_sha_resolved=$CURRENT_REGRESSION_BASE"
          echo "current_regression_base=$CURRENT_REGRESSION_BASE"
          echo "historical_ur1e_base=$UR1E_HISTORICAL_BASE"
          echo "historical_base_used_as_current_pr_baseline=false"

      - name: Verify historical UR-1E replay base and initial hygiene
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$UR1E_HISTORICAL_BASE^{commit}"
          test "$(git merge-base "$UR1E_HISTORICAL_BASE" HEAD)" = "$UR1E_HISTORICAL_BASE"
          git status --short
          git diff --check "$UR1E_HISTORICAL_BASE"...HEAD
          git diff --stat "$UR1E_HISTORICAL_BASE"...HEAD
          echo "candidate_head=$(git rev-parse HEAD)"
          echo "historical_ur1e_base=$UR1E_HISTORICAL_BASE"
          echo "historical_replay_mode=true"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic report toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            pyyaml \
            jsonschema \
            weasyprint==69.0 \
            pydyf==0.12.1 \
            pypdf==6.16.1 \
            pypdfium2==5.12.1 \
            openpyxl==3.1.5 \
            et_xmlfile==2.0.0
          python -m pip install -e packages/etabs_gateway

      - name: Compile candidate
        run: python -m compileall -q tbdy_engine tests

      - name: Focused UR-1E and upstream reporting acceptance
        run: |
          python -m pytest -q \
            tests/product_reports/test_ur_1e_report_package.py \
            tests/product_reports/test_report_artifact.py \
            tests/product_reports/test_unified_building_report.py \
            tests/product_reports/test_building_report_projection.py \
            tests/product_reports/test_building_report_projection_ui_ready.py \
            tests/product_reports/test_report_presentation_selection.py \
            tests/product_reports/test_building_report_html.py \
            tests/product_reports/test_building_report_html_attribute_quoting.py \
            tests/product_reports/test_building_report_pdf.py

      - name: Determinism SHA double-render evidence
        shell: bash
        run: |
          python - <<'PY'
          from importlib.util import module_from_spec, spec_from_file_location
          from io import BytesIO
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          from tbdy_engine.product_reports.building_report_json import export_building_report_model_json
          from tbdy_engine.product_reports.building_report_package import (
              build_building_report_package,
              build_report_delivery_artifacts,
          )

          helper_path = Path("tests/product_reports/test_building_report_html.py")
          spec = spec_from_file_location("_ur_1e_ci_helpers", helper_path)
          if spec is None or spec.loader is None:
              raise SystemExit("could not load canonical UR-1C test helpers")
          module = module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          model = module._model((("A", "PASS"), ("B", "FAIL")), formula_rule="A", formula="Ndm <= 0.40 Ac fck")

          delivery_1 = {item.filename: item for item in build_report_delivery_artifacts(model)}
          delivery_2 = {item.filename: item for item in build_report_delivery_artifacts(model)}
          canonical_1 = export_building_report_model_json(model)
          canonical_2 = export_building_report_model_json(model)
          package_1 = build_building_report_package(model)
          package_2 = build_building_report_package(model)

          evidence = (
              ("building_report_model.json", canonical_1, canonical_2, True),
              ("engineering.xlsx", delivery_1["engineering.xlsx"], delivery_2["engineering.xlsx"], True),
              ("audit.xlsx", delivery_1["audit.xlsx"], delivery_2["audit.xlsx"], True),
              ("manifest.json", delivery_1["manifest.json"], delivery_2["manifest.json"], True),
              ("building_report_package.zip", package_1, package_2, True),
          )
          for name, first, second, require_bytes in evidence:
              print(f"{name}: run1_sha256={first.sha256}")
              print(f"{name}: run2_sha256={second.sha256}")
              print(f"{name}: run1_artifact_id={first.artifact_id}")
              print(f"{name}: run2_artifact_id={second.artifact_id}")
              if first.sha256 != second.sha256 or first.artifact_id != second.artifact_id:
                  raise SystemExit(f"deterministic identity mismatch: {name}")
              if require_bytes and first.content != second.content:
                  raise SystemExit(f"byte determinism mismatch: {name}")

          with ZipFile(BytesIO(package_1.content), "r") as archive:
              if archive.read("building_report_model.json") != canonical_1.content:
                  raise SystemExit("canonical model JSON in package does not match direct export")
          PY

      - name: Candidate broad regression
        id: candidate_broad
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/design/columns \
            tests/features \
            tests/product_reports \
            > candidate_broad.log 2>&1
          status=$?
          cat candidate_broad.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkout exact current PR regression base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr_base.outputs.sha }}
          path: current_base

      - name: Install exact current-base gateway package
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C current_base rev-parse HEAD)" = "${{ steps.pr_base.outputs.sha }}"
          python -m pip install --no-deps --force-reinstall -e "$GITHUB_WORKSPACE/current_base/packages/etabs_gateway"

      - name: Current PR base broad regression
        if: github.event_name == 'pull_request'
        id: current_base_broad
        shell: bash
        run: |
          set +e
          cd current_base
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/design/columns \
            tests/features \
            tests/product_reports \
            > ../current_base_broad.log 2>&1
          status=$?
          cd ..
          cat current_base_broad.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Current PR zero-new regression gate
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CANDIDATE_BROAD_EXIT: ${{ steps.candidate_broad.outputs.exit_code }}
          CURRENT_BASE_BROAD_EXIT: ${{ steps.current_base_broad.outputs.exit_code }}
          CURRENT_REGRESSION_BASE: ${{ steps.pr_base.outputs.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          ANSI = re.compile(r"\x1b\[[0-9;]*m")
          SUMMARY = re.compile(r"^(FAILED|ERROR)\s+(\S+)(?:\s+-\s+(.+))?$")
          EXCEPTION = re.compile(r"\b([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception))\b")

          def failure_signatures(path: str) -> set[str]:
              text = Path(path).read_text(encoding="utf-8", errors="replace")
              signatures: set[str] = set()
              for raw_line in text.splitlines():
                  line = ANSI.sub("", raw_line).strip()
                  match = SUMMARY.match(line)
                  if not match:
                      continue
                  outcome, node, detail = match.groups()
                  failure_class = outcome
                  if detail:
                      exception = EXCEPTION.search(detail)
                      if exception:
                          failure_class = exception.group(1).rsplit(".", 1)[-1]
                      elif "assert " in detail or detail.startswith("assert"):
                          failure_class = "AssertionError"
                  signatures.add(f"{node}|{failure_class}")
              return signatures

          candidate_exit = int(os.environ["CANDIDATE_BROAD_EXIT"])
          current_base_exit = int(os.environ["CURRENT_BASE_BROAD_EXIT"])
          candidate = failure_signatures("candidate_broad.log")
          current_base = failure_signatures("current_base_broad.log")
          new_failures = candidate - current_base
          resolved_failures = current_base - candidate

          print(f"current_regression_base={os.environ['CURRENT_REGRESSION_BASE']}")
          print(f"historical_ur1e_base={os.environ['UR1E_HISTORICAL_BASE']}")
          print("historical_base_used_as_current_pr_baseline=false")
          print("failure_signature_key_format=NODE|NORMALIZED_FAILURE_CLASS")
          print(f"candidate_exit={candidate_exit}")
          print(f"current_base_exit={current_base_exit}")
          print(f"candidate_failures={sorted(candidate)}")
          print(f"current_base_failures={sorted(current_base)}")
          print(f"resolved_failures={sorted(resolved_failures)}")
          print(f"new_failures={sorted(new_failures)}")

          if candidate_exit != 0 and not candidate:
              raise SystemExit("candidate broad failed without a deterministic parsed failure signature")
          if current_base_exit != 0 and not current_base:
              raise SystemExit("current-base broad failed without a deterministic parsed failure signature")
          if new_failures:
              raise SystemExit("UR-1E current PR introduced new or materially changed failure signatures")
          PY

      - name: Checkout immutable historical UR-1E base
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.UR1E_HISTORICAL_BASE }}
          path: historical_base

      - name: Install historical-base gateway package
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C historical_base rev-parse HEAD)" = "$UR1E_HISTORICAL_BASE"
          python -m pip install --no-deps --force-reinstall -e "$GITHUB_WORKSPACE/historical_base/packages/etabs_gateway"

      - name: Historical UR-1E base broad regression
        if: github.event_name != 'pull_request'
        id: historical_broad
        shell: bash
        run: |
          set +e
          cd historical_base
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/design/columns \
            tests/features \
            tests/product_reports \
            > ../historical_broad.log 2>&1
          status=$?
          cd ..
          cat historical_broad.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Immutable historical UR-1E replay gate
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CANDIDATE_BROAD_EXIT: ${{ steps.candidate_broad.outputs.exit_code }}
          HISTORICAL_BROAD_EXIT: ${{ steps.historical_broad.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          ANSI = re.compile(r"\x1b\[[0-9;]*m")
          SUMMARY = re.compile(r"^(FAILED|ERROR)\s+(\S+)(?:\s+-\s+(.+))?$")
          EXCEPTION = re.compile(r"\b([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception))\b")

          def failure_signatures(path: str) -> set[str]:
              text = Path(path).read_text(encoding="utf-8", errors="replace")
              signatures: set[str] = set()
              for raw_line in text.splitlines():
                  line = ANSI.sub("", raw_line).strip()
                  match = SUMMARY.match(line)
                  if not match:
                      continue
                  outcome, node, detail = match.groups()
                  failure_class = outcome
                  if detail:
                      exception = EXCEPTION.search(detail)
                      if exception:
                          failure_class = exception.group(1).rsplit(".", 1)[-1]
                      elif "assert " in detail or detail.startswith("assert"):
                          failure_class = "AssertionError"
                  signatures.add(f"{node}|{failure_class}")
              return signatures

          candidate_exit = int(os.environ["CANDIDATE_BROAD_EXIT"])
          historical_exit = int(os.environ["HISTORICAL_BROAD_EXIT"])
          candidate = failure_signatures("candidate_broad.log")
          historical = failure_signatures("historical_broad.log")

          print(f"historical_ur1e_base={os.environ['UR1E_HISTORICAL_BASE']}")
          print("historical_ur1e_replay=true")
          print("failure_signature_key_format=NODE|NORMALIZED_FAILURE_CLASS")
          print(f"candidate_exit={candidate_exit}")
          print(f"historical_exit={historical_exit}")
          print(f"candidate_failures={sorted(candidate)}")
          print(f"historical_failures={sorted(historical)}")

          if historical_exit != 0 or historical:
              raise SystemExit("immutable historical UR-1E base must remain absolutely green")
          if candidate_exit != 0 or candidate:
              raise SystemExit("historical UR-1E replay candidate must remain absolutely green")
          PY

      - name: Remove CI-created evidence files and baseline checkouts
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/current_base" "$GITHUB_WORKSPACE/historical_base"
          rm -rf -- "$GITHUB_WORKSPACE/packages/etabs_gateway/src/tbdy_etabs_gateway.egg-info"
          rm -f -- \
            "$GITHUB_WORKSPACE/candidate_broad.log" \
            "$GITHUB_WORKSPACE/current_base_broad.log" \
            "$GITHUB_WORKSPACE/historical_broad.log"

      - name: Final current-PR repository hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CURRENT_REGRESSION_BASE: ${{ steps.pr_base.outputs.sha }}
        run: |
          set -euo pipefail
          git diff --check "$CURRENT_REGRESSION_BASE"...HEAD
          git status --short
          test -z "$(git status --short)"

      - name: Final historical-replay repository hygiene
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$UR1E_HISTORICAL_BASE"...HEAD
          git status --short
          test -z "$(git status --short)"
