name: ETABS OAPI Layer 1 Stage A Validation

on:
  push:
    branches:
      - validation/etabs-oapi-layer1-stage-a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-hang-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: 008e9c569d3022a5e9c676cf5ec7a166c0a34f26
      FROZEN_BASE_SHA: 74d5b6083afed75e44b832336c31755aee482daa
      CANDIDATE_BRANCH: sprint/etabs-oapi-layer-1-common-factual-boundary
      EVIDENCE_DIR: /tmp/etabs-oapi-layer1-safety-hang
      BASE_WORKTREE: /tmp/tbdy-oapi-frozen

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate ref
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/workflow_source_sha.txt"
          git fetch --no-tags origin "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")"
          printf '%s\n' "$actual" > "$EVIDENCE_DIR/candidate_ref_before.txt"
          test "$actual" = "$CANDIDATE_SHA"

      - uses: actions/checkout@v4
        with:
          ref: 008e9c569d3022a5e9c676cf5ec7a166c0a34f26
          fetch-depth: 0
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema weasyprint==69.0 pydyf==0.12.1 pypdf==6.16.1 pypdfium2==5.12.1 openpyxl==3.1.5 et_xmlfile==2.0.0

      - name: Candidate safety foundation under hard timeout
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=5s 30s python -m pytest -vv -s tests/etabs/test_safety_foundation.py > "$EVIDENCE_DIR/candidate_safety_foundation.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/candidate_safety_foundation.rc"
          tail -n 100 "$EVIDENCE_DIR/candidate_safety_foundation.log"

      - name: Candidate verified runtime under hard timeout
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=5s 30s python -m pytest -vv -s tests/etabs/test_oapi_layer1_verified_safety_runtime.py > "$EVIDENCE_DIR/candidate_verified_runtime.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/candidate_verified_runtime.rc"
          tail -n 100 "$EVIDENCE_DIR/candidate_verified_runtime.log"

      - name: Candidate architecture guards under hard timeout
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=5s 30s python -m pytest -vv -s tests/etabs/test_oapi_layer1_architecture_guards.py > "$EVIDENCE_DIR/candidate_architecture.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/candidate_architecture.rc"
          tail -n 100 "$EVIDENCE_DIR/candidate_architecture.log"

      - name: Frozen safety foundation under hard timeout
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$BASE_WORKTREE" "$FROZEN_BASE_SHA"
          cd "$BASE_WORKTREE"
          set +e
          PYTHONPATH="$BASE_WORKTREE/packages/etabs_gateway/src:$BASE_WORKTREE" timeout --signal=TERM --kill-after=5s 30s python -m pytest -vv -s tests/etabs/test_safety_foundation.py > "$EVIDENCE_DIR/frozen_safety_foundation.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/frozen_safety_foundation.rc"
          tail -n 100 "$EVIDENCE_DIR/frozen_safety_foundation.log"

      - name: Summarize diagnostic
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "candidate_safety_foundation_rc=$(cat "$EVIDENCE_DIR/candidate_safety_foundation.rc")"
            echo "candidate_verified_runtime_rc=$(cat "$EVIDENCE_DIR/candidate_verified_runtime.rc")"
            echo "candidate_architecture_rc=$(cat "$EVIDENCE_DIR/candidate_architecture.rc")"
            echo "frozen_safety_foundation_rc=$(cat "$EVIDENCE_DIR/frozen_safety_foundation.rc")"
            echo '--- candidate safety tail ---'
            tail -n 40 "$EVIDENCE_DIR/candidate_safety_foundation.log"
            echo '--- frozen safety tail ---'
            tail -n 40 "$EVIDENCE_DIR/frozen_safety_foundation.log"
          } | tee "$EVIDENCE_DIR/summary.txt"

      - name: Cleanup and candidate ref verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git worktree remove --force "$BASE_WORKTREE" 2>/dev/null || true
          git fetch --no-tags origin "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")"
          printf '%s\n' "$actual" > "$EVIDENCE_DIR/candidate_ref_after.txt"
          test "$actual" = "$CANDIDATE_SHA"

      - name: Upload safety-hang diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etabs-oapi-layer1-safety-hang-diagnostic
          path: /tmp/etabs-oapi-layer1-safety-hang
          if-no-files-found: warn
          retention-days: 30
