name: ETABS OAPI Layer 1 Stage A Validation

on:
  push:
    branches:
      - validation/etabs-oapi-layer1-stage-a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-1-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: 698dd90e817ceca54fb5c6140959c5ccfe62d347
      FROZEN_BASE_SHA: 74d5b6083afed75e44b832336c31755aee482daa
      CANDIDATE_BRANCH: sprint/etabs-oapi-layer-1-common-factual-boundary
      EVIDENCE_DIR: /tmp/etabs-oapi-layer1-stage-a-diagnostic
      BASE_WORKTREE: /tmp/tbdy-oapi-frozen

    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record workflow source and verify candidate ref before diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/workflow_source_sha.txt"
          printf '%s\n' "$CANDIDATE_SHA" > "$EVIDENCE_DIR/candidate_sha.txt"
          printf '%s\n' "$FROZEN_BASE_SHA" > "$EVIDENCE_DIR/frozen_base_sha.txt"
          git fetch --no-tags origin "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")"
          printf '%s\n' "$actual" > "$EVIDENCE_DIR/candidate_ref_before.txt"
          test "$actual" = "$CANDIDATE_SHA"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: 698dd90e817ceca54fb5c6140959c5ccfe62d347
          fetch-depth: 0
          clean: true

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$FROZEN_BASE_SHA" HEAD)" = "$FROZEN_BASE_SHA"
          git diff --check "$FROZEN_BASE_SHA"...HEAD
          test -z "$(git status --porcelain=v1 -uall)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install accepted validation toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            pyyaml \
            jsonschema \
            weasyprint==69.0 \
            pydyf==0.12.1 \
            pypdf==6.16.1 \
            pypdfium2==5.12.1 \
            openpyxl==3.1.5 \
            et_xmlfile==2.0.0
          python --version > "$EVIDENCE_DIR/python_version.txt"
          python -m pip freeze | sort > "$EVIDENCE_DIR/toolchain.txt"

      - name: Candidate direct vendor verifier
        shell: bash
        run: |
          set -euo pipefail
          find vendor/etabs-mcp -type f -not -path '*/.git/*' -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/vendor_candidate_inventory_pre.txt"
          set +e
          python tools/verify_etabs_mcp_vendor.py \
            --repo-root . \
            --write-report /tmp/vendor-candidate.json \
            > /tmp/vendor-candidate.stdout \
            2> /tmp/vendor-candidate.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/vendor_candidate.rc"
          cp /tmp/vendor-candidate.json "$EVIDENCE_DIR/vendor-candidate.json"
          cp /tmp/vendor-candidate.stdout "$EVIDENCE_DIR/vendor-candidate.stdout"
          cp /tmp/vendor-candidate.stderr "$EVIDENCE_DIR/vendor-candidate.stderr"
          python - <<'PY' | tee "$EVIDENCE_DIR/vendor-candidate-exact.txt"
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/vendor-candidate.json').read_text(encoding='utf-8'))
          c = p.get('checks', {})
          for key, value in (
              ('result', p.get('result')),
              ('errors', p.get('errors')),
              ('missing_files', c.get('missing_files')),
              ('extra_files', c.get('extra_files')),
              ('changed_files', c.get('changed_files')),
              ('forbidden_runtime_references', c.get('forbidden_runtime_references')),
              ('expected_file_count', c.get('expected_file_count')),
              ('actual_file_count', c.get('actual_file_count')),
          ):
              print(f'{key}={json.dumps(value, ensure_ascii=False, sort_keys=True)}')
          PY

      - name: Candidate gateway suite for exact signatures
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q packages/etabs_gateway/tests \
            --junitxml="$EVIDENCE_DIR/candidate_gateway.xml" \
            > "$EVIDENCE_DIR/candidate_gateway.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/candidate_gateway.rc"
          grep -E '^(FAILED|ERROR) |^ERROR collecting ' "$EVIDENCE_DIR/candidate_gateway.log" | sort -u > "$EVIDENCE_DIR/candidate_gateway.sig" || true
          python - <<'PY' | tee "$EVIDENCE_DIR/candidate_gateway_counts.txt"
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/etabs-oapi-layer1-stage-a-diagnostic/candidate_gateway.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          a = suite.attrib
          tests = int(a.get('tests', 0)); failed = int(a.get('failures', 0)); errors = int(a.get('errors', 0)); skipped = int(a.get('skipped', 0))
          print(f'tests={tests}')
          print(f'passed={tests-failed-errors-skipped}')
          print(f'failed={failed}')
          print(f'errors={errors}')
          print(f'skipped={skipped}')
          PY

      - name: Candidate verifier immediately after gateway suite
        shell: bash
        run: |
          set -euo pipefail
          find vendor/etabs-mcp -type f -not -path '*/.git/*' -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/vendor_candidate_inventory_post_gateway.txt"
          set +e
          python tools/verify_etabs_mcp_vendor.py \
            --repo-root . \
            --write-report /tmp/vendor-candidate-post-gateway.json \
            > /tmp/vendor-candidate-post-gateway.stdout \
            2> /tmp/vendor-candidate-post-gateway.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/vendor_candidate_post_gateway.rc"
          cp /tmp/vendor-candidate-post-gateway.json "$EVIDENCE_DIR/vendor-candidate-post-gateway.json"
          cp /tmp/vendor-candidate-post-gateway.stdout "$EVIDENCE_DIR/vendor-candidate-post-gateway.stdout"
          cp /tmp/vendor-candidate-post-gateway.stderr "$EVIDENCE_DIR/vendor-candidate-post-gateway.stderr"

      - name: Frozen-base direct verifier and gateway suite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BASE_WORKTREE"
          git worktree add --detach "$BASE_WORKTREE" "$FROZEN_BASE_SHA"
          cd "$BASE_WORKTREE"
          test "$(git rev-parse HEAD)" = "$FROZEN_BASE_SHA"
          find vendor/etabs-mcp -type f -not -path '*/.git/*' -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/vendor_frozen_inventory_pre.txt"

          set +e
          python tools/verify_etabs_mcp_vendor.py \
            --repo-root . \
            --write-report /tmp/vendor-frozen.json \
            > /tmp/vendor-frozen.stdout \
            2> /tmp/vendor-frozen.stderr
          verifier_rc=$?
          set -e
          printf '%s\n' "$verifier_rc" > "$EVIDENCE_DIR/vendor_frozen.rc"
          cp /tmp/vendor-frozen.json "$EVIDENCE_DIR/vendor-frozen.json"
          cp /tmp/vendor-frozen.stdout "$EVIDENCE_DIR/vendor-frozen.stdout"
          cp /tmp/vendor-frozen.stderr "$EVIDENCE_DIR/vendor-frozen.stderr"
          python - <<'PY' | tee "$EVIDENCE_DIR/vendor-frozen-exact.txt"
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/vendor-frozen.json').read_text(encoding='utf-8'))
          c = p.get('checks', {})
          for key, value in (
              ('result', p.get('result')),
              ('errors', p.get('errors')),
              ('missing_files', c.get('missing_files')),
              ('extra_files', c.get('extra_files')),
              ('changed_files', c.get('changed_files')),
              ('forbidden_runtime_references', c.get('forbidden_runtime_references')),
              ('expected_file_count', c.get('expected_file_count')),
              ('actual_file_count', c.get('actual_file_count')),
          ):
              print(f'{key}={json.dumps(value, ensure_ascii=False, sort_keys=True)}')
          PY

          set +e
          PYTHONPATH="$PWD/packages/etabs_gateway/src:$PWD" \
            python -m pytest -q packages/etabs_gateway/tests \
            --junitxml="$EVIDENCE_DIR/frozen_gateway.xml" \
            > "$EVIDENCE_DIR/frozen_gateway.log" 2>&1
          gateway_rc=$?
          set -e
          printf '%s\n' "$gateway_rc" > "$EVIDENCE_DIR/frozen_gateway.rc"
          grep -E '^(FAILED|ERROR) |^ERROR collecting ' "$EVIDENCE_DIR/frozen_gateway.log" | sort -u > "$EVIDENCE_DIR/frozen_gateway.sig" || true
          python - <<'PY' | tee "$EVIDENCE_DIR/frozen_gateway_counts.txt"
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/etabs-oapi-layer1-stage-a-diagnostic/frozen_gateway.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          a = suite.attrib
          tests = int(a.get('tests', 0)); failed = int(a.get('failures', 0)); errors = int(a.get('errors', 0)); skipped = int(a.get('skipped', 0))
          print(f'tests={tests}')
          print(f'passed={tests-failed-errors-skipped}')
          print(f'failed={failed}')
          print(f'errors={errors}')
          print(f'skipped={skipped}')
          PY

      - name: Classify vendor failures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$EVIDENCE_DIR/vendor_classification.txt"
          import json
          from pathlib import Path
          d = Path('/tmp/etabs-oapi-layer1-stage-a-diagnostic')
          cand = json.loads((d/'vendor-candidate.json').read_text(encoding='utf-8'))
          frozen = json.loads((d/'vendor-frozen.json').read_text(encoding='utf-8'))
          post = json.loads((d/'vendor-candidate-post-gateway.json').read_text(encoding='utf-8'))
          def projection(p):
              c = p.get('checks', {})
              return {
                  'result': p.get('result'),
                  'errors': p.get('errors'),
                  'missing_files': c.get('missing_files'),
                  'extra_files': c.get('extra_files'),
                  'changed_files': c.get('changed_files'),
                  'forbidden_runtime_references': c.get('forbidden_runtime_references'),
                  'expected_file_count': c.get('expected_file_count'),
                  'actual_file_count': c.get('actual_file_count'),
              }
          cp, fp, pp = projection(cand), projection(frozen), projection(post)
          frozen_sig = (d/'frozen_gateway.sig').read_text(encoding='utf-8')
          cand_sig = (d/'candidate_gateway.sig').read_text(encoding='utf-8')
          acceptance_names = (
              'test_repository_offline_acceptance_passes',
              'test_cli_returns_zero_and_writes_canonical_json',
          )
          if cp['result'] == 'FAIL' and fp['result'] == 'FAIL' and cp == fp and all(x in frozen_sig for x in acceptance_names):
              classification = 'INHERITED'
          elif cp['result'] == 'FAIL' and fp['result'] == 'PASS':
              classification = 'CANDIDATE_REGRESSION'
          elif cp['result'] == 'PASS' and fp['result'] == 'PASS' and all(x in cand_sig for x in acceptance_names):
              classification = 'ENVIRONMENT_ORDER_EFFECT'
          else:
              classification = 'UNRESOLVED'
          print('candidate_projection=' + json.dumps(cp, ensure_ascii=False, sort_keys=True))
          print('frozen_projection=' + json.dumps(fp, ensure_ascii=False, sort_keys=True))
          print('candidate_post_gateway_projection=' + json.dumps(pp, ensure_ascii=False, sort_keys=True))
          print('candidate_equals_frozen=' + str(cp == fp))
          print('candidate_pre_equals_post_gateway=' + str(cp == pp))
          print('vendor_classification=' + classification)
          PY
          echo '--- candidate gateway signatures ---' | tee -a "$EVIDENCE_DIR/vendor_classification.txt"
          cat "$EVIDENCE_DIR/candidate_gateway.sig" | tee -a "$EVIDENCE_DIR/vendor_classification.txt"
          echo '--- frozen gateway signatures ---' | tee -a "$EVIDENCE_DIR/vendor_classification.txt"
          cat "$EVIDENCE_DIR/frozen_gateway.sig" | tee -a "$EVIDENCE_DIR/vendor_classification.txt"

      - name: Cleanup and verify candidate ref unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git worktree remove --force "$BASE_WORKTREE" 2>/dev/null || true
          git fetch --no-tags origin "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")"
          printf '%s\n' "$actual" > "$EVIDENCE_DIR/candidate_ref_after.txt"
          test "$actual" = "$CANDIDATE_SHA"

      - name: Upload Phase-1 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etabs-oapi-layer1-stage-a-phase1-diagnostic
          path: /tmp/etabs-oapi-layer1-stage-a-diagnostic
          if-no-files-found: warn
          retention-days: 30
