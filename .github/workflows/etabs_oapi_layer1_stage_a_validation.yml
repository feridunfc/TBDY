name: ETABS OAPI Layer 1 Stage A Validation

on:
  push:
    branches:
      - validation/etabs-oapi-layer1-stage-a
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-bounded-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: 008e9c569d3022a5e9c676cf5ec7a166c0a34f26
      CANDIDATE_BRANCH: sprint/etabs-oapi-layer-1-common-factual-boundary
      EVIDENCE_DIR: /tmp/etabs-oapi-layer1-repair-promotion

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify candidate ref before promotion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/workflow_source_sha.txt"
          git fetch --no-tags origin "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")"
          printf '%s\n' "$actual" > "$EVIDENCE_DIR/candidate_ref_before.txt"
          test "$actual" = "$CANDIDATE_SHA"

      - uses: actions/checkout@v4
        with:
          ref: 008e9c569d3022a5e9c676cf5ec7a166c0a34f26
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema weasyprint==69.0 pydyf==0.12.1 pypdf==6.16.1 pypdfium2==5.12.1 openpyxl==3.1.5 et_xmlfile==2.0.0

      - name: Apply exact preflighted two-file repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          safety = Path('tests/etabs/test_safety_foundation.py')
          text = safety.read_text(encoding='utf-8')
          targets = {
              'test_exact_target_identity_accepted',
              'test_pid_verified_session_records_pid_only_for_exact_process_strategy',
              'test_callable_pid_failure_fallback_requires_explicit_opt_in_and_verifies_target',
              'test_unsupported_pid_api_may_use_bounded_verified_fallback',
              'test_fallback_attach_is_identity_verified',
          }

          def patch_function(source: str, name: str) -> str:
              marker = f'def {name}('
              start = source.index(marker)
              next_start = source.find('\ndef ', start + 1)
              end = len(source) if next_start < 0 else next_start + 1
              block = source[start:end]
              lines = block.splitlines(keepends=True)
              assign = next(i for i, line in enumerate(lines) if line.startswith('    session = attach_verified_to_running_etabs('))
              depth = 0
              call_end = None
              for i in range(assign, len(lines)):
                  depth += lines[i].count('(') - lines[i].count(')')
                  if depth == 0:
                      call_end = i
                      break
              assert call_end is not None, name
              tail = lines[call_end + 1:]
              while tail and not tail[-1].strip():
                  tail.pop()
              assert tail, name
              patched = lines[:call_end + 1]
              patched.append('    try:\n')
              for line in tail:
                  patched.append(('    ' + line) if line.strip() else line)
              patched.append('    finally:\n')
              patched.append('        session.close()\n')
              if end < len(source):
                  patched.append('\n')
              return source[:start] + ''.join(patched) + source[end:]

          for name in sorted(targets):
              text = patch_function(text, name)
          safety.write_text(text, encoding='utf-8')

          arch = Path('tests/etabs/test_oapi_layer1_architecture_guards.py')
          arch_text = arch.read_text(encoding='utf-8')
          needle = 'read_text(encoding="utf-8")'
          replacements = arch_text.count(needle)
          assert replacements == 13, replacements
          arch_text = arch_text.replace(needle, 'read_text(encoding="utf-8-sig")')
          arch.write_text(arch_text, encoding='utf-8')
          PY

          git diff --check
          git status --short | tee "$EVIDENCE_DIR/status_before_commit.txt"
          test "$(git status --short | wc -l)" -eq 2
          git status --short | grep -Fx ' M tests/etabs/test_oapi_layer1_architecture_guards.py'
          git status --short | grep -Fx ' M tests/etabs/test_safety_foundation.py'
          sha256sum tests/etabs/test_safety_foundation.py tests/etabs/test_oapi_layer1_architecture_guards.py | tee "$EVIDENCE_DIR/repaired_file_sha256.txt"
          grep -q '^0cd8929cd7ea8a706d1db2632035d84f7aa1379eeffb9056a0a999988a67bdc8  tests/etabs/test_safety_foundation.py$' "$EVIDENCE_DIR/repaired_file_sha256.txt"
          grep -q '^7707e2c5d62e2c515a1e0466e26b4c1bc9e5266aa295c575b249535888ea31f1  tests/etabs/test_oapi_layer1_architecture_guards.py$' "$EVIDENCE_DIR/repaired_file_sha256.txt"

      - name: Re-run exact preflight gate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m compileall -q tests/etabs
          python -m pytest -q tests/etabs | tee "$EVIDENCE_DIR/tests_etabs.txt"

      - name: Create one bounded repair commit and push candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/etabs/test_safety_foundation.py tests/etabs/test_oapi_layer1_architecture_guards.py
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fx 'tests/etabs/test_oapi_layer1_architecture_guards.py'
          git diff --cached --name-only | grep -Fx 'tests/etabs/test_safety_foundation.py'
          git commit -m 'ETABS-OAPI-LAYER-1: repair Stage-A focused test regressions'
          new_sha="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$CANDIDATE_SHA"
          printf '%s\n' "$new_sha" > "$EVIDENCE_DIR/new_candidate_sha.txt"
          git show --stat --oneline --decorate=short HEAD | tee "$EVIDENCE_DIR/repair_commit.txt"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"

      - name: Verify pushed candidate exact and bounded
        shell: bash
        run: |
          set -euo pipefail
          new_sha="$(cat "$EVIDENCE_DIR/new_candidate_sha.txt")"
          git fetch --no-tags origin "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")"
          printf '%s\n' "$actual" > "$EVIDENCE_DIR/candidate_ref_after.txt"
          test "$actual" = "$new_sha"
          test "$(git rev-parse "$new_sha^")" = "$CANDIDATE_SHA"
          git diff --name-only "$CANDIDATE_SHA".."$new_sha" | tee "$EVIDENCE_DIR/changed_files.txt"
          test "$(git diff --name-only "$CANDIDATE_SHA".."$new_sha" | wc -l)" -eq 2
          git diff --name-only "$CANDIDATE_SHA".."$new_sha" | grep -Fx 'tests/etabs/test_oapi_layer1_architecture_guards.py'
          git diff --name-only "$CANDIDATE_SHA".."$new_sha" | grep -Fx 'tests/etabs/test_safety_foundation.py'

      - name: Upload repair promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etabs-oapi-layer1-repair-promotion
          path: /tmp/etabs-oapi-layer1-repair-promotion
          if-no-files-found: warn
          retention-days: 30
