name: FND-COL-1 Longitudinal Layout Authority Validation

on:
  push:
    branches:
      - sprint/fnd-col-1-longitudinal-layout-authority
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_BASE: 2ae920836649f1bab5c46b5ac38bf05a4353b35b

jobs:
  fnd-col-1-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify frozen base ancestry and initial hygiene
        shell: bash
        run: |
          test "$(git merge-base "$FROZEN_BASE" HEAD)" = "$FROZEN_BASE"
          test "$(git rev-parse "$FROZEN_BASE")" = "$FROZEN_BASE"
          git diff --check "$FROZEN_BASE"...HEAD
          echo "candidate_head=$(git rev-parse HEAD)"
          echo "frozen_base=$FROZEN_BASE"
          git diff --name-only "$FROZEN_BASE"...HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install accepted repository test toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema weasyprint==69.0 pydyf==0.12.1 pypdf==6.16.1 pypdfium2==5.12.1 openpyxl==3.1.5 et_xmlfile==2.0.0

      - name: Compile candidate
        run: python -m compileall -q tbdy_engine tests

      - name: Fresh-interpreter FND-COL-1 import diagnostic
        shell: bash
        run: |
          set +e
          python -c "import tbdy_engine.regulatory.column_longitudinal_rebar" > /tmp/fresh-import.log 2>&1
          first_rc=$?
          python -c "import tbdy_engine.regulatory.sources.fnd_col_1_longitudinal" >> /tmp/fresh-import.log 2>&1
          second_rc=$?
          set -e
          if [ "$first_rc" -ne 0 ] || [ "$second_rc" -ne 0 ]; then
            echo 1 > /tmp/fresh-import-rc
          else
            echo 0 > /tmp/fresh-import-rc
          fi
          cat /tmp/fresh-import.log
          echo "fresh_import_first_rc=$first_rc"
          echo "fresh_import_second_rc=$second_rc"

      - name: Focused FND-COL-1 proofs except known shared import dependency
        run: python -m pytest -q tests/regulatory/test_fnd_col_1_longitudinal_authority.py -k "not fresh_interpreter_import"

      - name: Existing layout and rebar regressions
        run: |
          python -m pytest -q \
            tests/design/columns/test_vs6_rebar_layout.py \
            tests/design/columns/test_vs6_rebar_layout_seed.py \
            tests/design/columns/test_vs6_rebar_catalog.py \
            tests/design/columns/test_vs6_column_rebar_design_engine.py

      - name: F0.9 source-authority regressions
        run: |
          python -m pytest -q \
            tests/regulatory/test_source_authority.py \
            tests/regulatory/test_f0_1_kernel.py

      - name: Broad candidate versus frozen-base delta
        shell: bash
        run: |
          set +e
          python -m pytest -q > /tmp/candidate.log 2>&1
          candidate_rc=$?
          git worktree add --detach /tmp/frozen-base "$FROZEN_BASE"
          (
            cd /tmp/frozen-base
            python -m pytest -q > /tmp/base.log 2>&1
          )
          base_rc=$?
          set -e

          grep -E '^(FAILED|ERROR) |^ERROR collecting ' /tmp/candidate.log | sort -u > /tmp/candidate.sig || true
          grep -E '^(FAILED|ERROR) |^ERROR collecting ' /tmp/base.log | sort -u > /tmp/base.sig || true
          comm -23 /tmp/candidate.sig /tmp/base.sig > /tmp/new.sig || true

          echo "candidate_pytest_exit=$candidate_rc"
          echo "frozen_base_pytest_exit=$base_rc"
          echo "candidate_failure_signatures:"
          cat /tmp/candidate.sig || true
          echo "frozen_base_failure_signatures:"
          cat /tmp/base.sig || true
          echo "new_failure_signatures:"
          cat /tmp/new.sig || true
          echo "candidate_tail:"
          tail -n 30 /tmp/candidate.log || true
          echo "frozen_base_tail:"
          tail -n 30 /tmp/base.log || true

          test ! -s /tmp/new.sig
          if [ "$base_rc" -eq 0 ]; then
            test "$candidate_rc" -eq 0
          fi
          git worktree remove --force /tmp/frozen-base

      - name: Determinism replay
        run: python -m pytest -q tests/regulatory/test_fnd_col_1_longitudinal_authority.py -k deterministic

      - name: Final repository hygiene
        shell: bash
        run: |
          git diff --check "$FROZEN_BASE"...HEAD
          git status --porcelain=v1 -uall
          test -z "$(git status --porcelain=v1 -uall)"

      - name: Final fresh-import dependency gate
        shell: bash
        run: |
          test "$(cat /tmp/fresh-import-rc)" = "0"
