name: B1 Beam Column Canonicalization

on:
  push:
    branches: [sprint/b1-beam-column-canonicalization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b1-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml jsonschema
      - name: Compile
        run: python -m compileall -q tbdy_engine tools tests
      - name: B1 member canonicalization tests
        run: |
          python -m pytest -q tests/member_geometry
      - name: CheckEngine and catalog alignment
        run: python -m pytest -q tests/c13_4_p1/test_engine_catalog_check_id_alignment.py
      - name: Wall Inventory regression
        run: python -m pytest -q tests/wall_inventory/test_wall_inventory_slice_1.py
      - name: Wall Pack A regression
        run: |
          python -m pytest -q tests/wall_geometry/test_wall_check_pack_a.py
          python -m pytest -q tests/wall_geometry/test_wall_pack_a_catalog_contract.py
      - name: Wall Pack B regression
        run: |
          python -m pytest -q tests/wall_geometry/test_wall_check_pack_b.py
          python -m pytest -q tests/wall_geometry/test_wall_pack_b_source_contracts.py
      - name: Wall Pack C regression
        run: |
          python -m pytest -q tests/wall_geometry/test_wall_check_pack_c.py
          python -m pytest -q tests/wall_geometry/test_wall_pack_c_source_contracts.py
      - name: Offline product acceptance
        run: python tools/run_offline_product_acceptance.py --out local_out/b1_offline_acceptance
