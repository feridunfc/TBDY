name: P2.10 Wall Packs Kernel

on:
  push:
    branches:
      - sprint/p2-10-wall-check-pack-b
      - sprint/p2-10-wall-check-pack-c

jobs:
  wall-packs-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml jsonschema
      - name: Run Pack C, Pack B, Pack A and Inventory regressions
        run: |
          python -m pytest -q tests/wall_geometry/test_wall_check_pack_c.py
          python -m pytest -q tests/wall_geometry/test_wall_pack_c_source_contracts.py
          python -m pytest -q tests/wall_geometry/test_wall_check_pack_b.py
          python -m pytest -q tests/wall_geometry/test_wall_pack_b_source_contracts.py
          python -m pytest -q tests/wall_geometry/test_wall_check_pack_a.py
          python -m pytest -q tests/wall_geometry/test_wall_pack_a_catalog_contract.py
          python -m pytest -q tests/wall_inventory/test_wall_inventory_slice_1.py
          python -m pytest -q tests/c13_4_p1/test_engine_catalog_check_id_alignment.py
      - name: Run existing offline regression gate
        shell: bash
        run: |
          set +e
          python tools/run_offline_product_acceptance.py --out local_out/p2_10_pack_c_offline_regression
          rc=$?
          if [ -f local_out/p2_10_pack_c_offline_regression/offline_product_acceptance_report.json ]; then
            cat local_out/p2_10_pack_c_offline_regression/offline_product_acceptance_report.json
          fi
          exit "$rc"
