name: ETABS OAPI Layer 1 Integration Cleanup Repair

on:
  push:
    branches:
      - validation/etabs-oapi-layer1-stage-a
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 8cfe0bb6d1745043ee0e9f17c95ffd5bfd44320a
      CANDIDATE_BRANCH: sprint/etabs-oapi-layer-1-common-factual-boundary
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 -uall)"

      - name: Add test-owned verified-session cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/test_acq_ctx_1_trusted_live_etabs_acquisition_context.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          model_indexes = [i for i, line in enumerate(lines) if line.startswith('MODEL_PATH = ')]
          if len(model_indexes) != 1:
              raise SystemExit(f'MODEL_PATH line count={len(model_indexes)}')
          insert_at = model_indexes[0] + 1
          while insert_at < len(lines) and not lines[insert_at].strip():
              insert_at += 1
          fixture_lines = [
              '\n',
              '_CREATED_VERIFIED_SESSIONS = []\n',
              '\n',
              '\n',
              '@pytest.fixture(autouse=True)\n',
              'def _close_test_owned_verified_sessions():\n',
              '    try:\n',
              '        yield\n',
              '    finally:\n',
              '        while _CREATED_VERIFIED_SESSIONS:\n',
              '            _CREATED_VERIFIED_SESSIONS.pop().close()\n',
              '\n',
              '\n',
          ]
          lines[insert_at:insert_at] = fixture_lines
          text = ''.join(lines)

          anchor = '    return sap, session\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'return anchor count={text.count(anchor)}')
          text = text.replace(
              anchor,
              '    _CREATED_VERIFIED_SESSIONS.append(session)\n' + anchor,
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- tests/integration/test_acq_ctx_1_trusted_live_etabs_acquisition_context.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate cleanup repair
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema
          timeout --signal=TERM --kill-after=5s 30s python -m pytest -q tests/integration/test_acq_ctx_1_trusted_live_etabs_acquisition_context.py
          timeout --signal=TERM --kill-after=5s 30s python -m pytest -q tests/integration/test_etabs_oapi_live_acceptance_infrastructure.py
          timeout --signal=TERM --kill-after=5s 60s python -m pytest -q tests/etabs
          git diff --check

      - name: Commit and fast-forward candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ETABS OAPI validation repair"
          git config user.email "actions@users.noreply.github.com"
          git add tests/integration/test_acq_ctx_1_trusted_live_etabs_acquisition_context.py
          git commit -m "ETABS-OAPI-LAYER-1: close integration session lifecycle"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git push origin "HEAD:${CANDIDATE_BRANCH}"
          echo "new_candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
