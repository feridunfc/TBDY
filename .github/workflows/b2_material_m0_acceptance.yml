name: B2 Material M0 Acceptance

on:
  push:
    branches: [sprint/b2-material-population]

permissions:
  contents: write

# Temporary offline-only branch acceptance; removed before final handoff.
jobs:
  m0-offline-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml jsonschema
      - name: Run offline acceptance and publish temporary report
        shell: bash
        run: |
          set +e
          REPORT=m0_acceptance_report.txt
          : > "$REPORT"
          overall=0
          run_case() {
            label="$1"
            shift
            log="$(mktemp)"
            "$@" >"$log" 2>&1
            rc=$?
            printf '\n===== %s | rc=%s =====\n' "$label" "$rc" >> "$REPORT"
            cat "$log" >> "$REPORT"
            rm -f "$log"
            if [ "$rc" -ne 0 ]; then overall=1; fi
          }
          run_case compile python -m compileall -q tbdy_engine tools tests
          run_case m0 python -m pytest -q tests/material_population/test_m0_used_rc_material_population.py
          run_case wall_inventory python -m pytest -q tests/wall_inventory/test_wall_inventory_slice_1.py
          run_case b1 python -m pytest -q tests/member_geometry
          run_case wall_packs python -m pytest -q tests/wall_geometry
          run_case b2_ndm python -m pytest -q tests/result_selection
          run_case etabs_safety python -m pytest -q tests/etabs/test_safety_foundation.py
          run_case offline_acceptance python tools/run_offline_product_acceptance.py --out local_out/b2_material_m0_offline_acceptance
          printf '\n===== OVERALL | rc=%s =====\n' "$overall" >> "$REPORT"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f "$REPORT"
          git commit -m "B2 material M0 record temporary acceptance result"
          git push origin HEAD:sprint/b2-material-population
          exit "$overall"
