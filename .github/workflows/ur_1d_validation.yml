name: UR-1D Deterministic PDF Export Validation

on:
  push:
    branches:
      - sprint/ur-1d-deterministic-pdf-export
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_BASE: 95cef47473037118566d5bd408c6b2745c03602e

jobs:
  ur-1d-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify frozen base and repository hygiene
        shell: bash
        run: |
          test "$(git merge-base "$FROZEN_BASE" HEAD)" = "$FROZEN_BASE"
          git status --short
          git diff --check "$FROZEN_BASE"...HEAD
          git diff --stat "$FROZEN_BASE"...HEAD
          echo "candidate_head=$(git rev-parse HEAD)"
          echo "frozen_base=$FROZEN_BASE"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic PDF and test toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            pyyaml \
            jsonschema \
            weasyprint==69.0 \
            pydyf==0.12.1 \
            pypdf==6.16.1 \
            pypdfium2==5.12.1
          weasyprint --info
          python - <<'PY'
          from tbdy_engine.product_reports.building_report_pdf import pdf_toolchain_identity
          print("renderer_toolchain=" + pdf_toolchain_identity())
          PY

      - name: Compile candidate
        run: python -m compileall -q tbdy_engine tests

      - name: UR-1D focused acceptance
        run: |
          python -m pytest -q \
            tests/product_reports/test_report_artifact.py \
            tests/product_reports/test_building_report_pdf.py \
            tests/product_reports/test_building_report_html.py \
            tests/product_reports/test_building_report_html_attribute_quoting.py \
            tests/product_reports/test_report_presentation_selection.py \
            tests/product_reports/test_building_report_projection.py \
            tests/product_reports/test_building_report_projection_ui_ready.py \
            tests/product_reports/test_unified_building_report.py \
            tests/product_reports/test_slice_report_contribution.py \
            tests/coverage/test_fcr_1a_project_reconciliation.py

      - name: Deterministic double-render evidence
        run: |
          python -m pytest -q -s \
            tests/product_reports/test_building_report_pdf.py::test_same_inputs_options_toolchain_are_byte_identical

      - name: PDF parse and page-image evidence
        run: |
          python -m pytest -q -s \
            tests/product_reports/test_building_report_pdf.py::test_engineering_projection_creates_valid_pdf_artifact \
            tests/product_reports/test_building_report_pdf.py::test_generated_pdf_renders_to_nonblank_page_image

      - name: Candidate broad regression
        id: candidate_broad
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/design/columns \
            tests/features \
            tests/product_reports \
            > candidate_broad.log 2>&1
          status=$?
          cat candidate_broad.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkout exact frozen-base baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_BASE }}
          path: frozen_base

      - name: Frozen-base broad regression
        id: baseline_broad
        shell: bash
        run: |
          set +e
          cd frozen_base
          python -m pytest -q \
            tests/regulatory \
            tests/coverage \
            tests/design/columns \
            tests/features \
            tests/product_reports \
            > ../baseline_broad.log 2>&1
          status=$?
          cd ..
          cat baseline_broad.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Failure-signature delta gate
        shell: bash
        env:
          CANDIDATE_BROAD_EXIT: ${{ steps.candidate_broad.outputs.exit_code }}
          BASELINE_BROAD_EXIT: ${{ steps.baseline_broad.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          def signatures(path: str) -> set[str]:
              text = Path(path).read_text(encoding="utf-8", errors="replace")
              result: set[str] = set()
              for line in text.splitlines():
                  match = re.match(r"^(?:FAILED|ERROR)\s+([^\s]+)", line)
                  if match:
                      result.add(match.group(1))
              return result

          candidate_exit = int(os.environ["CANDIDATE_BROAD_EXIT"])
          baseline_exit = int(os.environ["BASELINE_BROAD_EXIT"])
          candidate = signatures("candidate_broad.log")
          baseline = signatures("baseline_broad.log")
          new_failures = candidate - baseline
          print(f"candidate_exit={candidate_exit}")
          print(f"baseline_exit={baseline_exit}")
          print(f"candidate_failures={sorted(candidate)}")
          print(f"baseline_failures={sorted(baseline)}")
          print(f"new_failures={sorted(new_failures)}")

          if candidate_exit == 0:
              raise SystemExit(0)
          if not candidate:
              raise SystemExit("candidate exited nonzero without parsed failure signatures")
          if baseline_exit == 0 or new_failures:
              raise SystemExit("UR-1D introduced regression failure signatures")
          PY

      - name: Remove CI-created frozen baseline checkout
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/frozen_base"

      - name: Final repository hygiene
        shell: bash
        run: |
          git diff --check "$FROZEN_BASE"...HEAD
          git status --short
          test -z "$(git status --short)"
