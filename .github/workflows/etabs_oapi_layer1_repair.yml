name: ETABS OAPI Layer 1 Bounded Repair

on:
  push:
    branches:
      - validation/etabs-oapi-layer1-stage-a
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: 008e9c569d3022a5e9c676cf5ec7a166c0a34f26
      CANDIDATE_BRANCH: sprint/etabs-oapi-layer-1-common-factual-boundary
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact repair parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 -uall)"

      - name: Apply bounded validation-proven repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          safety = Path("tests/etabs/test_safety_foundation.py")
          text = safety.read_text(encoding="utf-8")

          replacements = [
              (
                  '''    assert session.identity.model_full_path == r"C:\\\\tmp\\\\B-BLOK_Revised.EDB"\n    assert session.identity.model_locked is True\n    assert session.identity.program_version == "22.7.0"\n''',
                  '''    try:\n        assert session.identity.model_full_path == r"C:\\\\tmp\\\\B-BLOK_Revised.EDB"\n        assert session.identity.model_locked is True\n        assert session.identity.program_version == "22.7.0"\n    finally:\n        session.close()\n''',
              ),
              (
                  '''    assert session.identity.process_id == 77\n    assert session.capabilities.pid_attach is CapabilityState.SUPPORTED\n''',
                  '''    try:\n        assert session.identity.process_id == 77\n        assert session.capabilities.pid_attach is CapabilityState.SUPPORTED\n    finally:\n        session.close()\n''',
              ),
              (
                  '''    assert session.identity.process_id is None\n    assert client.active_calls\n    assert session.diagnostics[0]["code"] == EtabsSafetyErrorCode.PID_ATTACH_FAILED.value\n    assert session.diagnostics[0]["compatibility_opt_in"] is True\n''',
                  '''    try:\n        assert session.identity.process_id is None\n        assert client.active_calls\n        assert session.diagnostics[0]["code"] == EtabsSafetyErrorCode.PID_ATTACH_FAILED.value\n        assert session.diagnostics[0]["compatibility_opt_in"] is True\n    finally:\n        session.close()\n''',
              ),
              (
                  '''    assert session.identity.process_id is None\n    assert session.capabilities.pid_attach is CapabilityState.UNSUPPORTED\n    assert session.diagnostics[0]["code"] == EtabsSafetyErrorCode.PID_ATTACH_UNSUPPORTED.value\n''',
                  '''    try:\n        assert session.identity.process_id is None\n        assert session.capabilities.pid_attach is CapabilityState.UNSUPPORTED\n        assert session.diagnostics[0]["code"] == EtabsSafetyErrorCode.PID_ATTACH_UNSUPPORTED.value\n    finally:\n        session.close()\n''',
              ),
              (
                  '''    assert session.identity.process_id is None\n    assert session.identity.model_full_path.lower().endswith("b-blok_revised.edb")\n''',
                  '''    try:\n        assert session.identity.process_id is None\n        assert session.identity.model_full_path.lower().endswith("b-blok_revised.edb")\n    finally:\n        session.close()\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one safety replacement, found {count}: {old!r}")
              text = text.replace(old, new, 1)
          safety.write_text(text, encoding="utf-8")

          guards = Path("tests/etabs/test_oapi_layer1_architecture_guards.py")
          guard_text = guards.read_text(encoding="utf-8")
          old = 'read_text(encoding="utf-8")'
          count = guard_text.count(old)
          if count < 1:
              raise SystemExit("no architecture source reads found to harden")
          guard_text = guard_text.replace(old, 'read_text(encoding="utf-8-sig")')
          guards.write_text(guard_text, encoding="utf-8")
          print(f"architecture_source_reads_hardened={count}")
          PY
          git diff --check
          git diff -- tests/etabs/test_safety_foundation.py tests/etabs/test_oapi_layer1_architecture_guards.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema

      - name: Validate lifecycle and architecture repairs
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 30s python -m pytest -q tests/etabs/test_safety_foundation.py
          python -m pytest -q tests/etabs/test_oapi_layer1_architecture_guards.py
          python -m pytest -q tests/etabs/test_oapi_layer1_verified_safety_runtime.py
          git diff --check

      - name: Commit and fast-forward candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ETABS OAPI validation repair"
          git config user.email "actions@users.noreply.github.com"
          git add tests/etabs/test_safety_foundation.py tests/etabs/test_oapi_layer1_architecture_guards.py
          git commit -m "ETABS-OAPI-LAYER-1: close Stage-A lifecycle regressions"
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$EXPECTED_HEAD"
          git push origin "HEAD:${CANDIDATE_BRANCH}"
          echo "new_candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
