name: B2 Ndm guarded integration patch

on:
  push:
    branches: [sprint/b2-ndm-result-selection]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/b2-ndm-result-selection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-anchor B2 integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # wall_applicability: current derivation owner becomes the Ndm selector adapter.
          path = 'tbdy_engine/checks/wall_applicability.py'
          text = Path(path).read_text(encoding='utf-8')
          import_anchor = 'from tbdy_engine.features.result_evidence import ResultRowEvidenceBundle\n'
          import_new = '''from tbdy_engine.checks.ndm_selection import (\n    EngineeringQuantityRequest, ReviewedNdmLoadBinding, ReviewedNdmPolicy, select_ndm_demand,\n)\nfrom tbdy_engine.features.result_evidence import ResultRowEvidenceBundle\n'''
          if import_anchor not in text:
              raise SystemExit(f'{path}: import anchor missing')
          text = text.replace(import_anchor, import_new, 1)
          start = text.index('def derive_ndm_n(\n')
          end = text.index('\n\ndef derive_net_section_area_mm2', start)
          old_func = text[start:end]
          new_func = '''def derive_ndm_n(\n    *, component_id: str, pier_name: str | None,\n    pier_forces: ResultRowEvidenceBundle | None,\n    story_name: str | None = None,\n    load_binding: ReviewedNdmLoadBinding | None = None,\n    policy: ReviewedNdmPolicy | None = None,\n    selection_policy: Mapping[str, Any] | None = None,\n) -> DerivedQuantity:\n    \"\"\"Derive Ndm only through the reviewed B2 result-selection authority.\"\"\"\n    if pier_forces is None or pier_forces.table_key != \"pier_forces\":\n        return DerivedQuantity(None, \"BLOCKED\", \"VERIFIED_LIVE Pier Forces raw evidence is unavailable\")\n    if not pier_forces.is_full_capture:\n        return DerivedQuantity(\n            None, \"BLOCKED\",\n            \"Ndm requires runtime FULL Pier Forces acquisition; truncated/sampled/partial evidence cannot be selected\",\n        )\n    if selection_policy is not None and policy is None:\n        return DerivedQuantity(\n            None, \"BLOCKED\",\n            \"Legacy selection_policy mapping is not an implemented ReviewedNdmPolicy authority\",\n        )\n    if not isinstance(story_name, str) or not story_name.strip():\n        return DerivedQuantity(None, \"BLOCKED\", \"Exact wall Story result identity is unavailable for Ndm selection\")\n    if not isinstance(pier_name, str) or not pier_name.strip():\n        return DerivedQuantity(None, \"BLOCKED\", \"Exact wall-to-pier result identity is unavailable for Ndm selection\")\n    try:\n        request = EngineeringQuantityRequest(\n            request_id=f\"Ndm:{component_id}\",\n            component_id=component_id,\n            story=story_name,\n            pier=pier_name,\n        )\n        demand = select_ndm_demand(request, pier_forces, load_binding, policy)\n    except (TypeError, ValueError) as exc:\n        return DerivedQuantity(None, \"BLOCKED\", str(exc))\n    trace_evidence = ({\n        \"selection_trace\": demand.trace.as_dict(),\n        \"provenance\": list(demand.provenance),\n    },)\n    return DerivedQuantity(\n        demand.ndm_n,\n        demand.availability.value,\n        demand.trace.reason,\n        evidence=trace_evidence,\n    )\n'''
          Path(path).write_text(text[:start] + new_func + text[end:], encoding='utf-8')

          # wall_pipeline: carry reviewed authority and materialize Ndm before CheckEngine.
          path = 'tbdy_engine/checks/wall_pipeline.py'
          replace_once(
              path,
              'from tbdy_engine.checks.wall_applicability import ReviewedWallSystemContext, special_branch_context_readiness\n',
              '''from tbdy_engine.checks.ndm_selection import ReviewedNdmLoadBinding, ReviewedNdmPolicy\nfrom tbdy_engine.checks.wall_applicability import (\n    ReviewedWallSystemContext, derive_ndm_n, special_branch_context_readiness,\n)\n''',
          )
          replace_once(
              path,
              '    wall_to_pier: Mapping[str, str] = field(default_factory=dict)\n    net_section_topology_by_component: Mapping[str, Mapping[str, Any]] = field(default_factory=dict)\n',
              '''    wall_to_pier: Mapping[str, str] = field(default_factory=dict)\n    ndm_load_binding: ReviewedNdmLoadBinding | None = None\n    ndm_policy: ReviewedNdmPolicy | None = None\n    net_section_topology_by_component: Mapping[str, Mapping[str, Any]] = field(default_factory=dict)\n''',
          )
          replace_once(
              path,
              '        if self.pack_c_reference_facts is not None and not isinstance(self.pack_c_reference_facts, WallRegulatoryReferenceFacts):\n            raise TypeError("pack_c_reference_facts must be WallRegulatoryReferenceFacts or None")\n',
              '''        if self.pack_c_reference_facts is not None and not isinstance(self.pack_c_reference_facts, WallRegulatoryReferenceFacts):\n            raise TypeError("pack_c_reference_facts must be WallRegulatoryReferenceFacts or None")\n        if self.ndm_load_binding is not None and not isinstance(self.ndm_load_binding, ReviewedNdmLoadBinding):\n            raise TypeError("ndm_load_binding must be ReviewedNdmLoadBinding or None")\n        if self.ndm_policy is not None and not isinstance(self.ndm_policy, ReviewedNdmPolicy):\n            raise TypeError("ndm_policy must be ReviewedNdmPolicy or None")\n''',
          )
          old_ndm = '''        elif name == "ndm_policy_authority":\n            if _known_basement(snapshot):\n                readiness[name] = CoverageExecutionContextReadiness(context_name=name, status=CoverageExecutionContextStatus.READY)\n                continue\n            readiness[name] = CoverageExecutionContextReadiness(\n                context_name=name,\n                status=CoverageExecutionContextStatus.BLOCKED,\n                reason=(\n                    "Authoritative Ndm policy is not implemented: directional selection, response-spectrum, "\n                    "Max/Min, signed-envelope, and governing-location semantics remain unresolved"\n                ),\n            )\n'''
          new_ndm = '''        elif name == "ndm_demand":\n            if _known_basement(snapshot):\n                readiness[name] = CoverageExecutionContextReadiness(context_name=name, status=CoverageExecutionContextStatus.READY)\n                continue\n            bundle = execution_evidence.result_bundles.get("pier_forces")\n            pier = execution_evidence.wall_to_pier.get(component_id)\n            story = snapshot.identity.get("story")\n            demand = derive_ndm_n(\n                component_id=component_id,\n                story_name=None if story is None else str(story),\n                pier_name=None if pier is None else str(pier),\n                pier_forces=bundle,\n                load_binding=execution_evidence.ndm_load_binding,\n                policy=execution_evidence.ndm_policy,\n            )\n            if demand.status == "BLOCKED":\n                readiness[name] = CoverageExecutionContextReadiness(\n                    context_name=name, status=CoverageExecutionContextStatus.BLOCKED,\n                    reason=demand.diagnostic or "Ndm result selection is blocked",\n                )\n            else:\n                # RESOLVED and authoritative NO_DATA are both completed selection outcomes.\n                # The latter is propagated by CheckEngine as NO_DATA rather than guessed BLOCKED.\n                readiness[name] = CoverageExecutionContextReadiness(\n                    context_name=name, status=CoverageExecutionContextStatus.READY\n                )\n                values[name] = demand\n                if demand.evidence:\n                    evidence["ndm_selection_trace"] = demand.evidence[0]\n'''
          replace_once(path, old_ndm, new_ndm)

          # Pack B contract: dependency is now the selected demand, not a placeholder policy flag.
          replace_once(
              'tbdy_engine/catalogs/check_catalog_p2_10_wall_pack_b.yaml',
              'required_execution_context: [pier_forces_result_bundle, wall_to_pier_binding, ndm_policy_authority, net_section_topology]',
              'required_execution_context: [pier_forces_result_bundle, wall_to_pier_binding, ndm_demand, net_section_topology]',
          )

          # CheckEngine consumes the preselected demand and remains sole regulatory verdict owner.
          path = 'tbdy_engine/checks/engine.py'
          replace_once(path, '    derive_highest_applicable_story_height_mm,\n    derive_ndm_n,\n',
                       '    DerivedQuantity,\n    derive_highest_applicable_story_height_mm,\n')
          replace_once(
              path,
              '''            if check_id == WALL_NET_SECTION_AXIAL_CAPACITY:\n                derived = self._derive_axial_inputs(check_input)\n                if isinstance(derived, str):\n                    return self._blocked(check_id, snapshot, coverage, derived, code_ref=code_ref, evidence=evidence_rows)\n                engineering_inputs.update(derived)\n''',
              '''            if check_id == WALL_NET_SECTION_AXIAL_CAPACITY:\n                ndm_context = check_input.execution_context.values.get("ndm_demand")\n                if isinstance(ndm_context, DerivedQuantity):\n                    evidence_rows.extend(ndm_context.evidence)\n                derived = self._derive_axial_inputs(check_input)\n                if isinstance(derived, DerivedQuantity):\n                    if derived.status == "NO_DATA":\n                        return self._no_data(\n                            check_id, snapshot, coverage,\n                            derived.diagnostic or "Ndm factual lookup returned NO_DATA",\n                            code_ref=code_ref,\n                        )\n                    return self._blocked(\n                        check_id, snapshot, coverage,\n                        derived.diagnostic or "Ndm is unresolved",\n                        code_ref=code_ref, evidence=evidence_rows,\n                    )\n                engineering_inputs.update(derived)\n''',
          )
          old_axial = '''    @staticmethod\n    def _derive_axial_inputs(check_input: GeometryCheckInput) -> Mapping[str, float] | str:\n        context = check_input.execution_context\n        pier_bundle = context.evidence.get("pier_forces_result_bundle")\n        if pier_bundle is not None and not isinstance(pier_bundle, ResultRowEvidenceBundle):\n            return "Pier Forces execution evidence is not a canonical ResultRowEvidenceBundle"\n        pier_name = context.values.get("wall_to_pier_binding")\n        ndm = derive_ndm_n(\n            component_id=check_input.component_id,\n            pier_name=None if pier_name is None else str(pier_name),\n            pier_forces=pier_bundle,\n        )\n        if ndm.status != "RESOLVED":\n            return ndm.diagnostic or "Ndm is unresolved"\n        topology = context.values.get("net_section_topology")\n        ac = derive_net_section_area_mm2(check_input.component_id, topology if isinstance(topology, Mapping) else None)\n        if ac.status != "RESOLVED":\n            return ac.diagnostic or "Net Ac is unresolved"\n        return {"Ndm_N": float(ndm.value), "net_section_area_mm2": float(ac.value)}\n'''
          new_axial = '''    @staticmethod\n    def _derive_axial_inputs(check_input: GeometryCheckInput) -> Mapping[str, float] | DerivedQuantity:\n        context = check_input.execution_context\n        ndm = context.values.get("ndm_demand")\n        if not isinstance(ndm, DerivedQuantity):\n            return DerivedQuantity(None, "BLOCKED", "Canonical preselected Ndm demand is unavailable from CheckInput")\n        if ndm.status != "RESOLVED":\n            return ndm\n        topology = context.values.get("net_section_topology")\n        ac = derive_net_section_area_mm2(check_input.component_id, topology if isinstance(topology, Mapping) else None)\n        if ac.status != "RESOLVED":\n            return ac\n        return {"Ndm_N": float(ndm.value), "net_section_area_mm2": float(ac.value)}\n'''
          replace_once(path, old_axial, new_axial)

          # Existing affected regression now names the resolved dependency, not the removed placeholder.
          path = 'tests/wall_geometry/test_wall_check_pack_b.py'
          replace_once(
              path,
              '    assert readiness["ndm_policy_authority"].status == CoverageExecutionContextStatus.BLOCKED\n',
              '    assert readiness["ndm_demand"].status == CoverageExecutionContextStatus.BLOCKED\n',
          )
          replace_once(
              path,
              '    assert "Authoritative Ndm policy is not implemented" in run.check_results[0].messages[0]\n',
              '    assert "Reviewed Ndm load binding is missing" in run.check_results[0].messages[0]\n',
          )

          import compileall
          if not compileall.compile_dir('tbdy_engine', quiet=1):
              raise SystemExit('compileall failed')
          PY
      - name: Commit guarded integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No integration diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tbdy_engine/checks/wall_applicability.py tbdy_engine/checks/wall_pipeline.py tbdy_engine/checks/engine.py tbdy_engine/catalogs/check_catalog_p2_10_wall_pack_b.yaml tests/wall_geometry/test_wall_check_pack_b.py
          git commit -m 'B2 integrate reviewed Ndm demand into Pack B'
          git push origin HEAD:sprint/b2-ndm-result-selection
