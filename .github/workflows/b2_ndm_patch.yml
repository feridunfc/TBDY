name: B2 guarded compatibility diagnostic patch

on:
  push:
    branches: [sprint/b2-ndm-result-selection]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/b2-ndm-result-selection
          fetch-depth: 0
      - name: Patch compatibility wording only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tbdy_engine/checks/wall_applicability.py')
          text = p.read_text(encoding='utf-8')
          old = 'Legacy selection_policy mapping is not an implemented ReviewedNdmPolicy authority'
          new = 'Legacy selection_policy mapping is not implemented as a ReviewedNdmPolicy authority'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one diagnostic anchor, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q tbdy_engine/checks/wall_applicability.py
      - name: Commit source-only compatibility wording
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tbdy_engine/checks/wall_applicability.py
          git commit -m 'B2 preserve legacy blocked diagnostic compatibility'
          git push origin HEAD:sprint/b2-ndm-result-selection
