name: VS4A Temporary Fingerprints

on:
  push:
    branches: [sprint/vs-4a-rc-system-baseline-policy]

permissions:
  contents: write

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compute reviewed evaluator fingerprints
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tbdy_engine.regulatory.authority import implementation_fingerprint
          from tbdy_engine.regulatory.structural_system import VS4A_REGISTRY
          out = {}
          for spec in (*VS4A_REGISTRY.derivations, *VS4A_REGISTRY.checks):
              out[spec.rule_id.value] = implementation_fingerprint(
                  rule_id=spec.rule_id,
                  rule_version=spec.rule_version,
                  evaluator_binding_id=spec.evaluator.binding_id,
                  implementation_modules=("tbdy_engine.regulatory.structural_system",),
              )
          Path("local_out").mkdir(exist_ok=True)
          Path("local_out/vs4a_fingerprints.json").write_text(json.dumps(out, indent=2, sort_keys=True)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local_out/vs4a_fingerprints.json
          git commit -m "VS-4A temporary evaluator fingerprints"
          git push origin HEAD:sprint/vs-4a-rc-system-baseline-policy
