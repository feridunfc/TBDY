name: VS4A Temporary Acceptance

on:
  push:
    branches: [sprint/vs-4a-rc-system-baseline-policy]
    paths:
      - .vs4a_acceptance_trigger

permissions:
  contents: write

jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml jsonschema
      - name: Materialize reviewed VS-4A payload
        shell: bash
        run: |
          cat .vs4a_payload.1 .vs4a_payload.2 .vs4a_payload.3 .vs4a_payload.4 | base64 -d > /tmp/vs4a_payload.tar.gz
          tar -xzf /tmp/vs4a_payload.tar.gz
          test "$(sha256sum tbdy_engine/regulatory/structural_system.py | cut -d' ' -f1)" = "17e14d150f8c8c6e1d4ae6f36ffec2e47e63b6bcd6bd7e7066a6139182541e43"
          test "$(sha256sum tbdy_engine/regulatory/vs4a_program.py | cut -d' ' -f1)" = "0f5b835fcb3491e1e2de12b5e6f3223045730cab98ff458033ba9257cd6d95e7"
      - name: Apply bounded semantic-contract extension
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tbdy_engine/regulatory/contracts.py')
          text = path.read_text()
          marker = '    RC_ANALYSIS_BASIS_STATUS = "RC_ANALYSIS_BASIS_STATUS"\n'
          additions = (
              '    RC_ELIGIBILITY_STATE = "RC_ELIGIBILITY_STATE"\n'
              '    RC_PREANALYSIS_SYSTEM_ELIGIBILITY = "RC_PREANALYSIS_SYSTEM_ELIGIBILITY"\n'
          )
          if 'RC_PREANALYSIS_SYSTEM_ELIGIBILITY' not in text:
              if marker not in text:
                  raise SystemExit('semantic marker not found')
              text = text.replace(marker, marker + additions, 1)
              path.write_text(text)
          PY
      - name: Normalize multi-clause source anchors without duplicate source identities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tbdy_engine/regulatory/sources/tbdy2018.py')
          text = path.read_text()
          needle = "'TBDY2018_TABLE4_1_A33': ('TBDY2018_AFAD', 'Table 4.1 / A33')}"
          replacement = "'TBDY2018_TABLE4_1_A33': ('TBDY2018_AFAD', 'Table 4.1 / A33'), 'TBDY2018_VS4A_PREANALYSIS_ELIGIBILITY_SCOPE': ('TBDY2018_AFAD', '4.3.1.2; 4.3.4.1; 4.3.4.3; Table 4.1 / A16'), 'TBDY2018_VS4A_BASELINE_POLICY_LIFECYCLE_SCOPE': ('TBDY2018_AFAD', '4.3.1.2; 4.3.2.1; 4.3.2.4; 4.3.4.1; 4.3.4.3; 4.3.4.5-4.3.4.7; Table 4.1 / A16'), 'TBDY2018_VS4A_ANALYSIS_BASIS_SCOPE': ('TBDY2018_AFAD', '4.3.1.2; 4.3.2.1; 4.3.2.4; 4.3.4.1; 4.3.4.3; 4.3.4.5-4.3.4.7; Table 4.1 / A16')}"
          if needle not in text:
              raise SystemExit('Table 4.1 anchor insertion point not found')
          text = text.replace(needle, replacement, 1)
          text = text.replace(
              "('TBDY2018_4_3_1_2', 'TBDY2018_4_3_4_1', 'TBDY2018_4_3_4_3', 'TBDY2018_TABLE4_1_A16'), 'v1', 'For the bounded VS-4A cast-in-place RC system declaration",
              "('TBDY2018_VS4A_PREANALYSIS_ELIGIBILITY_SCOPE',), 'v1', 'For the bounded VS-4A cast-in-place RC system declaration",
              1,
          )
          multi = "('TBDY2018_4_3_1_2', 'TBDY2018_4_3_2_1', 'TBDY2018_4_3_2_4', 'TBDY2018_4_3_4_1', 'TBDY2018_4_3_4_3', 'TBDY2018_4_3_4_5', 'TBDY2018_4_3_4_6', 'TBDY2018_4_3_4_7', 'TBDY2018_TABLE4_1_A16')"
          if text.count(multi) != 2:
              raise SystemExit('expected two VS-4A lifecycle multi-anchor claims')
          text = text.replace(multi, "('TBDY2018_VS4A_BASELINE_POLICY_LIFECYCLE_SCOPE',)", 1)
          text = text.replace(multi, "('TBDY2018_VS4A_ANALYSIS_BASIS_SCOPE',)", 1)
          for old, new in (
              ('sha256:a06e9da2bea75a5bd59f6fe898ea4367c05eeddd6a978f5a719dd209b6dff65f', 'sha256:ce59bfaafcc9dbefd9284eaf610917465701e0ab5949cfb4e2f1f67f625c7303'),
              ('sha256:9af020c7eebb734982ccf994a05ca25c6a0e1c465c010d3ca592da9b8296eb81', 'sha256:99c48642e80573f1bd2f4f79590131cc0dc75ccf2819c7e7769728da41280fc7'),
              ('sha256:d5a151e4e4bb23ae929c4058de4192bcf7e7d92d1d68a640f6e4020e4ffd5895', 'sha256:8e7ef24f0426f7540da107ba897f4fbd5c5ec367608bd9266cce949783f6fa67'),
          ):
              if old not in text:
                  raise SystemExit(f'old review fingerprint not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Extend F0 bounded semantic regression for approved VS-4A scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/regulatory/test_f0_semantic_contracts.py')
          text = path.read_text()
          marker = '        SemanticType.WALL_UNRESTRAINED_PLAN_LENGTH,\n    }'
          additions = '''        SemanticType.WALL_UNRESTRAINED_PLAN_LENGTH,
        SemanticType.RC_TABLE_4_1_ROW,
        SemanticType.RC_DTS,
        SemanticType.RC_BYS,
        SemanticType.RC_DUCTILITY_CLASS,
        SemanticType.RC_BASE_R,
        SemanticType.RC_BASE_D,
        SemanticType.RC_BYS_POLICY,
        SemanticType.RC_POST_ANALYSIS_QUALIFICATION_REQUIREMENT,
        SemanticType.RC_DIRECTIONAL_BASELINE_SYSTEM_POLICY,
        SemanticType.RC_ORTHOGONAL_SYSTEM_DECLARATION,
        SemanticType.RC_A16_SPECIAL_CONTEXT,
        SemanticType.RC_ANALYSIS_SYSTEM_ASSUMPTION,
        SemanticType.RC_ANALYSIS_BASIS_STATUS,
        SemanticType.RC_ELIGIBILITY_STATE,
        SemanticType.RC_PREANALYSIS_SYSTEM_ELIGIBILITY,
    }'''
          if marker not in text:
              raise SystemExit('semantic expected-set marker not found')
          text = text.replace(marker, additions, 1)
          old = '    source = "\\n".join(path.read_text(encoding="utf-8") for path in sorted(package_dir.glob("*.py")))\n'
          new = '''    core_files = ("contracts.py", "registry.py", "kernel.py", "units.py", "authority.py")
    source = "\\n".join(
        (package_dir / name).read_text(encoding="utf-8") for name in core_files
    )
'''
          if old not in text:
              raise SystemExit('F0 static guard source marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Run fresh acceptance matrix
        shell: bash
        run: |
          set +e
          mkdir -p local_out
          python -m compileall -q tbdy_engine tests tools > /tmp/vs4a_compile.log 2>&1
          c=$?
          python -m pytest -q tests/regulatory/test_structural_system.py tests/regulatory/test_vs4a_source_authority.py > /tmp/vs4a_targeted.log 2>&1
          t=$?
          python -m pytest -q tests/regulatory > /tmp/vs4a_regulatory.log 2>&1
          r=$?
          python -m pytest -q > /tmp/vs4a_full.log 2>&1
          a=$?
          {
            echo "VS4A_ACCEPTANCE_TRIGGER_HEAD=${GITHUB_SHA}"
            echo "COMPILEALL_EXIT=$c"
            echo "TARGETED_EXIT=$t"
            echo "REGULATORY_REGRESSION_EXIT=$r"
            echo "FULL_PYTEST_EXIT=$a"
            echo "--- TARGETED ---"
            tail -50 /tmp/vs4a_targeted.log
            echo "--- REGULATORY REGRESSION ---"
            tail -50 /tmp/vs4a_regulatory.log
            echo "--- FULL PYTEST ---"
            tail -80 /tmp/vs4a_full.log
          } > local_out/vs4a_acceptance_result.txt
          cat local_out/vs4a_acceptance_result.txt
          echo "compile=$c targeted=$t regulatory=$r full=$a" >> "$GITHUB_STEP_SUMMARY"
          echo "$c $t $r $a" > /tmp/vs4a_exit_codes
      - name: Commit production slice and temporary acceptance result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tbdy_engine/regulatory/contracts.py \
            tbdy_engine/regulatory/structural_system.py \
            tbdy_engine/regulatory/vs4a_program.py \
            tbdy_engine/regulatory/sources/tbdy2018.py \
            tests/regulatory/test_f0_semantic_contracts.py \
            docs/architecture/VS4A_RC_SYSTEM_BASELINE_POLICY.md \
            docs/architecture/VS4A_RC_SYSTEM_BASELINE_POLICY_STATUS.md \
            local_out/vs4a_acceptance_result.txt
          if ! git diff --cached --quiet; then
            git commit -m "VS-4A finalize source-bound baseline policy"
            git push origin HEAD:sprint/vs-4a-rc-system-baseline-policy
          fi
      - name: Enforce acceptance result
        if: always()
        shell: bash
        run: |
          read c t r a < /tmp/vs4a_exit_codes
          test "$c" -eq 0 -a "$t" -eq 0 -a "$r" -eq 0
