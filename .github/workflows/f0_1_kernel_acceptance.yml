name: F0.1 Pure DAG Kernel Acceptance

on:
  push:
    branches:
      - sprint/f0-1-pure-dag-kernel

permissions:
  contents: read

jobs:
  f0-1-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema

      - name: Regulatory tests
        run: python -m pytest -q tests/regulatory

      - name: Compile changed surfaces
        run: python -m compileall -q tbdy_engine/regulatory tests/regulatory

      - name: Offline product acceptance
        run: python tools/run_offline_product_acceptance.py --out local_out/f0_1_ci_offline_acceptance
