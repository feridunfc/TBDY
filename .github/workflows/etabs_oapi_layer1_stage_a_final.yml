name: ETABS OAPI Layer 1 Stage A Final

on:
  push:
    branches:
      - validation/etabs-oapi-layer1-stage-a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-a-final:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: aa43c95587c7e18ff1925ac87e173ab499bee23d
      FROZEN_BASE_SHA: 74d5b6083afed75e44b832336c31755aee482daa
      CANDIDATE_BRANCH: sprint/etabs-oapi-layer-1-common-factual-boundary
      EVIDENCE_DIR: /tmp/oapi-stage-a-final
      BASE_WORKTREE: /tmp/oapi-frozen
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate ref
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          echo "$GITHUB_SHA" > "$EVIDENCE_DIR/workflow_source_sha.txt"
          git fetch --no-tags origin "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")"
          echo "$actual" > "$EVIDENCE_DIR/candidate_ref_before.txt"
          test "$actual" = "$CANDIDATE_SHA"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: aa43c95587c7e18ff1925ac87e173ab499bee23d
          fetch-depth: 0
          clean: true

      - name: Exactness and initial hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$FROZEN_BASE_SHA" HEAD)" = "$FROZEN_BASE_SHA"
          git diff --check "$FROZEN_BASE_SHA"...HEAD
          test -z "$(git status --porcelain=v1 -uall)"
          printf 'candidate=%s\nfrozen=%s\nmerge_base=%s\n' "$CANDIDATE_SHA" "$FROZEN_BASE_SHA" "$(git merge-base "$FROZEN_BASE_SHA" HEAD)" > "$EVIDENCE_DIR/exactness.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema weasyprint==69.0 pydyf==0.12.1 pypdf==6.16.1 pypdfium2==5.12.1 openpyxl==3.1.5 et_xmlfile==2.0.0
          python --version > "$EVIDENCE_DIR/python_version.txt"
          python -m pip freeze | sort > "$EVIDENCE_DIR/toolchain.txt"

      - name: Compile and import smoke
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m compileall -q tbdy_engine tests packages/etabs_gateway
          python - <<'PY' | tee "$EVIDENCE_DIR/import_smoke.txt"
          import etabs_gateway
          import tbdy_engine.etabs.safety
          import tbdy_engine.etabs.oapi
          import tbdy_engine.integration.live_etabs_acquisition_context
          print('imports=PASS')
          PY

      - name: Gateway exact focused delta
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 300s python -m pytest -q packages/etabs_gateway/tests > "$EVIDENCE_DIR/gateway_candidate.log" 2>&1
          crc=$?
          set -e
          test "$crc" -ne 124
          echo "$crc" > "$EVIDENCE_DIR/gateway_candidate.rc"
          grep -E '^(FAILED|ERROR) |^ERROR collecting ' "$EVIDENCE_DIR/gateway_candidate.log" | sort -u > "$EVIDENCE_DIR/gateway_candidate.sig" || true
          rm -rf "$BASE_WORKTREE"
          git worktree add --detach "$BASE_WORKTREE" "$FROZEN_BASE_SHA"
          set +e
          (cd "$BASE_WORKTREE" && PYTHONPATH="$BASE_WORKTREE/packages/etabs_gateway/src:$BASE_WORKTREE" timeout --signal=TERM --kill-after=10s 300s python -m pytest -q packages/etabs_gateway/tests > "$EVIDENCE_DIR/gateway_frozen.log" 2>&1)
          frc=$?
          set -e
          test "$frc" -ne 124
          echo "$frc" > "$EVIDENCE_DIR/gateway_frozen.rc"
          grep -E '^(FAILED|ERROR) |^ERROR collecting ' "$EVIDENCE_DIR/gateway_frozen.log" | sort -u > "$EVIDENCE_DIR/gateway_frozen.sig" || true
          comm -13 "$EVIDENCE_DIR/gateway_frozen.sig" "$EVIDENCE_DIR/gateway_candidate.sig" > "$EVIDENCE_DIR/gateway_new.sig"
          comm -23 "$EVIDENCE_DIR/gateway_frozen.sig" "$EVIDENCE_DIR/gateway_candidate.sig" > "$EVIDENCE_DIR/gateway_missing.sig"
          test ! -s "$EVIDENCE_DIR/gateway_new.sig"
          test ! -s "$EVIDENCE_DIR/gateway_missing.sig"
          git worktree remove --force "$BASE_WORKTREE"
          printf 'candidate_rc=%s\nfrozen_rc=%s\n' "$crc" "$frc" > "$EVIDENCE_DIR/gateway_delta.txt"

      - name: Focused ETABS safety OAPI architecture
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s python -m pytest -q tests/etabs | tee "$EVIDENCE_DIR/focused_etabs.log"

      - name: Focused acquisition and live-infrastructure offline
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s python -m pytest -q \
            tests/integration/test_acq_ctx_1_trusted_live_etabs_acquisition_context.py \
            tests/integration/test_etabs_oapi_live_acceptance_infrastructure.py | tee "$EVIDENCE_DIR/focused_integration.log"

      - name: Migrated provider consumer regressions
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$EVIDENCE_DIR/migrated_paths.txt"
          from pathlib import Path
          tokens=(
            'tbdy_engine.etabs.oapi',
            'etabs_column_endpoint_restraint_provider',
            'etabs_column_rebar_intent_provider',
            'etabs_combo_definition_provider',
            'etabs_static_linear_case_provider',
            'etabs_load_pattern_catalog_provider',
            'etabs_concrete_column_design_result_provider',
            'etabs_concrete_design_section_provider',
            'etabs_strict_column_topology_provider',
            'etabs_concrete_design_combo_selection_probe',
          )
          found=[]
          for p in Path('tests').rglob('test_*.py'):
              text=p.read_text(encoding='utf-8-sig', errors='replace')
              if any(t in text for t in tokens): found.append(p.as_posix())
          print('\n'.join(sorted(set(found))))
          PY
          mapfile -t paths < "$EVIDENCE_DIR/migrated_paths.txt"
          test ${#paths[@]} -gt 0
          timeout --signal=TERM --kill-after=10s 600s python -m pytest -q "${paths[@]}" | tee "$EVIDENCE_DIR/focused_migrated.log"

      - name: Architecture guards and census
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pytest -q tests/etabs/test_oapi_layer1_architecture_guards.py
          python - <<'PY' | tee "$EVIDENCE_DIR/census.txt"
          import ast, runpy
          from pathlib import Path
          ns=runpy.run_path('tests/etabs/test_oapi_layer1_architecture_guards.py')
          files=ns['_production_python_files'](); rel=ns['_relative']
          attach=sorted(rel(p) for p in files if ns['_looks_like_etabs_attach_implementation'](p))
          execution=ns['_production_call_sites']({'RunAnalysis','StartDesign'})
          units=ns['_production_call_sites']({'SetPresentUnits','SetPresentUnits_2'})
          print('ATTACH_IMPLEMENTATION_COUNT_BEFORE=3')
          print(f'ATTACH_IMPLEMENTATION_COUNT_AFTER={len(attach)}')
          print('ATTACH_IMPLEMENTATIONS_AFTER='+';'.join(attach))
          print(f'RUN_ANALYSIS_START_DESIGN_CALLS_AFTER={len(execution)}')
          print(f'SET_PRESENT_UNITS_CALLS_AFTER={len(units)}')
          print('SET_PRESENT_UNITS_FILES_AFTER='+';'.join(sorted({p for p,_ in units})))
          legacy=Path('tbdy_engine/etabs/_safety_legacy.py')
          tree=ast.parse(legacy.read_text(encoding='utf-8-sig'), filename=str(legacy))
          classes={n.name for n in tree.body if isinstance(n,ast.ClassDef)}
          funcs={n.name for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          print('LEGACY_VERIFIED_SESSION_OWNER_COUNT='+str(int('EtabsVerifiedSession' in classes)))
          print('LEGACY_ATTACH_FUNCTION_COUNT_IN_SAFETY_IMPLEMENTATION='+str(int('attach_verified_to_running_etabs' in funcs)))
          providers=[]
          csi={'GetRestraint','GetRebarColumn','GetCaseList','GetTypeCombo','GetLoadType','GetLoads','GetNameList','GetSummaryResultsColumn','GetDesignSection','GetTypeOAPI_1'}
          for p in Path('tbdy_engine/providers').glob('etabs_*.py'):
              t=ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p))
              calls={ns['_dotted_name'](n.func).rsplit('.',1)[-1] for n in ast.walk(t) if isinstance(n,ast.Call)}
              if calls & csi: providers.append(p.as_posix())
          print('PROVIDER_LOCAL_ABI_OWNER_COUNT_BEFORE=7')
          print(f'PROVIDER_LOCAL_ABI_OWNER_COUNT_AFTER={len(providers)}')
          print('PROVIDER_LOCAL_ABI_OWNERS_AFTER='+';'.join(sorted(providers)))
          ctx=Path('tbdy_engine/integration/live_etabs_acquisition_context.py')
          ct=ast.parse(ctx.read_text(encoding='utf-8-sig'), filename=str(ctx))
          names={n.name for n in ast.walk(ct) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and not n.name.startswith('_')}
          attrs={n.attr for n in ast.walk(ct) if isinstance(n,ast.Attribute)}
          escapes={'sap_model','attach_result','etabs_object','application','model_api'} & (names|attrs)
          print(f'SUPPORTED_PRODUCT_RAW_SAPMODEL_REACHABILITY_AFTER={len(escapes)}')
          PY

      - name: Candidate broad
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/etabs_gateway/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=30s 1800s python -m pytest -q > "$EVIDENCE_DIR/candidate_broad.log" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 124
          echo "$rc" > "$EVIDENCE_DIR/candidate.rc"
          grep -E '^(FAILED|ERROR) |^ERROR collecting ' "$EVIDENCE_DIR/candidate_broad.log" | sort -u > "$EVIDENCE_DIR/candidate.sig" || true

      - name: Frozen broad
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BASE_WORKTREE"
          git worktree add --detach "$BASE_WORKTREE" "$FROZEN_BASE_SHA"
          set +e
          (cd "$BASE_WORKTREE" && PYTHONPATH="$BASE_WORKTREE/packages/etabs_gateway/src:$BASE_WORKTREE" timeout --signal=TERM --kill-after=30s 1800s python -m pytest -q > "$EVIDENCE_DIR/frozen_broad.log" 2>&1)
          rc=$?
          set -e
          test "$rc" -ne 124
          echo "$rc" > "$EVIDENCE_DIR/frozen.rc"
          grep -E '^(FAILED|ERROR) |^ERROR collecting ' "$EVIDENCE_DIR/frozen_broad.log" | sort -u > "$EVIDENCE_DIR/frozen.sig" || true

      - name: Exact broad delta and final hygiene
        shell: bash
        run: |
          set -euo pipefail
          comm -13 "$EVIDENCE_DIR/frozen.sig" "$EVIDENCE_DIR/candidate.sig" > "$EVIDENCE_DIR/new_failure_signatures.txt"
          comm -23 "$EVIDENCE_DIR/frozen.sig" "$EVIDENCE_DIR/candidate.sig" > "$EVIDENCE_DIR/missing_inherited_signatures.txt"
          test ! -s "$EVIDENCE_DIR/new_failure_signatures.txt"
          test ! -s "$EVIDENCE_DIR/missing_inherited_signatures.txt"
          git worktree remove --force "$BASE_WORKTREE"
          git diff --check "$FROZEN_BASE_SHA"..."$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 -uall)"
          git fetch --no-tags origin "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")"
          test "$actual" = "$CANDIDATE_SHA"
          {
            echo 'STATE=STAGE_A_OFFLINE_GREEN_READY_FOR_MAIN_INTEGRATION'
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "candidate_broad_rc=$(cat "$EVIDENCE_DIR/candidate.rc")"
            echo "frozen_broad_rc=$(cat "$EVIDENCE_DIR/frozen.rc")"
            echo 'new_failure_signatures=0'
            echo 'missing_inherited_signatures=0'
            echo 'hygiene=PASS'
          } | tee "$EVIDENCE_DIR/stage_a_summary.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etabs-oapi-layer1-stage-a-final-evidence
          path: /tmp/oapi-stage-a-final
          retention-days: 30
