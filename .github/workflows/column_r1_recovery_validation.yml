name: COLUMN-R1 Recovery Validation

on:
  push:
    branches:
      - sprint/column-r1-a-live-fnd2-closure
      - sprint/column-r1-join
      - sprint/column-r1-final-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema openpyxl et_xmlfile

      - name: Compile
        run: python -m compileall -q tbdy_engine tests

      - name: A3 authority focused
        run: python -m pytest -q tests/analysis_basis/test_eq713_uncracked_analysis_state.py

      - name: A3 factual OAPI focused
        run: python -m pytest -q tests/etabs/test_oapi_area_contributors.py

      - name: A3 Area provider focused
        run: python -m pytest -q tests/providers/test_etabs_area_contributor_provider.py
