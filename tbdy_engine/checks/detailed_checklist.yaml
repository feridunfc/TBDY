# =============================================================================
# tbdy_engine/checks/detailed_checklist.yaml
# TBDY 2018 HIGH-DUCTILITY DETAILED CHECKLIST (FULL)
# =============================================================================
# Purpose: Detailed checklist / future implementation backlog.
# Uses English technical terminology for code/check IDs.
# Keeps Turkish explanatory titles only where useful for report/UI reference.
# This is not a runtime check module yet.
# =============================================================================
# Canonical combo families:
#   GRAV_SERVICE, GRAV_STRENGTH, TEMP_POS, TEMP_NEG
#   DISP_*, DUCTILE_*, CAPACITY_*, SOIL_STRENGTH, SOIL_UPLIFT
# Important usage rule:
#   DISP_* = displacement/drift reading only
#   DUCTILE_* = ductile member strength/flexure/axial design
#   CAPACITY_* = capacity shear/diaphragm/foundation force design
#   SOIL_* = soil/foundation bearing/uplift checks
# =============================================================================

metadata:
  checklist_id: TBDY_HIGH_DUCTILITY_DETAILED_CHECKLIST_V1
  compatible_combo_contract: TBDY_COMBO_CONTRACT_V2_CANONICAL_ENGLISH
  compatible_check_contract: TBDY_CHECK_CONTRACT_V1_CANONICAL_ENGLISH
  code_basis:
    - TBDY 2018
    - TS500
    - Project canonical combo constitution
  language_policy:
    check_id: English
    canonical_name: English
    code_terms: English
    report_label_tr: Turkish labels allowed for display only
  combo_definitions:
    G: DL + SDL + WDL
    Q: LL + DDL
    EDH1: RSX + 0.3*RSY
    EDH2: RSY + 0.3*RSX
    EDZ: vertical seismic effect
    H: soil / lateral earth pressure
    HE: seismic soil increment
  implementation_policy:
    no_data: return NO_DATA, do not crash
    proxy_screening: WARNING only until independent formula is implemented
    design_summary_ratio: FAIL if explicit ETABS ratio/status fails
    final_format: defer until check coverage stabilizes

sections:

  # =========================================================================
  # MATERIAL AND GENERAL HIGH-DUCTILITY CONTROLS
  # =========================================================================
  - section_id: MAT
    title_en: Material and general high-ductility controls
    title_tr: Malzeme ve genel kontroller
    category: MATERIAL
    checks:
      - item_no: "1.1"
        check_id: MAT01_CONCRETE_CLASS_MIN_C25
        canonical_check_name: concrete_class_minimum_screen
        current_status: PLANNED
        engineering_level: VERIFICATION
        control_name_en: Concrete class minimum C25
        control_name_tr: Beton sınıfı ≥ C25
        tbdy_ref: TBDY §7.2.2
        required: [ctx.design_basis.fck_mpa, ctx.design_basis.concrete_class]
        optional: [core_table:material_concrete]
        preferred_evidence:
          combos: [GRAV_STRENGTH, DUCTILE_X, DUCTILE_Y]
        acceptance: "fck_mpa >= 25, concrete class verified from ETABS/user source"
        report_outputs: [material_strength_screen]
        notes: High-ductility minimum concrete class requirement.

      - item_no: "1.2"
        check_id: MAT02_REBAR_CLASS_DUCTILE
        canonical_check_name: rebar_class_ductility_screen
        current_status: PLANNED
        engineering_level: VERIFICATION
        control_name_en: Rebar class B420C or B500C
        control_name_tr: Donatı çeliği B420C veya B500C
        tbdy_ref: TBDY §7.2.3
        required: [ctx.design_basis.rebar_class, ctx.design_basis.fyk_mpa]
        optional: [core_table:material_rebar, core_table:column_rebar_defs, core_table:beam_rebar_defs]
        preferred_evidence:
          combos: [GRAV_STRENGTH, DUCTILE_X, DUCTILE_Y]
        acceptance: "rebar_class in [B420C, B500C], fyk/fyd consistent with selected class"
        report_outputs: [rebar_material_screen]
        notes: Only ductile reinforcement classes accepted for high-ductility system.

      - item_no: "1.3"
        check_id: MAT03_TIE_DIAMETER_MIN_8MM
        canonical_check_name: tie_diameter_minimum_screen
        current_status: PLANNED
        engineering_level: DETAIL_LEVEL
        control_name_en: Tie/stirrup diameter minimum 8 mm
        control_name_tr: Etriye çapı ≥ 8 mm
        tbdy_ref: TBDY §7.2.4
        required: [core_table:column_rebar_defs, core_table:beam_rebar_defs]
        optional: [core_table:wall_rebar_defs]
        preferred_evidence:
          combos: [DUCTILE_X, DUCTILE_Y, CAPACITY_X, CAPACITY_Y]
        acceptance: "transverse_rebar_diameter_mm >= 8, hook detail 135 degree"
        report_outputs: [tie_diameter_minimum_screen]
        notes: Hook detail may need drawing/detailing data; otherwise WARNING/NO_DATA.

      - item_no: "1.4"
        check_id: MAT04_LONGITUDINAL_BAR_DIAMETER_MIN_12MM
        canonical_check_name: longitudinal_bar_diameter_minimum_screen
        current_status: PLANNED
        engineering_level: DETAIL_LEVEL
        control_name_en: Longitudinal bar diameter minimum 12 mm for columns/walls
        control_name_tr: Boyuna donatı çapı ≥ 12 mm (kolon/perde)
        tbdy_ref: TBDY §7.2.4
        required: [core_table:column_rebar_defs, core_table:wall_rebar_defs]
