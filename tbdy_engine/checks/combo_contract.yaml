description: "X Kalkma Kapasite"
section_type: CRACKED
capacity_factor: 2.5
etabs_aliases:
- "COMB_K_E1_U"

K_E2_U:
group: CAPACITY
formula: "0.9G + 2.5×EDH2 - 0.3EDZ"
description: "Y Kalkma Kapasite"
section_type: CRACKED
capacity_factor: 2.5
etabs_aliases:
- "COMB_K_E2_U"

K_E1_US:
group: CAPACITY
formula: "0.9G + H + HE + 2.5×EDH1 - 0.3EDZ"
description: "X + Zemin Kalkma Kapasite"
section_type: CRACKED
capacity_factor: 2.5
