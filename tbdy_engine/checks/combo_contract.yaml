# ---------------------------------------------------------------------------
# ZEMİN / RADYE TEMEL
# ---------------------------------------------------------------------------
Z_ULT:
group: FOUNDATION
formula: "1.4G + 1.6Q + 1.6H"
description: "Zemin Tasarım"
section_type: GROSS
etabs_aliases:
- "COMB_Z_ULT"
- "Z_ULT"

Z_UP:
group: FOUNDATION
formula: "0.9G + 1.6H"
description: "Zemin Kalkma"
section_type: GROSS
etabs_aliases:
- "COMB_Z_UP"
- "Z_UP"

# =============================================================================
# SECTION TYPES
# =============================================================================
section_types:
GROSS:
name: "Brüt Kesit"
stiffness_factor: 1.0
description: "Çatlamamış kesit rijitliği"
CRACKED:
name: "Çatlamış Kesit"
stiffness_factor: 0.5
description: "TBDY §7.3 / §7.4 / §7.6 etkili kesit rijitliği"

# =============================================================================
# KISALTMA ANAHTARI
# =============================================================================
abbreviations:
S: "Sehim kontrolü"
D: "Donatı hesabı"
N: "Eksenel kuvvet"
M: "Eğilme momenti"
UB: "Uç bölgesi (Boundary Zone)"
min_N: "Minimum eksenel kontrol"
EĞILME: "Eğilme donatısı"
KESME: "Kesme donatısı (Kapasite tasarımı)"
DİYAFRAM: "Döşeme düzlem içi kuvvetler"
BODRUM: "Sadece bodrum kat elemanları"
ÇEKME: "Çekme kontrolü (Net kalkma)"
ZIMBALAMA: "Radye zımbalama kontrolü"