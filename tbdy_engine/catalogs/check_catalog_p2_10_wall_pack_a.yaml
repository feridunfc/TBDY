      - wall_both_ends_laterally_restrained
      - wall_is_basement
    optional_features: []
    formula_ref: TBDY_7_6_1_2_C_BW_GE_MAX_H20_250MM
    pass_rule: {ratio_type: actual_over_minimum, ok_if: '>= 1.0'}
    status_logic:
      OK: applicable restrained wall leg satisfies max(h/20,250 mm)
      FAIL: applicable restrained wall leg is below governing minimum
      BLOCKED: mandatory restraint topology or geometry fact unresolved
      OUT_OF_SCOPE: basement or resolved both-ends restraint is false
    evaluation_level_policy:
      DESIGN_LEVEL: Formal rule evaluated from resolved canonical facts.
      NO_DATA: Required fact unavailable or applicability unresolved.
