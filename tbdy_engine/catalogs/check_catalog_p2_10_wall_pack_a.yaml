      - story_height_mm
      - wall_body_classification
      - wall_is_basement
    optional_features: []
    formula_ref: TBDY_7_6_1_2_A_BW_GE_H16
    pass_rule: {ratio_type: actual_over_minimum, ok_if: '>= 1.0'}
    status_logic:
      BLOCKED: §7.6.1.3 applicability is not yet derivable from canonical factual inputs
      OUT_OF_SCOPE: basement or non-body classification
    evaluation_level_policy:
      DESIGN_LEVEL: Formula is reserved for formal evaluation after applicability is derived.
      NO_DATA: Applicability branch unresolved.
    output: {value: wall_thickness_mm, limit: story_height_mm_div_16, ratio: actual_over_minimum, unit: mm}
    evidence_policy:
