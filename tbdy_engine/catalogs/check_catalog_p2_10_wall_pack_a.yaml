  WALL_GEOM_UNRESTRAINED_THICKNESS_GE_L30:
    title: Unrestrained wall or leg thickness >= unrestrained plan length / 30
    element_type: wall
    category: GEOMETRY
    readiness: {status: ready, reason: Frozen Pack A formal wall geometry rule.}
    required_features:
      - wall_thickness_mm
      - unrestrained_plan_length_mm
      - wall_geometry_classification
      - wall_is_basement
    optional_features: []
    formula_ref: TBDY_7_6_1_2_B_BW_GE_L_UNRESTRAINED_DIV30
    pass_rule: {ratio_type: actual_over_minimum, ok_if: '>= 1.0'}
    status_logic:
      OK: applicable wall or leg thickness satisfies l_unrestrained/30 minimum
      FAIL: applicable wall or leg thickness is below l_unrestrained/30 minimum
      BLOCKED: applicable unrestrained length or mandatory topology fact unresolved
      OUT_OF_SCOPE: basement or resolved geometry classification outside rectangular wall/wall leg
    evaluation_level_policy:
