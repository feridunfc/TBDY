metadata:
  contract: P2.10 Wall Check Pack A
  catalog_name: check_catalog_p2_10_wall_pack_a
  status: formal_geometry_overlay
  code_basis:
    - TBDY 2018 §7.6.1
    - TBDY 2018 §7.6.1.2
  legacy_non_executable_aliases:
    WALL11_LENGTH_TO_THICKNESS_GE7: WALL_GEOM_DEFINITION_LW_BW_GE6
  notes:
    - WALL11_LENGTH_TO_THICKNESS_GE7 is historical metadata only and is never executable.
    - Official wall-definition threshold is lw/bw >= 6.
    - §7.6.1.3 eligibility is an engineering applicability decision and is not stored as a FeatureSnapshot fact.
checks:
  WALL_GEOM_DEFINITION_LW_BW_GE6:
    title: Wall definition lw/bw >= 6
    element_type: wall
    category: GEOMETRY
    readiness:
      status: ready
      reason: Frozen Pack A formal wall geometry rule.
    required_features:
      - wall_length_mm
      - wall_thickness_mm
      - wall_is_basement
    optional_features: []
    formula_ref: TBDY_7_6_1_2_LW_OVER_BW_GE6
    pass_rule: {ratio_type: actual_over_minimum, ok_if: '>= 1.0'}
    status_logic:
      OK: resolved applicable wall has lw/bw >= 6
      FAIL: resolved applicable wall has lw/bw < 6
      BLOCKED: one or more mandatory canonical facts are unresolved
      OUT_OF_SCOPE: resolved wall_is_basement is true
    evaluation_level_policy:
      DESIGN_LEVEL: Formal rule evaluated from resolved canonical geometry facts.
      NO_DATA: Required fact unavailable or applicability unresolved.
    output: {value: lw_over_bw, limit: 6.0, ratio: actual_over_minimum, unit: ''}
    evidence_policy:
      include_features: [wall_length_mm, wall_thickness_mm, wall_is_basement]
      include_formula: false
      include_source_refs: true
    tbdy_ref: TBDY 2018 §7.6.1.2 first sentence
    code_ref: TBDY 2018 §7.6.1.2 first sentence

  WALL_GEOM_BODY_THICKNESS_GE_H16:
