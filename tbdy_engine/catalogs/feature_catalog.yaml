metadata:
  contract: Contract Constitution
  version: '1.0'
  sprint: C1_CONTRACT_HARDENING
  status: hardened_contract
  owner: TBDY Engine
  catalog_name: feature_catalog
  notes:
  - Contract-only. No engine/check/ETABS runtime implementation.
  - Production source of truth is live ETABS tables; Excel is fixture/debug/regression
    only.
  - 'Rebar semantics: ETABS_REQUIRED + TBDY_MIN -> GOVERNING_REQUIRED -> ENGINE_SELECTED;
    USER_PROVIDED is explicit only.'
rebar_semantics:
  forbidden_central_terms:
  - VERIFIED_PROVIDED_REBAR
  - AS_BUILT_REBAR
  canonical_flow:
  - ETABS_REQUIRED_REBAR
  - TBDY_MIN_REQUIRED_REBAR
  - GOVERNING_REQUIRED_REBAR
  - ENGINE_SELECTED_REBAR
  - DESIGN_SELECTION
  - USER_PROVIDED_REBAR
  - FINAL_DETAILING_REQUIRED
  rule: ETABS required output is never final selected/detailing reinforcement. USER_PROVIDED_REBAR
    is explicit manual input only.
forbidden_feature_name_terms:
- ratio
- status
- pass
- fail
- ok
