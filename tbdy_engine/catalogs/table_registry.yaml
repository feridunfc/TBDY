  catalog_name: table_registry
  source_basis: C13.2-P1_VERIFIED_LIVE_only
  safe_to_implement_checks_now: false
  notes:
  - Contract-only. No engine/check/ETABS runtime implementation.
  - Production source of truth is live ETABS tables; Excel is inventory/alias/probe
    planning evidence only.
  - This registry promotes only human-reviewed C13.2-P1 live-verified source families.
  - C13.2-P2 preserves legacy table keys as compatibility aliases; canonical new keys
    remain additive.
