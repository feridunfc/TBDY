metadata:
  contract: Contract Constitution
  version: '1.0'
  sprint: C1_CONTRACT_HARDENING
  status: hardened_contract
  owner: TBDY Engine
  catalog_name: table_registry
  notes:
  - Contract-only. No engine/check/ETABS runtime implementation.
  - Production source of truth is live ETABS tables; Excel is fixture/debug/regression
    only.
  - 'Rebar semantics: ETABS_REQUIRED + TBDY_MIN -> GOVERNING_REQUIRED -> ENGINE_SELECTED;
    USER_PROVIDED is explicit only.'
providers:
  primary: ETABS_LIVE_PROVIDER
  secondary_allowed:
  - EXCEL_FIXTURE_PROVIDER
  - FAKE_ETABS_TABLE_CLIENT
  excel_role: fixture_debug_regression_only
unit_policy:
  canonical:
    length: mm
    force: kN
    moment: kNm
    stress: MPa
    area: mm2
    ratio: ''
    period: s
  source_units_required: true
  missing_units_behavior: requires_preflight_diagnostic
tables:
