metadata:
  contract: P2.10 Wall Check Pack B
  catalog_name: check_catalog_p2_10_wall_pack_b
  status: formal_wall_overlay
  code_basis:
    - TBDY 2018 §7.6.1.1
    - TBDY 2018 §7.6.1.3
  notes:
    - General §7.6.1.2(a) checks remain defined by Pack A and use the same system-level applicability authority.
    - Vt, Ndm, net Ac, Eq.7.14 applicability, ΣAg and ΣAp are not raw VERIFIED_LIVE FeatureSnapshot facts.
checks:
  WALL_GEOM_SPECIAL_THICKNESS_GE_HMAX20:
    title: Special-branch wall thickness >= highest applicable story height / 20
    element_type: wall
    category: GEOMETRY
    readiness: {status: partial, reason: Formal rule executable only after system-level §7.6.1.3 applicability and highest applicable story height are proven.}
    required_features: [wall_thickness_mm, wall_is_basement]
    required_execution_context: [wall_system_context, highest_applicable_story_height_mm]
    optional_features: []
    formula_ref: TBDY_7_6_1_3_BW_GE_HMAX20
    pass_rule: {ratio_type: actual_over_minimum, ok_if: '>= 1.0'}
    output: {value: wall_thickness_mm, limit: highest_applicable_story_height_mm_div_20, ratio: actual_over_minimum, unit: mm}
    evidence_policy:
      include_features: [wall_thickness_mm, wall_is_basement]
      include_formula: false
      include_source_refs: true
    code_ref: TBDY 2018 §7.6.1.3
  WALL_GEOM_SPECIAL_THICKNESS_GE_200:
    title: Special-branch wall thickness >= 200 mm
    element_type: wall
    category: GEOMETRY
    readiness: {status: partial, reason: Formal rule executable only after system-level §7.6.1.3 applicability is proven.}
    required_features: [wall_thickness_mm, wall_is_basement]
    required_execution_context: [wall_system_context]
    optional_features: []
    formula_ref: TBDY_7_6_1_3_BW_GE_200MM
    pass_rule: {ratio_type: actual_over_minimum, ok_if: '>= 1.0'}
    output: {value: wall_thickness_mm, limit: 200.0, ratio: actual_over_minimum, unit: mm}
    evidence_policy:
      include_features: [wall_thickness_mm, wall_is_basement]
      include_formula: false
      include_source_refs: true
    code_ref: TBDY 2018 §7.6.1.3
  WALL_NET_SECTION_AXIAL_CAPACITY:
    title: Wall net-section axial capacity
    element_type: wall
    category: AXIAL
    readiness: {status: partial, reason: Formal rule exists; Ndm result selection and exact net-section topology must be authoritative.}
    required_features: [wall_is_basement, concrete_fck_mpa]
    required_execution_context: [pier_forces_result_bundle, wall_to_pier_binding, ndm_demand, net_section_topology]
    optional_features: []
    formula_ref: TBDY_7_6_1_1_AC_GE_NDM_DIV_0_35_FCK
    pass_rule: {ratio_type: actual_over_minimum, ok_if: '>= 1.0'}
    output: {value: net_section_area_mm2, limit: required_net_section_area_mm2, ratio: actual_over_minimum, unit: mm2}
    evidence_policy:
      include_features: [wall_is_basement, concrete_fck_mpa]
      include_formula: false
      include_source_refs: true
    code_ref: TBDY 2018 §7.6.1.1
policies:
  WALL_CHECK_PACK_B:
    raw_verified_live_does_not_unlock_derived_quantities: true
    full_tbdy_compliance_status: NOT_EVALUATED
    no_default_general_or_special_branch: true
    execution_context_must_be_canonical_check_input: true
