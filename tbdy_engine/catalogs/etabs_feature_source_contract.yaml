  source_type: display_table
  source_owner: ETABS
  etabs_table_name: Base Reactions
  canonical_table_key: base_reactions
  required_columns:
  - OutputCase
  - CaseType
  - StepType
  - FX
  - FY
  optional_columns:
  - FZ
  - MX
  - MY
  - MZ
  - X
  - Y
  - Z
  row_selection_rule:
  - do not require Story
  - do not require component_id
  - prefer OutputCase == preferred_output_case
  - require numeric FX/FY for force features
  - deterministic first valid row if multiple rows remain
  display_selection_required: true
  preferred_output_case_default: Crack_SeisY_UpSoil
  unit_expectation:
    force: kN
  evidence_required: true
  forbidden_source:
  - excel_production
  - check_result
  - engineering_verdict
  locked_future_scope: false
  source_scope: current_base_reaction_observation
  identity_requirements:
    requires_story: false
    requires_component_id: false
- feature_id: modal_sum_ux
  semantic_role: MODAL_CUMULATIVE_PARTICIPATION
  source_type: display_table
  source_owner: ETABS
  etabs_table_name: Modal Participating Mass Ratios
  canonical_table_key: modal_participating_mass
  required_columns:
  - OutputCase
  - Mode
  - SumUX
  optional_columns:
  - Period
  - UX
  - UY
  - UZ
  - SumUX
  - SumUY
  - SumUZ
  row_selection_rule:
  - use maximum cumulative UX/UY across all available modes
  - do not use fixed Mode 10 as final if later modes exist
  - deterministic maximum cumulative aggregation
  display_selection_required: false
  unit_expectation:
    ratio: dimensionless
  evidence_required: true
  forbidden_source:
  - fixed_mode_10_only
  - excel_production
  - check_result
  - engineering_verdict
  locked_future_scope: false
  aggregation: max_cumulative
  source_scope: current_modal_mass_observation
