metadata:
  contract: Contract Constitution
  version: '1.0'
  sprint: C13.2-P5
  catalog_name: source_feature_readiness_matrix
  status: contract_closure_source_to_feature_readiness
  owner: TBDY Engine
  source_basis: C13.2-P4 promoted verified live source contracts
  safe_to_implement_checks_now: false
  check_unlock_allowed: false
  excel_production_input: false
  runtime_behavior_changed: false
  feature_resolver_changed: false
  check_engine_changed: false
  report_renderer_changed: false
  notes:
  - P5 is a contract-closure/readiness sprint only.
  - The matrix references existing feature ids where they exist and records explicit
    gaps where they do not.
  - No FeatureResolver, CheckEngine, report renderer, runtime, or Excel production
    path is introduced.
  unit_policy:
    status: C13.2-P5_UNIT_POLICY_CLOSED_AT_CONTRACT_LEVEL
    etabs_live_source_unit_context: ACCEPT_VALUES_IN_LIVE_MODEL_API_UNIT_CONTEXT
    raw_source_value_policy: RAW_SOURCE_VALUES_MUST_NOT_BE_SILENTLY_CONVERTED_AT_SOURCE_CONTRACT_LEVEL
    source_contract_silent_conversion_allowed: false
    report_output_may_convert_to_default_display_units: true
    future_feature_snapshot_requirement: CARRY_RAW_AND_NORMALIZED_UNIT_METADATA
    future_check_engine_requirement: MUST_NOT_CONSUME_AMBIGUOUS_RAW_NUMERIC_VALUES_WITHOUT_UNIT_METADATA
    feature_resolver_behavior_changed: false
    check_engine_behavior_changed: false
    checks_implemented: false
    safe_to_implement_checks_now: false
    allowed_units:
    - kN
    - kN.m
    - m
    - mm
    - MPa
    - ratio
    - percent
    - unitless
    - mm2
    default_report_units:
      force: kN
      moment: kN.m
      global_length_elevation: m
      section_dimensions: mm
      deformation_displacement: mm
      drift: ratio or percent, explicitly labeled
      stress_material_strength: MPa
      identity_context: unitless
      modal_participation: ratio
      reinforcement_area: mm2
readiness_status_taxonomy:
- READY_DIRECT_SOURCE
- READY_DERIVED_SOURCE
- READY_SUPPORTING_CONTEXT_ONLY
- BLOCKED_NEEDS_LIVE_PROBE
- BLOCKED_SEMANTIC_REVIEW
- BLOCKED_FEATURE_CONTRACT_MISSING
- OUT_OF_SCOPE_UNSUPPORTED
- LOCKED_CHECK_NOT_ALLOWED
