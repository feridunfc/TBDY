    formula_ref: contract_only_no_formula_in_C1
    pass_rule:
      ratio_type: boolean
      ok_if: 'true'
    status_logic:
      OK: required features resolved and pass_rule satisfied
      WARNING: features resolved only at SCREENING or partial readiness
      FAIL: required features resolved and pass_rule not satisfied
