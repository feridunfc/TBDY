metadata:
  contract: Contract Constitution
  version: '1.0'
  sprint: C1_CONTRACT_HARDENING
  status: hardened_contract
  owner: TBDY Engine
  catalog_name: check_catalog
  notes:
  - Contract-only. No engine/check/ETABS runtime implementation.
  - Production source of truth is live ETABS tables; Excel is fixture/debug/regression
    only.
  - 'Rebar semantics: ETABS_REQUIRED + TBDY_MIN -> GOVERNING_REQUIRED -> ENGINE_SELECTED;
    USER_PROVIDED is explicit only.'
policy:
  must_not_reference_table_keys: true
  must_reference_feature_names_only: true
  c1_no_engine_formulas: true
  check_engine_combo_names: false
ratio_semantics:
  demand_over_capacity:
    pass_when: ratio <= 1.0
  actual_over_required:
    pass_when: ratio >= 1.0
  selected_over_required:
    pass_when: ratio >= 1.0
  required_over_selected:
    pass_when: ratio <= 1.0
  value_over_limit:
    pass_when: ratio <= 1.0
    deprecated_alias_for: value_over_maximum
    must_not_mean: ratio >= 1.0 OK
  limit_over_value:
    pass_when: ratio <= 1.0
  actual_over_minimum:
    pass_when: ratio >= 1.0
  availability:
    pass_when: value exists
  boolean:
    pass_when: condition is true
  value_over_maximum:
    pass_when: ratio <= 1.0
    intended_for: upper_bound_checks
  value_over_minimum:
    pass_when: ratio >= 1.0
    intended_for: lower_bound_checks
