[pytest]
addopts = -p no:ddtrace -p no:anyio -p no:asyncio -p no:cov -p no:json-report -p no:metadata -p no:Faker
markers =
    etabs_smoke: local ETABS COM smoke tests requiring ETABS and an open model
    real_etabs: requires live ETABS/COM on Windows and an open concrete beam model
    legacy_evidence_audit: legacy pre-closure evidence audit tests; not BEAM_RUNTIME_CLOSURE proof
